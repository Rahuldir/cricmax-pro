<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CricMax Pro — Match Viewer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(circle at center,transparent 40%,rgba(0,0,0,0.55) 100%);}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:9999;}
  .top-row{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;}
  .top-left-stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:auto;}
  .top-center{display:flex;justify-content:center;align-items:flex-start;pointer-events:auto;flex:1;min-width:0;}
  .top-right{display:flex;gap:8px;align-items:flex-start;pointer-events:auto;}
  .cluster{display:flex;gap:6px;background:rgba(8,14,28,.85);padding:5px 8px;border-radius:14px;backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);pointer-events:auto;align-items:center;}
  .live{background:#ef4444;color:#fff;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;letter-spacing:1.5px;display:inline-flex;align-items:center;gap:7px;box-shadow:0 0 16px rgba(239,68,68,.75);}
  .live::before{content:'';width:8px;height:8px;background:#fff;border-radius:50%;animation:blink 1s infinite alternate;}
  @keyframes blink{0%{opacity:.3;}100%{opacity:1;}}
  .btn{background:transparent;border:1px solid rgba(255,255,255,.12);color:#cbd5e1;padding:6px 11px;border-radius:8px;font-size:10.5px;font-weight:800;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:rgba(0,230,118,.18);color:#fff;border-color:rgba(0,230,118,.5);}
  .btn.on{background:linear-gradient(135deg,#009270,#00e676);color:#0a0e1a;border-color:transparent;box-shadow:0 0 16px rgba(0,230,118,.6);}
  .ctrl{width:38px;height:38px;border-radius:11px;background:rgba(8,14,28,.85);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(12px);transition:transform .15s;font-family:inherit;pointer-events:auto;}
  .ctrl:active{transform:scale(.92);}
  .ctrl.on{background:linear-gradient(135deg,#009270,#00e676);border-color:transparent;box-shadow:0 0 14px rgba(0,230,118,.5);color:#0a0e1a;}
  .cam-select-center{background:rgba(15,23,42,.92);border:1px solid rgba(0,230,118,.45);color:#00e676;font-size:12px;font-weight:800;padding:9px 16px;border-radius:12px;outline:none;cursor:pointer;font-family:inherit;backdrop-filter:blur(14px);min-width:180px;}
  .cam-select-center option{background:#0b1329;color:#fff;font-weight:700;}
  .menu-btn{background:linear-gradient(135deg,rgba(0,146,112,.9),rgba(0,230,118,.9));border:none;color:#fff;padding:9px 16px;border-radius:12px;font-size:12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(0,230,118,.45);transition:all .2s;font-family:inherit;pointer-events:auto;z-index:10000;position:relative;}
  .menu-btn.on{background:linear-gradient(135deg,#ef4444,#f43f5e);}
  #menuPanel{position:absolute;top:64px;right:14px;width:min(92vw,340px);background:linear-gradient(160deg,rgba(15,23,42,.98),rgba(3,8,16,.99));border:1px solid rgba(0,230,118,.35);border-radius:16px;padding:14px;backdrop-filter:blur(20px);z-index:100001;opacity:0;transform:translateY(-12px) scale(.95);transition:all .25s;visibility:hidden;pointer-events:auto;}
  #menuPanel.open{opacity:1;transform:translateY(0) scale(1);visibility:visible;}
  .menu-section{margin-bottom:14px;}
  .menu-title{font-size:9.5px;font-weight:900;letter-spacing:2px;color:#00e676;text-transform:uppercase;margin-bottom:8px;}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .menu-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .menu-tile{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 8px;color:#e2e8f0;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center;}
  .menu-tile.on{background:linear-gradient(135deg,rgba(0,146,112,.35),rgba(0,230,118,.25));border-color:#00e676;color:#fff;}
  .menu-tile .ico{font-size:16px;line-height:1;}
  .menu-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);margin:12px 0;}
  .menu-tile-cam{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;color:#e2e8f0;font-size:12px;font-weight:800;font-family:inherit;width:100%;outline:none;}
  .menu-tile-cam option{background:#0b1329;color:#fff;font-weight:700;}
  .bottom-wrap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:min(92vw,720px);display:flex;flex-direction:column;gap:8px;pointer-events:auto;z-index:10000;}
  .over-summary{background:rgba(8,18,32,.85);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;color:#cbd5e1;}
  .over-dots{display:flex;gap:6px;align-items:center;}
  .badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;background:rgba(255,255,255,.08);color:#94a3b8;border:1px solid rgba(255,255,255,.15);}
  .badge.dot{background:rgba(148,163,184,.2);}
  .badge.run{background:rgba(2,132,199,.3);color:#38bdf8;border-color:#38bdf8;}
  .badge.four{background:rgba(34,211,238,.35);color:#22d3ee;border-color:#22d3ee;}
  .badge.six{background:rgba(251,191,36,.35);color:#fbbf24;border-color:#fbbf24;}
  .badge.wkt{background:rgba(239,68,68,.5);color:#fff;border-color:#ef4444;}
  .badge.nb{background:rgba(232,121,249,.4);color:#e879f9;border-color:#e879f9;}
  .badge.bye{background:rgba(16,185,129,.3);color:#34d399;border-color:#10b981;}
  .bottom-bar{background:linear-gradient(90deg,rgba(8,18,32,.95),rgba(3,8,16,.98));border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 20px;display:flex;align-items:center;gap:20px;backdrop-filter:blur(18px);color:#fff;font-size:12px;font-weight:800;}
  .bb-team{display:flex;align-items:center;gap:10px;border-right:1px solid rgba(255,255,255,.12);padding-right:16px;}
  .bb-badge{background:#00e676;color:#0a0e1a;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:900;}
  .bb-score{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;}
  .bb-ov{font-size:11px;color:#94a3b8;font-weight:700;}
  .bb-bats{display:flex;flex-direction:column;gap:2px;flex:1;}
  .bb-row{display:flex;justify-content:space-between;font-weight:700;}
  .bb-row.striker{color:#00e676;}
  .bb-bowl{text-align:right;color:#22d3ee;border-left:1px solid rgba(255,255,255,.12);padding-left:16px;font-weight:700;}
  .banner{position:absolute;top:22%;left:50%;transform:translateX(-50%) scale(.6);font-size:clamp(38px,7vw,78px);font-weight:900;font-style:italic;text-transform:uppercase;color:#fff;opacity:0;transition:all .35s;pointer-events:none;text-align:center;line-height:1;}
  .banner.on{transform:translateX(-50%) scale(1);opacity:1;}
  .banner.four{color:#22d3ee;text-shadow:0 0 45px #0891b2,0 8px 24px #000;}
  .banner.six{color:#ff6d00;text-shadow:0 0 45px #fbbf24,0 8px 24px #000;}
  .banner.wkt{color:#ef4444;text-shadow:0 0 45px #7f1d1d,0 8px 24px #000;}
  .banner.run{color:#00e676;text-shadow:0 0 45px #009270,0 8px 24px #000;}
  .speed-tag{position:absolute;top:80px;right:14px;background:rgba(15,23,42,.9);border:1px solid rgba(34,211,238,.4);padding:6px 14px;border-radius:8px;color:#38bdf8;font-family:monospace;font-size:14px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;}
  .speed-tag.on{opacity:1;}
  #wagonWheelCanvas{position:absolute;top:80px;left:14px;width:150px;height:150px;background:rgba(8,15,30,0.88);border:1px solid rgba(255,255,255,0.2);border-radius:50%;pointer-events:auto;display:none;z-index:10001;}
</style>
</head>
<body>

<div class="vignette"></div>

<div class="hud">
  <div class="top-row">
    <div class="top-left-stack">
      <div class="cluster"><div class="live">VR LIVE</div></div>
      <div class="cluster" style="gap:6px;">
        <div class="ctrl on" id="util-snd" onclick="toggleAudio()" title="Sound"><span id="snd-ico">🔊</span></div>
        <div class="ctrl" onclick="triggerReplay()" title="Replay">↻</div>
        <div class="ctrl" onclick="toggleFullscreen()" title="Fullscreen">⛶</div>
      </div>
    </div>
    <div class="top-center">
      <select class="cam-select-center" id="camSel" onchange="setCamera(this.value)">
        <option value="broadcast">📺 TV Broadcast</option>
        <option value="bowler">🎯 Bowler View</option>
        <option value="keeper">🧤 Keeper View</option>
        <option value="slip">👐 Slip Cord</option>
        <option value="side">🎬 Square Side</option>
        <option value="drone">🚁 Drone</option>
        <option value="helmet">⛑️ Helmet Cam</option>
        <option value="follow">⚾ Ball Follow</option>
      </select>
    </div>
    <div class="top-right">
      <button class="btn on" id="btn-dir" onclick="toggleDirector()">🎬 Director</button>
      <button class="menu-btn" id="btn-menu" onclick="toggleMenu(event)"><span class="hamburger">☰</span> MENU</button>
    </div>
  </div>

  <div id="menuPanel">
    <div class="menu-section">
      <div class="menu-title">Navigate</div>
      <div class="menu-grid">
        <button class="menu-tile on" data-pane="pitch" onclick="navTo('pitch')"><span class="ico">🏏</span> 3D Pitch</button>
        <button class="menu-tile" data-pane="scorecard" onclick="navTo('scorecard')"><span class="ico">🃏</span> Card</button>
        <button class="menu-tile" data-pane="analytics" onclick="navTo('analytics')"><span class="ico">📊</span> Analysis</button>
        <button class="menu-tile" data-pane="leaderboards" onclick="navTo('leaderboards')"><span class="ico">📈</span> Stats</button>
      </div>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <div class="menu-title">Environment</div>
      <div class="menu-grid-3">
        <button class="menu-tile on" id="env-day" onclick="setSky('day')"><span class="ico">☀️</span> Day</button>
        <button class="menu-tile" id="env-sunset" onclick="setSky('sunset')"><span class="ico">🌇</span> Sunset</button>
        <button class="menu-tile" id="env-night" onclick="setSky('night')"><span class="ico">🌙</span> Night</button>
      </div>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <div class="menu-title">Camera</div>
      <select class="menu-tile-cam" id="camSelMenu" onchange="setCamera(this.value)">
        <option value="broadcast">📺 TV Broadcast</option>
        <option value="bowler">🎯 Bowler View</option>
        <option value="keeper">🧤 Keeper View</option>
        <option value="slip">👐 Slip Cord</option>
        <option value="side">🎬 Square Side</option>
        <option value="drone">🚁 Drone</option>
        <option value="helmet">⛑️ Helmet Cam</option>
        <option value="follow">⚾ Ball Follow</option>
      </select>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section" style="margin-bottom:0;">
      <div class="menu-title">Utilities</div>
      <div class="menu-grid-3">
        <button class="menu-tile" id="util-wagon" onclick="toggleWagonWheel()"><span class="ico">🕸️</span> Wagon</button>
        <button class="menu-tile" onclick="simFeedScoringTab()"><span class="ico">⚡</span> Feed</button>
        <button class="menu-tile" onclick="toggleMenu(event)"><span class="ico">✕</span> Close</button>
      </div>
    </div>
  </div>

  <div class="speed-tag" id="speedTag">SPEED: -- KM/H</div>
  <canvas id="wagonWheelCanvas" width="300" height="300"></canvas>
  <div class="banner" id="banner">FOUR!</div>

  <div class="bottom-wrap">
    <div class="over-summary">
      <span>THIS OVER:</span>
      <div class="over-dots" id="overDotsContainer"></div>
      <span id="overTotalRuns">0 RUNS</span>
    </div>
    <div class="bottom-bar">
      <div class="bb-team">
        <span class="bb-badge" id="bbAbbr">T1</span>
        <span class="bb-score" id="bbScore">0/0</span>
        <span class="bb-ov" id="bbOvers">(0.0)</span>
      </div>
      <div class="bb-bats">
        <div class="bb-row striker"><span id="bbStriker">Striker*</span><b id="bbStrikerRuns">0(0)</b></div>
        <div class="bb-row"><span id="bbNonStriker">Non-Striker</span><b id="bbNonStrikerRuns">0(0)</b></div>
      </div>
      <div class="bb-bowl">
        <div id="bbBowler">Bowler</div>
        <div id="bbBowlerFigs" style="color:#fff">0.0-0-0-0</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
  var noop = function(){};
  ['updateSparks','updateParticles','updateCrowd'].forEach(function(k){
    if (typeof window[k] === 'undefined') window[k] = noop;
  });
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════
     MODULE SCRIPTS
     ═══════════════════════════════════════════════════════════════ -->
<script src="stadium.js"></script>
<script src="render-boost.js"></script>
<script src="player-upgrades.js"></script>
<script src="shot-fx.js"></script>

<!-- OPTIONAL MODULES — post-fx.js disabled to prevent error spam.
     Replace with the CSS-only version if you want post-processing back. -->
<script>
(function(){
  var OPTIONAL = [
    { src: 'environment.js',     global: 'CricMaxEnvironment'  },
    { src: 'crowd-animation.js', global: 'CricMaxCrowd'        },
    { src: 'particles.js',       global: 'CricMaxParticles'    },
    /* { src: 'post-fx.js',      global: 'CricMaxPostFX'       },  ← disabled */
    { src: 'stadium-detail.js',  global: 'CricMaxStadiumDetail'}
  ];

  var loaded = {};

  OPTIONAL.forEach(function(mod){
    fetch(mod.src, { method: 'HEAD' })
      .then(function(res){
        if (!res.ok){
          console.info('[CricMax] optional module not deployed, skipping: ' + mod.src);
          return;
        }
        var s = document.createElement('script');
        s.src = mod.src;
        s.onload = function(){
          loaded[mod.global] = true;
          console.info('[CricMax] ✅ loaded optional module: ' + mod.src);
        };
        s.onerror = function(){
          console.info('[CricMax] ⚠ failed to execute: ' + mod.src);
        };
        document.head.appendChild(s);
      })
      .catch(function(){
        console.info('[CricMax] optional module unreachable: ' + mod.src);
      });
  });

  window.__CricMaxOptionalLoaded = loaded;
})();
</script>

<script>
(function(){
'use strict';

/* ============================================================
   1. SCENE SETUP
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020713);
scene.fog = new THREE.FogExp2(0x050d24, 0.0055);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 800);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.domElement.style.zIndex = '0';
document.body.appendChild(renderer.domElement);

const stadium = window.CricMaxStadium ? window.CricMaxStadium.build(scene) : null;
const woodTex = window.CricMaxStadium ? window.CricMaxStadium.makeWoodTexture() : null;

/* ═══════════════════════════════════════════════════════════
   BOOT HOOKS
   ═══════════════════════════════════════════════════════════ */
(function bootOptionalModules(){
  const HOOKS = [
    ['CricMaxEnvironment',    'build'],
    ['CricMaxCrowd',          'build'],
    ['CricMaxPlayerUpgrades', 'build'],
    ['CricMaxParticles',      'build'],
    ['CricMaxPostFX',         'build'],
    ['CricMaxStadiumDetail',  'build'],
    ['CricMaxRenderBoost',    'build']
  ];
  let attempts = 0;
  const timer = setInterval(function(){
    attempts++;
    let remaining = 0;
    HOOKS.forEach(function(pair){
      const mod = window[pair[0]];
      if (mod && typeof mod[pair[1]] === 'function' && !mod.__cricmaxBooted){
        try {
          mod[pair[1]](scene, renderer, camera);
          mod.__cricmaxBooted = true;
          console.info('[CricMax] booted ' + pair[0]);
        } catch(err){
          console.warn('[CricMax] ' + pair[0] + ' boot error:', err);
          mod.__cricmaxBooted = true;
        }
      }
      if (!mod || !mod.__cricmaxBooted) remaining++;
    });
    if (remaining === 0 || attempts > 20){ clearInterval(timer); }
  }, 250);
})();

/* ============================================================
   2. UI HANDLERS
   ============================================================ */
let menuOpen = false;
function toggleMenu(e){
  if (e && e.stopPropagation) e.stopPropagation();
  menuOpen = !menuOpen;
  const panel = document.getElementById('menuPanel');
  const btn = document.getElementById('btn-menu');
  if (panel) panel.classList.toggle('open', menuOpen);
  if (btn) btn.classList.toggle('on', menuOpen);
}
document.addEventListener('click', function(e){
  if (!menuOpen) return;
  const panel = document.getElementById('menuPanel');
  const btn = document.getElementById('btn-menu');
  if (panel && panel.contains(e.target)) return;
  if (btn && btn.contains(e.target)) return;
  menuOpen = false;
  if (panel) panel.classList.remove('open');
  if (btn) btn.classList.remove('on');
}, true);

function setSky(mode){
  ['day','sunset','night'].forEach(m => {
    const b = document.getElementById('env-' + m);
    if (b) b.classList.toggle('on', m === mode);
  });
  if (stadium && stadium.setSky) stadium.setSky(mode);
  if (window.CricMaxEnvironment && typeof window.CricMaxEnvironment.setSky === 'function'){
    try { window.CricMaxEnvironment.setSky(mode); } catch(e){}
  }
}
setSky('day');

function navTo(pane){
  document.querySelectorAll('.menu-tile[data-pane]').forEach(t => {
    t.classList.toggle('on', t.getAttribute('data-pane') === pane);
  });
  if (pane === 'pitch'){ toggleMenu(); return; }
  try { window.parent.postMessage({ type: 'CM_NAV_TO', pane: pane }, '*'); } catch(e){}
  toggleMenu();
}

/* ============================================================
   3. KINEMATIC PLAYER MODEL
   ============================================================ */
const SKIN = [0xd4a373, 0xc68642, 0xe0ac69, 0x8d5524, 0xf1c27d];
const PAD  = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
const SHOE = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 });
const HELM = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });
const GLOVE= new THREE.MeshStandardMaterial({ color: 0x1e40af, roughness: 0.5 });

function makePlayer(opts){
  opts = opts || {};
  const jersey = opts.jersey || 0x0284c7;
  const isBat = !!opts.batsman;
  const isKeeper = !!opts.keeper;
  const skin = SKIN[(opts.skinIndex || 0) % SKIN.length];

  const rig = new THREE.Group();
  rig.jerseyMat = new THREE.MeshStandardMaterial({ color: jersey, roughness: 0.55 });
  rig.skinMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.55 });
  rig.idlePhase = Math.random() * Math.PI * 2;
  rig.fidget = 1.4 + Math.random() * 1.2;

  const shadowCv = document.createElement('canvas');
  shadowCv.width = shadowCv.height = 64;
  const sctx = shadowCv.getContext('2d');
  const sgrad = sctx.createRadialGradient(32, 32, 3, 32, 32, 32);
  sgrad.addColorStop(0, 'rgba(0,0,0,.68)');
  sgrad.addColorStop(1, 'rgba(0,0,0,0)');
  sctx.fillStyle = sgrad; sctx.fillRect(0, 0, 64, 64);
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1.1, 0.8),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCv), transparent: true, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.028;
  rig.add(shadow);

  function buildLeg(xOff){
    const leg = new THREE.Group();
    leg.position.set(xOff, 0.82, 0);
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.092, 0.078, 0.38, 8), rig.jerseyMat);
    thigh.position.y = -0.19; thigh.castShadow = true; leg.add(thigh);
    const knee = new THREE.Mesh(new THREE.SphereGeometry(0.082, 10, 10), isBat ? PAD : rig.jerseyMat);
    knee.position.y = -0.38; leg.add(knee);
    const shin = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.40, 0.16), isBat ? PAD : rig.jerseyMat);
    shin.position.set(0, -0.58, 0.02); shin.castShadow = true; leg.add(shin);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.25), SHOE);
    foot.position.set(0, -0.78, 0.04); foot.castShadow = true; leg.add(foot);
    leg.userData = { thigh, shin };
    return leg;
  }
  rig.legL = buildLeg(-0.13); rig.legR = buildLeg(0.13);
  rig.add(rig.legL); rig.add(rig.legR);

  const torso = new THREE.Group();
  torso.position.y = 0.91;

class Fielder {
  constructor(name, x, z, skinIdx){
    this.name = name;
    this.home = new THREE.Vector3(x, 0, z);
    this.target = this.home.clone();
    this.state = 'idle';
    this.throwTimer = 0;
    this.rig = makePlayer({ jersey: 0xdc2626, skinIndex: skinIdx });
    this.rig.position.copy(this.home);
    this.rig.rotation.y = Math.atan2(this.home.x, this.home.z);
    scene.add(this.rig);
  }
  reset(){ this.state = 'returning'; this.target.copy(this.home); }
  chase(p){ this.state = 'chasing'; this.target.copy(p); }
  update(dt, t){
    if (this.state === 'idle'){
      const sway = Math.sin(t * this.rig.fidget + this.rig.idlePhase);
      this.rig.torso.rotation.y = sway * 0.08;
      this.rig.armL.rotation.x = -0.2 + sway * 0.06;
      this.rig.armR.rotation.x = -0.2 - sway * 0.06;
      return;
    }
    const dist = this.rig.position.distanceTo(this.target);
    if (this.state === 'chasing'){
      if (dist > 0.5){
        const dir = new THREE.Vector3().subVectors(this.target, this.rig.position).normalize();
        this.rig.position.addScaledVector(dir, 10 * dt);
        this.rig.lookAt(this.target.x, this.rig.position.y, this.target.z);
        this.rig.torso.rotation.x = 0.2;
        const cycle = Math.sin(t * 18);
        this.rig.legL.userData.thigh.rotation.x = cycle * 0.8;
        this.rig.legR.userData.thigh.rotation.x = -cycle * 0.8;
        this.rig.armL.rotation.x = -cycle * 0.9;
        this.rig.armR.rotation.x = cycle * 0.9;
        this.rig.position.y = Math.abs(Math.sin(t * 18)) * 0.05;
      } else {
        this.state = 'throwing';
        this.throwTimer = 0;
      }
    } else if (this.state === 'throwing'){
      this.throwTimer += dt;
      this.rig.legL.userData.thigh.rotation.x = 0;
      this.rig.legR.userData.thigh.rotation.x = 0;
      this.rig.position.y = 0;
      if (this.throwTimer < 0.25){
        this.rig.torso.rotation.x = THREE.MathUtils.lerp(0.2, 0.8, this.throwTimer / 0.25);
        this.rig.armR.rotation.x = THREE.MathUtils.lerp(0, 1.5, this.throwTimer / 0.25);
      } else if (this.throwTimer < 0.5){
        const p = (this.throwTimer - 0.25) / 0.25;
        this.rig.torso.rotation.x = THREE.MathUtils.lerp(0.8, -0.2, p);
        this.rig.armR.rotation.x = THREE.MathUtils.lerp(1.5, -2.0, p);
      } else if (this.throwTimer < 0.7){
        const p = (this.throwTimer - 0.5) / 0.2;
        this.rig.armR.rotation.x = THREE.MathUtils.lerp(-2.0, 1.5, p);
      } else if (this.throwTimer > 1.2){
        this.reset();
      }
    } else if (this.state === 'returning'){
      if (dist > 0.5){
        const dir = new THREE.Vector3().subVectors(this.target, this.rig.position).normalize();
        this.rig.position.addScaledVector(dir, 6 * dt);
        this.rig.lookAt(this.target.x, this.rig.position.y, this.target.z);
        this.rig.torso.rotation.x = 0.1;
        const cycle = Math.sin(t * 12);
        this.rig.legL.userData.thigh.rotation.x = cycle * 0.5;
        this.rig.legR.userData.thigh.rotation.x = -cycle * 0.5;
        this.rig.armL.rotation.x = -cycle * 0.5;
        this.rig.armR.rotation.x = cycle * 0.5;
      } else {
        this.state = 'idle';
        this.rig.position.y = 0;
        this.rig.torso.rotation.set(0,0,0);
        this.rig.legL.userData.thigh.rotation.x = 0;
        this.rig.legR.userData.thigh.rotation.x = 0;
        this.rig.armL.rotation.x = 0;
        this.rig.armR.rotation.x = 0;
        this.rig.rotation.y = Math.atan2(this.home.x, this.home.z);
      }
    }
  }
}

  }
  update(dt){
    if (!this.flying) return;
    [...this.stumps, ...this.bails].forEach(item => {
      item.vel.y -= 9.8 * dt * 1.5; item.mesh.position.addScaledVector(item.vel, dt);
      item.mesh.rotation.x += item.rot.x * dt; item.mesh.rotation.y += item.rot.y * dt; item.mesh.rotation.z += item.rot.z * dt;
      if (item.mesh.position.y < 0.05){ item.mesh.position.y = 0.05; item.vel.y *= -0.35; item.vel.x *= 0.7; item.vel.z *= 0.7; }
    });
  }
  reset(){
    this.flying = false;
    this.stumps.forEach(s => { s.mesh.position.copy(s.base); s.mesh.rotation.set(0,0,0); s.vel.set(0,0,0); });
    this.bails.forEach(b => { b.mesh.position.copy(b.base); b.mesh.rotation.set(0,0,Math.PI/2); b.vel.set(0,0,0); });
  }
}

const RunningState = {
  active: false,
  totalRuns: 0,
  progress: 0,
  durationPerRun: 1.35,
  update(dt){
    if (!this.active) return;
    this.progress += dt / this.durationPerRun;

    if (this.progress >= this.totalRuns){
      this.active = false;
      const swapped = this.totalRuns % 2 === 1;
      if (swapped){
        strikerBat.position.set(-1.2, 0, -8.8); strikerBat.rotation.y = Math.PI / 2;
        nonStrikerBat.position.set(0.35, 0, 8.8); nonStrikerBat.rotation.y = -Math.PI / 2;
      } else {
        strikerBat.position.set(0.35, 0, 8.8); strikerBat.rotation.y = -Math.PI / 2;
        nonStrikerBat.position.set(-1.2, 0, -8.8); nonStrikerBat.rotation.y = Math.PI / 2;
      }
      [strikerBat, nonStrikerBat].forEach(b => {
        b.torso.rotation.set(0,0,0);
        if (b.batPivot) b.batPivot.rotation.set(-Math.PI/4, 0, 0);
        b.legL.userData.thigh.rotation.x = 0;
        b.legR.userData.thigh.rotation.x = 0;
        b.armL.rotation.x = 0;
        b.armR.rotation.x = 0;
        b.position.y = 0;
      });
      return;
    }

    const lap = this.progress;
    const currentLap = Math.floor(lap);
    const frac = lap - currentLap;
    const goingAtoB = currentLap % 2 === 0;

    const sZ = goingAtoB ? THREE.MathUtils.lerp(8.8, -8.8, frac) : THREE.MathUtils.lerp(-8.8, 8.8, frac);
    const nZ = goingAtoB ? THREE.MathUtils.lerp(-8.8, 8.8, frac) : THREE.MathUtils.lerp(8.8, -8.8, frac);

    strikerBat.position.set(0.6, 0, sZ);
    strikerBat.rotation.y = goingAtoB ? Math.PI : 0;
    nonStrikerBat.position.set(-0.6, 0, nZ);
    nonStrikerBat.rotation.y = goingAtoB ? 0 : Math.PI;

    const isLastRun = currentLap === (this.totalRuns - 1);
    const isSliding = isLastRun && (frac > 0.85);

    [strikerBat, nonStrikerBat].forEach(b => {
      if (isSliding) {
        b.torso.rotation.x = 0.55;
        b.armR.rotation.x = -1.5;
        if (b.batPivot) b.batPivot.rotation.x = -Math.PI / 1.5;
        b.position.y = -0.1;
        b.legL.userData.thigh.rotation.x = -0.5;
        b.legR.userData.thigh.rotation.x = 0.2;
      } else {
        b.torso.rotation.x = 0.25;
        if (b.batPivot) b.batPivot.rotation.x = -Math.PI / 4;
        const cycle = Math.sin(lap * Math.PI * 14);
        b.legL.userData.thigh.rotation.x = cycle * 0.9;
        b.legR.userData.thigh.rotation.x = -cycle * 0.9;
        b.armL.rotation.x = -cycle * 0.9;
        b.armR.rotation.x = cycle * 0.9;
        b.position.y = Math.abs(cycle) * 0.08;
      }
    });
  }
};

function determineShotAndLength(runs, isSpin, isWkt, isCatch, wwAngle) {
  const lengths = [
    { type: 'yorker', pZ: 8.5 },
    { type: 'full', pZ: 7.5 },
    { type: 'good', pZ: 5.5 },
    { type: 'short', pZ: 2.5 }
  ];
  let length = lengths[Math.floor(Math.random() * lengths.length)];
  if (isSpin) length = { type: 'good', pZ: 4.8 };

  let shotType = 'defend';
  let peakHeight = 0.5;
  let finalDist = 10;

  let deg = (wwAngle * 180) / Math.PI;
  if (deg < 0) deg += 360;
  const isOffside = (deg > 0 && deg < 180);
  const isStraight = (deg > 140 && deg < 220);
  const isBehind = (deg < 40 || deg > 320);

  if (isWkt && !isCatch) {
     shotType = 'defend';
     finalDist = 2;
  } else if (runs === 6) {
      peakHeight = 15;
      finalDist = 75 + Math.random() * 10;
      if (isSpin && !isOffside) shotType = 'sweep';
      else if (length.type === 'short' && !isOffside) shotType = 'pull';
      else shotType = 'lofted_straight';
  } else if (runs === 4) {
      peakHeight = 1.2;
      finalDist = 65;
      if (isSpin && !isOffside) shotType = 'sweep';
      else if (isOffside && length.type === 'short') shotType = 'cut';
      else if (isOffside && !isBehind) shotType = 'cover_drive';
      else if (isStraight) shotType = 'straight_drive';
      else shotType = 'pull';
  } else if (runs > 0) {
      peakHeight = 0.8;
      finalDist = 15 + (runs * 10);
      if (isOffside && !isBehind) shotType = 'cover_drive';
      else if (isStraight) shotType = 'on_drive';
      else shotType = 'glance';
  } else {
      peakHeight = 0.3;
      finalDist = 10;
      shotType = Math.random() > 0.3 ? 'defend' : 'leave';
  }

  if (isCatch) {
     peakHeight = 6;
     finalDist = 35;
     shotType = 'lofted_straight';
  }

  return { length, shotType, peakHeight, finalDist };
}

function isInningsOrMatchOver(m){
  if (!m) return false;
  if (m.matchOver === true)       return true;
  if (m.isMatchOver === true)     return true;
  if (m.matchEnded === true)      return true;
  if (m.matchCompleted === true)  return true;
  if (m.inningsOver === true)     return true;
  if (m.isInningsOver === true)   return true;
  if (m.inningsEnded === true)    return true;
  if (m.inningsComplete === true) return true;
  if (m.ended === true)           return true;
  if (m.isComplete === true)      return true;

  if (typeof m.status === 'string'){
    const s = m.status.toLowerCase().trim();
    if (s === 'completed' || s === 'finished' || s === 'ended' ||
        s === 'over'      || s === 'abandoned' || s === 'complete' ||
        s === 'match over'|| s === 'innings over' || s === 'result') {
      return true;
    }
  }
  if (typeof m.result === 'string' && m.result.length > 0){
    const r = m.result.toLowerCase();
    if (r !== 'in progress' && r !== 'live' && r !== 'tbd') return true;
  }
  if (typeof m.wickets === 'number' && m.wickets >= 10) return true;
  if (typeof m.oversLimit === 'number' && typeof m.legalBalls === 'number'){
    if (m.legalBalls >= m.oversLimit * 6) return true;
  }
  if (typeof m.target === 'number' && typeof m.runs === 'number'){
    if (m.runs >= m.target) return true;
  }
  return false;
}

function playBall(shot){
  const isReplay = shot && shot.__isReplay === true;

  if (shot && shot.__isReplay) delete shot.__isReplay;

  strikerBat.torso.rotation.set(0,0,0);
  strikerBat.head.rotation.y = 0;
  strikerBat.legL.userData.thigh.rotation.x = 0;
  strikerBat.legR.userData.thigh.rotation.x = 0;
  strikerBat.armL.rotation.x = 0;
  strikerBat.armR.rotation.x = 0;

  nonStrikerBat.position.set(-1.2, 0, -8.8);
  nonStrikerBat.rotation.set(0, Math.PI/2, 0);
  RunningState.active = false;

  const runs = shot.runs || 0;
  const isWkt = shot.isWicket || shot.isOut;
  const isCatch = shot.isCatch || shot.wicketType === 'caught';
  const bowlerType = shot.bowlerType || 'fast_pace';
  const isSpin = bowlerType === 'spin' || bowlerType === 'off_spin' || bowlerType === 'leg_spin';

  let wwAngle = Math.random() * Math.PI * 2;
  if (shot.angle !== undefined && shot.angle !== null) {
      wwAngle = parseFloat(shot.angle);
  }
  currentShotAngle = wwAngle;

  const phys = determineShotAndLength(runs, isSpin, isWkt, isCatch, wwAngle);
  const animPose = SHOT_KINEMATICS[phys.shotType] || SHOT_KINEMATICS.defend;
  
  const pitchZ = phys.length.pZ;
  const pitchX = (Math.random() - 0.5) * 0.4;
  const hitX = 0.35 + Math.sin(wwAngle) * phys.finalDist;
  const hitZ = 8.8 + Math.cos(wwAngle) * phys.finalDist;

  recordShotForWagon(wwAngle, runs, !!(isWkt || isCatch));

  let runningPending = (runs > 0 && runs < 4 && !isWkt);
  let runningStarted = false;
  const RUNNING_START_DELAY = 200;

  const hitPoint = new THREE.Vector3(hitX, 0, hitZ);
  let fielderDispatched = false;

  const speedVal = shot.ballSpeed || (isSpin ? (85 + Math.random()*10).toFixed(1) : (135 + Math.random()*15).toFixed(1));
  const sTag = document.getElementById('speedTag');
  if (sTag) {
    sTag.innerText = 'SPEED: ' + speedVal + ' KM/H';
    sTag.classList.add('on');
  }

  const T_RELEASE = 700;
  const T_PITCH   = 1000;
  const T_CONTACT = 1250;
  const flightTime = (runs === 6) ? 4000 : (runs === 4) ? 2500 : 3000;
  const T_END = T_CONTACT + Math.max(flightTime, animPose.followTime + 400);

  const T_SHOT_START = T_CONTACT - animPose.prepTime;
  const T_FOLLOW_END = T_CONTACT + animPose.followTime;

  const start = performance.now();
  let bounced = false, contacted = false;

  function loop(now){
    const elapsed = now - start;

    /* Bat Swing Kinematics */
    if (strikerBat.batPivot && !isWkt){
      const pose = animPose.pose;
      if (elapsed >= T_SHOT_START && elapsed < T_CONTACT){
        const p = (elapsed - T_SHOT_START) / animPose.prepTime;
        strikerBat.batPivot.rotation.x = THREE.MathUtils.lerp(-Math.PI/4, pose.batX, p);
        strikerBat.batPivot.rotation.z = THREE.MathUtils.lerp(0, pose.batZ, p);
        strikerBat.torso.rotation.y = THREE.MathUtils.lerp(0, pose.torsoY, p);
        strikerBat.torso.rotation.x = THREE.MathUtils.lerp(0, pose.lean, p);
        strikerBat.legL.userData.thigh.rotation.x = THREE.MathUtils.lerp(0, -pose.stride, p);
        if (pose.dropKnee) strikerBat.position.y = THREE.MathUtils.lerp(0, -0.3, p);
      }
      else if (elapsed >= T_CONTACT && elapsed < T_FOLLOW_END){
        const p = (elapsed - T_CONTACT) / animPose.followTime;
        strikerBat.batPivot.rotation.x = THREE.MathUtils.lerp(pose.batX, pose.batX + 0.5, p);
        if (pose.dropKnee) strikerBat.position.y = THREE.MathUtils.lerp(-0.3, 0, p);
      }
    }

    /* Ball Trajectory */
    if (elapsed < T_RELEASE){
      const t = elapsed / T_RELEASE;
      bowler.position.x = THREE.MathUtils.lerp(1.5, 0.55, t);
      bowler.position.z = THREE.MathUtils.lerp(-22, -9.8, t);
      bowler.armR.rotation.x = -Math.PI * 4 * t;
      bowler.armL.rotation.x = Math.PI * 4 * t;
      ball.position.set(bowler.position.x + 0.3, 2.0, bowler.position.z);
      if (isWkt || isCatch || runs >= 4) playThud(0.3 + t * 0.4);
    }
    else if (elapsed < T_PITCH){
      const t = (elapsed - T_RELEASE) / (T_PITCH - T_RELEASE);
      ball.position.x = THREE.MathUtils.lerp(0.55, pitchX, t);
      ball.position.z = THREE.MathUtils.lerp(-9.8, pitchZ, t);
      ball.position.y = THREE.MathUtils.lerp(2.0, 0.04, t * t);
    }
    else if (elapsed < T_CONTACT){
      const t = (elapsed - T_PITCH) / (T_CONTACT - T_PITCH);
      if (!bounced){
        playThud(1.0);
        bounced = true;
        if (window.fxDustPuff) window.fxDustPuff(ball.position.x, 0.05, ball.position.z);
      }
      ball.position.x = THREE.MathUtils.lerp(pitchX, strikerBat.position.x - 0.1, t);
      ball.position.z = THREE.MathUtils.lerp(pitchZ, 8.8, t);
      ball.position.y = 0.04 + Math.sin(t * Math.PI * 0.5) * 0.9;
    }
    else if (elapsed < T_END){
      const t = (elapsed - T_CONTACT) / flightTime;
      if (!contacted){
        contacted = true;
        if (isWkt && !isCatch){ playStumps(); strikerWicket.shatter(); }
        else if (phys.shotType !== 'leave') playBatCrack((runs===6)? 1 : (runs===4)? 0.85 : 0.5);

        /* Spark burst + trail start on contact */
        const sparkColor = isWkt ? 0xff4444
                         : runs >= 6 ? 0xff6d00
                         : runs >= 4 ? 0x22d3ee
                         : 0xffcc44;
        if (window.fxSparkBurst) window.fxSparkBurst(ball.position.x, ball.position.y, ball.position.z, sparkColor);
        if (runs > 0 && window.fxTrailStart) window.fxTrailStart();

        if (runs > 0 && runs < 4 && !isWkt && !fielderDispatched){
          fielderDispatched = true;
          let closest = fielders[0], minD = 9999;
          fielders.forEach(f => {
            const d = f.home.distanceTo(hitPoint);
            if (d < minD){ minD = d; closest = f; }
          });
          if (closest) closest.chase(hitPoint);
        }
      }

      /* Batsman runs 200ms AFTER contact */
      if (runningPending && !runningStarted && elapsed >= T_CONTACT + RUNNING_START_DELAY){
        runningStarted = true;
        RunningState.active = true;
        RunningState.totalRuns = runs;
        RunningState.progress = 0;
      }

      if (directorOn){
        if (runs >= 4){
          camPos.lerp(new THREE.Vector3(ball.position.x * 0.4, 14, ball.position.z - 20), 0.05);
          camTarget.lerp(ball.position, 0.08);
        } else if (isWkt){
          camPos.lerp(new THREE.Vector3(0, 2.2, 14.5), 0.06);
          camTarget.lerp(new THREE.Vector3(0, 1.2, 8.8), 0.08);
        }
      }

      if (isWkt && !isCatch){
        ball.position.set(0.1, 0.3, 10.4);
      } else {
        ball.position.x = THREE.MathUtils.lerp(strikerBat.position.x, hitX, t);
        ball.position.z = THREE.MathUtils.lerp(8.8, hitZ, t);
        ball.position.y = 0.05 + 4 * phys.peakHeight * t * (1 - t);
      }
    } else {
      if (!RunningState.active){
        anim = null; ball.visible = false;
        if (window.fxTrailStop) window.fxTrailStop();
        if (sTag) sTag.classList.remove('on');
        return;
      }
      if (elapsed >= T_END + 3000) {
        anim = null; ball.visible = false;
        if (window.fxTrailStop) window.fxTrailStop();
        if (sTag) sTag.classList.remove('on');
        return;
      }
    }

    /* Publish ball position for trail sampling */
    window.__cricmaxBallPos = ball.position;

    anim = requestAnimationFrame(loop);
  }
  anim = requestAnimationFrame(loop);

  setTimeout(() => {
    const b = document.getElementById('banner');
    if (!b) return;
    b.className = 'banner on';
    if (isCatch) { b.innerText = 'WHAT A CATCH!'; b.classList.add('wkt'); }
    else if (isWkt) { b.innerText = 'BOWLED!'; b.classList.add('wkt'); }
    else if (runs===6) { b.innerText = 'MAXIMUM!'; b.classList.add('six'); }
    else if (runs===4) { b.innerText = 'FOUR!'; b.classList.add('four'); }
    else { b.innerText = runs > 0 ? runs + ' RUNS' : 'DOT BALL'; b.classList.add('run'); }
    setTimeout(() => b.classList.remove('on'), 2400);
  }, 1300);
}

/* ============================================================
   10. SCORECARD & OVER SUMMARY
   ============================================================ */
function renderOverDots(ballTags){
  const container = document.getElementById('overDotsContainer');
  const totalEl = document.getElementById('overTotalRuns');
  if (!container) return;
  container.innerHTML = '';
  let overRuns = 0;
  const tags = Array.isArray(ballTags) ? ballTags : [];

  for (let i = 0; i < 6; i++){
    const tag = tags[i] !== undefined && tags[i] !== null ? String(tags[i]) : null;
    const dot = document.createElement('div');
    dot.className = 'badge dot';

    if (tag !== null && tag !== ''){
      const isWkt = tag.indexOf('W') >= 0;
      const isWd = tag.indexOf('Wd') >= 0;
      const isNb = tag.indexOf('Nb') >= 0;
      const isBye = /B$/.test(tag) && !isNb;
      const isLb = /Lb$/i.test(tag);

      if (isWkt){ dot.className = 'badge wkt'; dot.innerText = 'W'; }
      else if (isWd){ const n = parseInt(tag) || 1; dot.className = 'badge nb'; dot.innerText = n > 1 ? String(n) : 'wd'; overRuns += n; }
      else if (isNb){ const n = parseInt(tag) || 1; dot.className = 'badge nb'; dot.innerText = n > 1 ? String(n) : 'nb'; overRuns += n; }
      else if (isBye || isLb){ const n = parseInt(tag) || 0; dot.className = 'badge bye'; dot.innerText = n > 0 ? String(n) : 'b'; overRuns += n; }
      else if (tag === '4'){ dot.className = 'badge four'; dot.innerText = '4'; overRuns += 4; }
      else if (tag === '6'){ dot.className = 'badge six'; dot.innerText = '6'; overRuns += 6; }
      else {
        const n = parseInt(tag) || 0;
        if (n === 0){ dot.className = 'badge dot'; dot.innerText = '0'; }
        else { dot.className = 'badge run'; dot.innerText = String(n); overRuns += n; }
      }
    } else {
      dot.innerText = '·';
    }
    container.appendChild(dot);
  }
  if (totalEl) totalEl.innerText = overRuns + ' RUNS';
}

function applyMatch(m){
  if (!m) return;
  currentMatchState = m;

  /* Auto-reset flag if legalBalls went backwards (new innings / new match) */
  const curLB = m.legalBalls || 0;
  if (prevLegalBalls > 0 && curLB < prevLegalBalls){
    window.__cricmaxInningsOver = false;
    console.info('[CricMax] 🔄 New innings detected — flag reset');
  }
  prevLegalBalls = curLB;

  const over = isInningsOrMatchOver(m);
  if (over !== window.__cricmaxInningsOver){
    window.__cricmaxInningsOver = over;
    if (over){
      console.info('[CricMax] 🏁 Innings/Match ended — new deliveries blocked');
    } else {
      console.info('[CricMax] ▶ Innings/Match active — deliveries enabled');
    }
  }

  const abbr = m.teamBattingAbbr || (m.teamBatting ? m.teamBatting.substring(0,3).toUpperCase() : 'T1');
  const balls = m.legalBalls || 0;
  const setTxt = (id, v) => { const el = document.getElementById(id); if (el) el.innerText = v; };

  setTxt('bbAbbr', abbr);
  setTxt('bbScore', `${m.runs || 0}/${m.wickets || 0}`);
  setTxt('bbOvers', `(${Math.floor(balls / 6)}.${balls % 6})`);

  const st = m.striker || 'Striker';
  const nst = m.nonStriker || 'Non-Striker';
  const sB = (m.batters && m.batters[st]) || { runs: 0, balls: 0 };
  const nB = (m.batters && m.batters[nst]) || { runs: 0, balls: 0 };

  setTxt('bbStriker', st + '*');
  setTxt('bbStrikerRuns', `${sB.runs || 0}(${sB.balls || 0})`);
  setTxt('bbNonStriker', nst);
  setTxt('bbNonStrikerRuns', `${nB.runs || 0}(${nB.balls || 0})`);

  const bwName = m.currentBowler || 'Bowler';
  const bw = (m.bowlers && m.bowlers[bwName]) || { balls: 0, maidens: 0, runs: 0, wickets: 0 };
  setTxt('bbBowler', bwName);
  setTxt('bbBowlerFigs', `${Math.floor((bw.balls || 0) / 6)}.${(bw.balls || 0) % 6}-${bw.maidens || 0}-${bw.runs || 0}-${bw.wickets || 0}`);

  if (Array.isArray(m.currentOverBalls)){
    renderOverDots(m.currentOverBalls);
  } else if (Array.isArray(m.recentBalls)){
    renderOverDots(m.recentBalls.slice(-6));
  }
}

/* ============================================================
   11. UNIVERSAL MULTI-CHANNEL DATA SYNC
   ============================================================ */
let lastSeenBalls = -1;
function handleNewMatchData(m) {
  if (!m || !m.teamBatting) return;
  applyMatch(m);
  const shots = m.shotLog || [];
  const total = shots.length;

  if (lastSeenBalls < 0) {
    lastSeenBalls = total;
    return;
  }
  if (total > lastSeenBalls) {
    lastSeenBalls = total;
    const last = shots[total - 1];
    if (last){
      /* A new shot in the log = innings is active = reset flag & play */
      window.__cricmaxInningsOver = false;
      playBall(last);
    }
  }
}

window.addEventListener('message', ev => {
  const d = ev.data || {};
  if ((d.type === 'SYNC_MATCH_STATE' || d.type === 'match_state') && (d.payload || d.match)) {
    applyMatch(d.payload || d.match);
  }
  if (d.type === 'TRIGGER_DELIVERY' && d.shot) {
    /* Parent explicitly asked us to render this — always obey */
    window.__cricmaxInningsOver = false;
    playBall(d.shot);
  }
});

try {
  const bc = new BroadcastChannel('cricmax_live');
  bc.onmessage = ev => {
    const d = ev.data || {};
    if (d.type === 'match_state' && d.match) {
      handleNewMatchData(d.match);
    }
  };
} catch(e){}

  broadcast: { pos: new THREE.Vector3(0,16,32), target: new THREE.Vector3(0,1.2,2) },
  bowler:    { pos: new THREE.Vector3(0,4.2,-22), target: new THREE.Vector3(0,1.0,9) },
  keeper:    { pos: new THREE.Vector3(0,2.2,15), target: new THREE.Vector3(0,1.2,-5) },
  slip:      { pos: new THREE.Vector3(3.0,2.2,14.0), target: new THREE.Vector3(0.35,1.0,8.8) },
  helmet:    { pos: new THREE.Vector3(0.35,1.75,8.8), target: new THREE.Vector3(0,1.0,-10) },
  side:      { pos: new THREE.Vector3(26,5,8), target: new THREE.Vector3(0,1,8) },
  drone:     { pos: new THREE.Vector3(0,55,0.1), target: new THREE.Vector3(0,0,0) },
  follow:    { pos: new THREE.Vector3(0,8,-6), target: new THREE.Vector3(0,0.5,9) }
};
let activeCam = 'broadcast', directorOn = true;
const camPos = CAM_MODES.broadcast.pos.clone(), camTarget = CAM_MODES.broadcast.target.clone();

function syncCamSelectors(mode){

/* ------------------------------------------------------------
   WAGON WHEEL
   ------------------------------------------------------------ */
const wagonCanvas = document.getElementById('wagonWheelCanvas');
const wagonCtx = wagonCanvas ? wagonCanvas.getContext('2d') : null;
const shotAngles = [];

function recordShotForWagon(angle, runs, isWicket){
  shotAngles.push({ angle: angle, runs: runs, isWicket: !!isWicket });
  if (shotAngles.length > 200) shotAngles.shift();
  if (wagonCanvas && wagonCanvas.style.display === 'block') drawWagonWheel();
}

function drawWagonWheel(){
  if (!wagonCtx || !wagonCanvas) return;
  const W = wagonCanvas.width, H = wagonCanvas.height;
  const cx = W / 2, cy = H / 2, R = W / 2 - 14;

  wagonCtx.clearRect(0, 0, W, H);

  wagonCtx.strokeStyle = 'rgba(255,255,255,0.12)';
  wagonCtx.lineWidth = 2;
  [0.35, 0.65, 1].forEach(f => {
    wagonCtx.beginPath(); wagonCtx.arc(cx, cy, R * f, 0, Math.PI * 2); wagonCtx.stroke();
  });

  for (let i = 0; i < 12; i++){
    const a = i * Math.PI / 6;
    wagonCtx.beginPath();
    wagonCtx.moveTo(cx, cy);
    wagonCtx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    wagonCtx.stroke();
  }

  wagonCtx.fillStyle = 'rgba(0,230,118,0.16)';
  wagonCtx.fillRect(cx - 9, cy - R, 18, R * 2);

  shotAngles.forEach(s => {
    const len = s.runs >= 6 ? 1.0 : s.runs >= 4 ? 0.9 : s.runs > 0 ? 0.62 : 0.32;
    const sx = cx + Math.sin(s.angle) * R * len;
    const sy = cy + Math.cos(s.angle) * R * len;

    const col = s.isWicket ? '#ef4444'
              : s.runs >= 6 ? '#ff6d00'
              : s.runs >= 4 ? '#22d3ee'
              : s.runs > 0  ? '#00e676'
              : '#64748b';

    wagonCtx.strokeStyle = col;
    wagonCtx.lineWidth = s.runs >= 4 ? 3 : 2;
    wagonCtx.beginPath(); wagonCtx.moveTo(cx, cy); wagonCtx.lineTo(sx, sy); wagonCtx.stroke();

    wagonCtx.fillStyle = col;
    wagonCtx.beginPath(); wagonCtx.arc(sx, sy, 3.5, 0, Math.PI * 2); wagonCtx.fill();
  });

  wagonCtx.fillStyle = '#00e676';
  wagonCtx.beginPath(); wagonCtx.arc(cx, cy, 5, 0, Math.PI * 2); wagonCtx.fill();
}

function toggleWagonWheel(){
  if (!wagonCanvas) return;
  const on = wagonCanvas.style.display === 'block';
  wagonCanvas.style.display = on ? 'none' : 'block';
  const btn = document.getElementById('util-wagon');
  if (btn) btn.classList.toggle('on', !on);
  if (!on) drawWagonWheel();
}

let frameErrors = 0;
function animate(t){
  requestAnimationFrame(animate);
  const dt = Math.min((t - (animate.lastT || t)) / 1000, 0.1);
  const elapsed = t * 0.001;
  animate.lastT = t;

  try {
    if (stadium && stadium.update) stadium.update(dt, elapsed);

    if (typeof window.updateSparks    === 'function') { try { window.updateSparks(dt);    } catch(e){} }
    if (typeof window.updateParticles === 'function') { try { window.updateParticles(dt); } catch(e){} }
    if (typeof window.updateCrowd     === 'function') { try { window.updateCrowd(dt);     } catch(e){} }
    if (typeof window.updatePlayerUpgrades === 'function') { try { window.updatePlayerUpgrades(dt); } catch(e){} }

    fielders.forEach(f => f.update(dt, elapsed));
    RunningState.update(dt);

    if (!anim && !RunningState.active){
      if (strikerBat.batPivot) strikerBat.batPivot.rotation.x = -Math.PI / 4 + Math.max(0, Math.sin(elapsed * 4)) * 0.15;
      bowler.position.z = -22 + Math.sin(elapsed * 1.2) * 0.25;
      if (directorOn){ camPos.lerp(CAM_MODES.broadcast.pos, 0.03); camTarget.lerp(CAM_MODES.broadcast.target, 0.03); }
    }

    if (!directorOn && activeCam === 'follow'){
      const bp = ball.visible ? ball.position : new THREE.Vector3(0, 0, 8.8);
      camPos.lerp(new THREE.Vector3(bp.x * 0.6, Math.max(3.5, bp.y + 3.5), bp.z - 7), 0.08);
      camTarget.lerp(bp, 0.12);
    } else if (!directorOn && activeCam !== 'follow'){
      camPos.lerp(CAM_MODES[activeCam].pos, 0.05);
      camTarget.lerp(CAM_MODES[activeCam].target, 0.05);
    }

    camera.position.copy(camPos);
    camera.lookAt(camTarget);
    renderer.render(scene, camera);

  } catch(err){
    if (frameErrors < 3){
      frameErrors++;
      console.error('[CricMax] frame error (render loop kept alive):', err);
    }
    try { renderer.render(scene, camera); } catch(e2){}
  }
}
requestAnimationFrame(animate);

window.addEventListener('resize', function(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

window.toggleMenu = toggleMenu; window.setSky = setSky; window.navTo = navTo; window.setCamera = setCamera;
window.toggleDirector = toggleDirector; window.toggleWagonWheel = toggleWagonWheel;
window.simFeedScoringTab = simFeedScoringTab; window.triggerReplay = triggerReplay; window.toggleAudio = toggleAudio; window.toggleFullscreen = toggleFullscreen;
})();
