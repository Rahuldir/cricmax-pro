<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CricMax Pro 3D - Photorealistic Stadium Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #01040a; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* Broadcast Toolbar */
    .hud-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 18px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; flex-wrap: wrap; }

    .live-badge { background: #ef4444; color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 1.5px; padding: 6px 14px; border-radius: 20px; display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 0 16px rgba(239,68,68,.75); pointer-events: auto; }
    .live-badge::before { content:''; width: 8px; height: 8px; background: #fff; border-radius: 50%; display: inline-block; animation: pulse 1s infinite alternate; }
    @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.1); } }

    .bar-cluster { display: flex; align-items: center; gap: 6px; background: rgba(8,14,28,.85); padding: 5px 8px; border-radius: 14px; backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); pointer-events: auto; }
    
    /* Single Dropdown Camera Selector */
    .cam-dropdown { background: rgba(15,23,42,0.9); border: 1px solid rgba(0,230,118,.4); color: #00e676; font-size: 11px; font-weight: 800; padding: 6px 12px; border-radius: 8px; outline: none; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .cam-dropdown:focus { box-shadow: 0 0 12px rgba(0,230,118,0.5); }
    .cam-dropdown option { background: #0b1329; color: #fff; font-weight: 700; padding: 6px; }

    .hud-btn { background: transparent; border: 1px solid rgba(255,255,255,.12); color: #cbd5e1; padding: 6px 10px; border-radius: 8px; font-size: 10.5px; font-weight: 800; cursor: pointer; transition: all .2s; font-family: inherit; white-space: nowrap; }
    .hud-btn:hover { background: rgba(0,230,118,.18); color: #fff; border-color: rgba(0,230,118,.4); }
    .hud-btn.active { background: linear-gradient(135deg,#009270,#00e676); color: #0a0e1a; border-color: transparent; box-shadow: 0 0 16px rgba(0,230,118,.6); font-weight: 900; }
    .hud-btn.director-active { background: linear-gradient(135deg,#e11d48,#f43f5e); color: #fff; border-color: transparent; box-shadow: 0 0 16px rgba(244,63,94,.6); }

    .ctrl-cluster { display: flex; gap: 6px; pointer-events: auto; }
    .ctrl-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(8,14,28,.82); border: 1px solid rgba(255,255,255,.18); color: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(12px); transition: transform .15s; font-family: inherit; }
    .ctrl-btn:active { transform: scale(0.92); }

    .radar-tag { position: absolute; top: 72px; right: 18px; background: rgba(15,23,42,0.9); border: 1px solid rgba(34,211,238,0.4); padding: 6px 14px; border-radius: 8px; color: #38bdf8; font-family: monospace; font-size: 14px; font-weight: 800; pointer-events: none; opacity: 0; transition: opacity .3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .radar-tag.active { opacity: 1; }

    #wagonWheelCanvas { position: absolute; top: 72px; left: 18px; width: 140px; height: 140px; background: rgba(8,15,30,0.88); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.7); }

    .event-banner { position: absolute; top: 20%; left: 50%; transform: translateX(-50%) scale(.6); font-size: clamp(38px, 7vw, 76px); font-weight: 900; font-style: italic; text-transform: uppercase; color: #fff; opacity: 0; transition: all .35s cubic-bezier(.175,.885,.32,1.275); text-align: center; line-height: 1; pointer-events: none; }
    .event-banner.active { transform: translateX(-50%) scale(1); opacity: 1; }
    .event-banner.four { color: #22d3ee; text-shadow: 0 0 45px #0891b2, 0 8px 24px #000; }
    .event-banner.six { color: #ff6d00; text-shadow: 0 0 45px #fbbf24, 0 8px 24px #000; }
    .event-banner.wkt { color: #ef4444; text-shadow: 0 0 45px #7f1d1d, 0 8px 24px #000; }
    .event-banner.noball { color: #e879f9; text-shadow: 0 0 45px #a855f7, 0 8px 24px #000; }

    .bottom-hud-wrapper { width: 100%; max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }

    .over-summary-bar { background: rgba(8,18,32,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 5px 14px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 800; color: #cbd5e1; }
    .over-dots { display: flex; gap: 6px; align-items: center; }
    .ball-badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 900; background: rgba(255,255,255,0.1); color: #94a3b8; border: 1px solid rgba(255,255,255,0.15); }
    .ball-badge.dot { background: rgba(148,163,184,0.2); color: #94a3b8; }
    .ball-badge.runs { background: rgba(2,132,199,0.3); color: #38bdf8; border-color: #38bdf8; }
    .ball-badge.four { background: rgba(34,211,238,0.35); color: #22d3ee; border-color: #22d3ee; }
    .ball-badge.six { background: rgba(251,191,36,0.35); color: #fbbf24; border-color: #fbbf24; }
    .ball-badge.wkt { background: rgba(239,68,68,0.5); color: #fff; border-color: #ef4444; }
    .ball-badge.nb { background: rgba(232,121,249,0.4); color: #e879f9; border-color: #e879f9; }

    .tv-scorecard { background: linear-gradient(90deg, rgba(8,18,32,.96), rgba(3,8,16,.98)); border: 1px solid rgba(255,255,255,.16); border-radius: 14px; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(18px); color: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.85); width: 100%; gap: 14px; }
    .tv-team { display: flex; align-items: center; gap: 10px; font-weight: 900; border-right: 1px solid rgba(255,255,255,.12); padding-right: 16px; }
    .tv-team-badge { background: #00e676; color: #0a0e1a; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 900; transition: background 0.3s; }
    .tv-score { font-size: 24px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
    .tv-overs { font-size: 12px; color: #94a3b8; font-weight: 700; margin-left: 2px; }
    .tv-batsmen { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .tv-bat-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
    .tv-bat-row.striker { color: #00e676; }
    .tv-bowler { font-size: 12px; font-weight: 700; text-align: right; color: #22d3ee; border-left: 1px solid rgba(255,255,255,.12); padding-left: 16px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-layer">
    <div class="top-bar">
      <div class="live-badge">ULTRA 3D LIVE</div>

      <div class="bar-cluster">
        <button class="hud-btn director-active" id="btn-director" onclick="toggleSmartDirector()">🎬 Auto Director</button>
        
        <!-- Consolidated Single Dropdown Camera Selector -->
        <select class="cam-dropdown" id="camSelect" onchange="onCameraDropdownChange(this.value)">
          <option value="broadcast">📺 TV Broadcast</option>
          <option value="bowler">🎯 Bowler View</option>
          <option value="keeper">🧤 Wicketkeeper</option>
          <option value="side">🎬 Square Side</option>
          <option value="drone">🚁 Tactical Drone</option>
          <option value="follow">⚾ Dynamic Ball Cam</option>
        </select>
      </div>

      <div class="bar-cluster">
        <button class="hud-btn" id="env-day" onclick="setAtmosphere('day')">☀️ Day</button>
        <button class="hud-btn" id="env-sunset" onclick="setAtmosphere('sunset')">🌇 Sunset</button>
        <button class="hud-btn active" id="env-night" onclick="setAtmosphere('night')">🌙 Night</button>
      </div>

      <div class="ctrl-cluster">
        <button class="ctrl-btn" id="btnWagon" onclick="toggleWagonWheel()" title="Toggle Wagon Wheel">🕸️</button>
        <button class="ctrl-btn" onclick="simFeedScoringTab()" title="Feed Ball to Stadium">⚡</button>
        <button class="ctrl-btn" id="btnMic" onclick="toggleAudio()" title="Live Sound FX">🔊</button>
        <button class="ctrl-btn" onclick="triggerReplay()" title="Replay Delivery">↻</button>
        <button class="ctrl-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
      </div>
    </div>

    <div id="speedRadar" class="radar-tag">SPEED: -- KM/H</div>
    <canvas id="wagonWheelCanvas" width="280" height="280"></canvas>

    <div id="eventBanner" class="event-banner">FOUR!</div>

    <div class="bottom-hud-wrapper">
      <div class="over-summary-bar">
        <span>THIS OVER:</span>
        <div class="over-dots" id="overDotsContainer">
          <div class="ball-badge dot">•</div>
          <div class="ball-badge dot">•</div>
          <div class="ball-badge dot">•</div>
          <div class="ball-badge dot">•</div>
          <div class="ball-badge dot">•</div>
          <div class="ball-badge dot">•</div>
        </div>
        <span id="overTotalRuns">0 RUNS</span>
      </div>

      <div class="tv-scorecard">
        <div class="tv-team">
          <span class="tv-team-badge" id="tvAbbr">IND</span>
          <span class="tv-score" id="tvScore">0/0</span>
          <span class="tv-overs" id="tvOvers">(0.0)</span>
        </div>
        <div class="tv-batsmen">
          <div class="tv-bat-row striker"><span id="tvStrikerName">Striker*</span><b id="tvStrikerRuns">0(0)</b></div>
          <div class="tv-bat-row"><span id="tvNonStrikerName">Non-Striker</span><b id="tvNonStrikerRuns">0(0)</b></div>
        </div>
        <div class="tv-bowler">
          <div id="tvBowlerName">Bowler</div>
          <div id="tvBowlerFigs" style="color:#fff;font-variant-numeric:tabular-nums;">0.0-0-0-0</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =======================================================
       1. 3D SPATIAL AUDIO SYSTEM
       ======================================================= */
    let audioCtx = null;
    let isAudioOn = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function createSpatialPanner(x = 0, y = 1.0, z = 0) {
      if (!audioCtx) initAudio();
      const panner = audioCtx.createPanner();
      panner.panningModel = 'HRTF';
      panner.distanceModel = 'inverse';
      panner.refDistance = 6.0;
      panner.maxDistance = 140.0;
      panner.rolloffFactor = 1.1;
      panner.positionX.setValueAtTime(x, audioCtx.currentTime);
      panner.positionY.setValueAtTime(y, audioCtx.currentTime);
      panner.positionZ.setValueAtTime(z, audioCtx.currentTime);
      panner.connect(audioCtx.destination);
      return panner;
    }

    function playSpatialPitchBounce(x = 0, z = 3.5) {
      if (!isAudioOn) return; initAudio();
      const panner = createSpatialPanner(x, 0.1, z);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(120, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(38, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(panner);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }

    function playSpatialWillowBat(power = 1.0, x = 0, z = 8.8) {
      if (!isAudioOn) return; initAudio();
      const panner = createSpatialPanner(x, 1.2, z);

      const bufferSize = audioCtx.sampleRate * 0.05;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 1600;

      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(0.85 * power, audioCtx.currentTime);
      nGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

      noise.connect(filter); filter.connect(nGain); nGain.connect(panner);
      noise.start();

      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.14);
      oscGain.gain.setValueAtTime(0.75 * power, audioCtx.currentTime);
      oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
      osc.connect(oscGain); oscGain.connect(panner);
      osc.start(); osc.stop(audioCtx.currentTime + 0.14);
    }

    function playSpatialStumpsShatter(x = 0, z = 10.0) {
      if (!isAudioOn) return; initAudio();
      const panner = createSpatialPanner(x, 0.5, z);
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(600 + (i * 220), audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.11);
          gain.gain.setValueAtTime(0.55, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.11);
          osc.connect(gain); gain.connect(panner);
          osc.start(); osc.stop(audioCtx.currentTime + 0.11);
        }, i * 35);
      }
    }

    function playCrowdRunUpClap(tempo = 1.0) {
      if (!isAudioOn) return; initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.12 * tempo, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function playCrowdCheer(duration = 2.5) {
      if (!isAudioOn) return; initAudio();
      const bufSize = audioCtx.sampleRate * duration;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 750;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.5);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start();
    }

    function playSoundNoBallSiren() {
      if (!isAudioOn) return; initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(380, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(290, audioCtx.currentTime + 0.5);
      osc.frequency.linearRampToValueAtTime(380, audioCtx.currentTime + 1.0);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 1.2);
    }

    /* =======================================================
       2. THREE.JS SCENE SETUP & LIGHTING
       ======================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020713);
    scene.fog = new THREE.FogExp2(0x050d24, 0.0055);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 800);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xd4e2ff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e6, 0);
    sunLight.position.set(40, 80, 40);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    scene.add(sunLight);

    const floodlights = [];
    const towerPositions = [
      { x: -55, z: -55 }, { x: 55, z: -55 },
      { x: -55, z: 55 },  { x: 55, z: 55 }
    ];

    towerPositions.forEach(pos => {
      const towerGroup = new THREE.Group();
      towerGroup.position.set(pos.x, 0, pos.z);
      const steelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.3 });
      for (let c = 0; c < 4; c++) {
        const ang = (c * Math.PI) / 2;
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 42, 6), steelMat);
        col.position.set(Math.cos(ang) * 1.6, 21, Math.sin(ang) * 1.6);
        towerGroup.add(col);
      }
      for (let b = 4; b <= 40; b += 4) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.08, 4, 4), steelMat);
        ring.rotation.x = Math.PI / 2; ring.position.y = b;
        towerGroup.add(ring);
      }
      const headMat = new THREE.MeshBasicMaterial({ color: 0xfffaea });
      const panel = new THREE.Mesh(new THREE.BoxGeometry(9, 4.5, 1.2), headMat);
      panel.position.set(0, 42, 0); panel.lookAt(0, 0, 0);
      towerGroup.add(panel);

      const spot = new THREE.SpotLight(0xfff6e0, 1.5, 190, Math.PI / 3.0, 0.38, 1.15);
      spot.position.set(pos.x, 42, pos.z);
      spot.target.position.set(0, 0, 0);
      spot.castShadow = true;
      spot.shadow.mapSize.set(1024, 1024);
      scene.add(spot); scene.add(spot.target);
      scene.add(towerGroup);
      floodlights.push(spot);
    });

    let currentAtmosphere = 'night';
    window.setAtmosphere = function(mode) {
      currentAtmosphere = mode;
      document.querySelectorAll('#env-day, #env-sunset, #env-night').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('env-' + mode);
      if (activeBtn) activeBtn.classList.add('active');

      if (mode === 'day') {
        scene.background.set(0x87ceeb);
        scene.fog.color.set(0xbfe3f7);
        ambientLight.color.set(0xffffff);
        ambientLight.intensity = 0.9;
        sunLight.intensity = 1.6;
        floodlights.forEach(fl => fl.intensity = 0.0);
      } else if (mode === 'sunset') {
        scene.background.set(0xfd5e53);
        scene.fog.color.set(0x3e1d35);
        ambientLight.color.set(0xffa07a);
        ambientLight.intensity = 0.65;
        sunLight.intensity = 0.7;
        floodlights.forEach(fl => fl.intensity = 0.75);
      } else {
        scene.background.set(0x020713);
        scene.fog.color.set(0x050d24);
        ambientLight.color.set(0xd4e2ff);
        ambientLight.intensity = 0.45;
        sunLight.intensity = 0.0;
        floodlights.forEach(fl => fl.intensity = 1.5);
      }
    };

    /* =======================================================
       3. PHOTOREALISTIC STADIUM ARCHITECTURE
       ======================================================= */
    function createLawnCanvas() {
      const cv = document.createElement('canvas');
      cv.width = 2048; cv.height = 2048;
      const ctx = cv.getContext('2d');
      const grad = ctx.createRadialGradient(1024, 1024, 100, 1024, 1024, 1024);
      grad.addColorStop(0, '#2b6531');
      grad.addColorStop(0.5, '#1e4b23');
      grad.addColorStop(1, '#173f1b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 2048, 2048);

      for (let r = 1024; r > 0; r -= 40) {
        ctx.beginPath();
        ctx.arc(1024, 1024, r, 0, Math.PI * 2);
        ctx.fillStyle = (r / 40) % 2 === 0 ? 'rgba(45, 105, 52, 0.22)' : 'rgba(18, 52, 22, 0.35)';
        ctx.fill();
      }

      for (let i = 0; i < 160000; i++) {
        const x = Math.random() * 2048;
        const y = Math.random() * 2048;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.04)';
        ctx.fillRect(x, y, 2, 2);
      }
      return new THREE.CanvasTexture(cv);
    }

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(68, 64),
      new THREE.MeshStandardMaterial({ map: createLawnCanvas(), roughness: 0.86 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const innerRing = new THREE.Mesh(
      new THREE.RingGeometry(27.4, 27.7, 64),
      new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.35, transparent: true, side: THREE.DoubleSide })
    );
    innerRing.rotation.x = -Math.PI / 2;
    innerRing.position.y = 0.015;
    scene.add(innerRing);

    const ropeTexture = (() => {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 32;
      const ctx = c.getContext('2d');

    class AnatomicalFielder {
      constructor(name, x, z, skinIndex) {
        this.name = name;

        this.targetPos = this.basePos.clone();

      pursue(ballPos, isFour = false) {
        this.state = 'chasing';
        if (isFour) {
          const dir = new THREE.Vector2(ballPos.x, ballPos.z);
          const dist = Math.min(dir.length() * 0.78, 56.0);
          dir.normalize().multiplyScalar(dist);
          this.targetPos.set(dir.x, 0, dir.y);
        } else {
          this.targetPos.set(ballPos.x, 0, ballPos.z);
        }
      }

      triggerBoundarySlide(ballPos) {
        this.state = 'sliding';
        this.targetPos.set(ballPos.x * 0.94, 0, ballPos.z * 0.94);
        this.rig.rotation.x = Math.PI / 3.0;
        setTimeout(() => {
          this.rig.rotation.x = 0;
          this.reset();
        }, 1200);

      triggerAirborneCatch(ballPos) {
        this.state = 'jumping';
        this.targetPos.set(ballPos.x, 0, ballPos.z);
        this.rig.position.y = 1.6;
        this.rig.armR.rotation.x = -Math.PI * 0.8;
        setTimeout(() => {
          this.rig.position.y = 0;
          this.rig.armR.rotation.x = 0;
        }, 1000);
      }

      triggerThrow(targetStumpPos) {
        this.state = 'throwing';
        this.rig.lookAt(targetStumpPos.x, 0, targetStumpPos.z);
        this.rig.armR.rotation.x = -Math.PI;
        setTimeout(() => {
          this.rig.armR.rotation.x = 0;
          this.reset();
        }, 500);
      }

      reset() {
        this.state = 'returning';
        this.targetPos.copy(this.basePos);
      }

      update(dt, time) {
        if (this.state === 'idle') {
          const sway = Math.sin(time * this.fidgetSpeed + this.rig.idlePhase);
          if (this.isKeeper) {
            this.rig.torso.rotation.x = 0.35 + sway * 0.05;
            this.rig.legL.rotation.x = -0.35;
            this.rig.legR.rotation.x = -0.35;
            this.rig.armL.rotation.x = -0.6 + sway * 0.08;
            this.rig.armR.rotation.x = -0.6 + sway * 0.08;
          } else {
            this.rig.torso.rotation.x = 0.18 + sway * 0.04;
            this.rig.torso.rotation.y = sway * 0.08;
            this.rig.head.rotation.y = -sway * 0.12;
            this.rig.armL.rotation.x = -0.2 + sway * 0.06;
            this.rig.armR.rotation.x = -0.2 - sway * 0.06;
          }
          this.rig.position.y = 0.0;
          return;
        }

        if (this.state === 'throwing') return;

        const dist = this.rig.position.distanceTo(this.targetPos);
        if (dist > 0.3) {
          const dir = new THREE.Vector3().subVectors(this.targetPos, this.rig.position).normalize();
          this.groupPositionVector = dir;
          this.rig.position.addScaledVector(dir, 14.0 * dt);
          this.rig.lookAt(this.targetPos.x, this.rig.position.y, this.targetPos.z);

          const runCycle = Math.sin(time * 18);
          this.rig.legL.rotation.x = runCycle * 0.65;
          this.rig.legR.rotation.x = -runCycle * 0.65;
          this.rig.armL.rotation.x = -runCycle * 0.75;
          this.rig.armR.rotation.x = runCycle * 0.75;
          this.rig.position.y = Math.abs(Math.sin(time * 18)) * 0.06;
        } else {
          if (this.state === 'returning') {
            this.state = 'idle';
            this.rig.position.y = 0.0;
            this.rig.legL.rotation.x = 0;
            this.rig.legR.rotation.x = 0;
            this.rig.armL.rotation.x = 0;
            this.rig.armR.rotation.x = 0;
          }
        }
      }

    class DynamicWicketSystem {
      constructor(zPos) {
        this.zPos = zPos;
        this.group = new THREE.Group();
        this.stumps = [];
        this.bails = [];
        this.isFlying = false;

        const woodMat = new THREE.MeshStandardMaterial({ color: 0xfde68a, roughness: 0.35 });
        [-0.11, 0, 0.11].forEach(x => {
          const s = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.76, 10), woodMat);

          this.group.add(s);
          this.stumps.push({ mesh: s, basePos: s.position.clone(), vel: new THREE.Vector3(), rotVel: new THREE.Vector3() });
        });

        [-0.055, 0.055].forEach(x => {
          const b = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.13, 8), woodMat);
          b.rotation.z = Math.PI / 2; b.position.set(x, 0.77, 0);
          this.group.add(b);
          this.bails.push({ mesh: b, basePos: b.position.clone(), vel: new THREE.Vector3(), rotVel: new THREE.Vector3() });
        });

        this.group.position.set(0, 0, zPos);
        scene.add(this.group);
      }

      triggerShatter() {
        this.isFlying = true;
        this.stumps.forEach((s, idx) => {
          s.vel.set((idx - 1) * 2.2 + (Math.random() - 0.5), 4.5 + Math.random() * 2, 4.0 + Math.random() * 3);
          s.rotVel.set(Math.random() * 8, Math.random() * 6, Math.random() * 8);
        });
        this.bails.forEach(b => {
          b.vel.set((Math.random() - 0.5) * 4, 6.0 + Math.random() * 2, 5.0 + Math.random() * 3);
          b.rotVel.set(Math.random() * 14, Math.random() * 12, Math.random() * 14);
        });
      }

      update(dt) {
        if (!this.isFlying) return;
        [...this.stumps, ...this.bails].forEach(item => {
          item.vel.y -= 9.8 * dt * 1.5;
          item.mesh.position.addScaledVector(item.vel, dt);
          item.mesh.rotation.x += item.rotVel.x * dt;
          item.mesh.rotation.y += item.rotVel.y * dt;
          item.mesh.rotation.z += item.rotVel.z * dt;
          if (item.mesh.position.y < 0.05) {
            item.mesh.position.y = 0.05;
            item.vel.y = -item.vel.y * 0.3;
            item.vel.x *= 0.7; item.vel.z *= 0.7;
          }
        });
      }

      reset() {
        this.isFlying = false;
        this.stumps.forEach(s => {
          s.mesh.position.copy(s.basePos);
          s.mesh.rotation.set(0, 0, 0);
          s.vel.set(0,0,0);
        });
        this.bails.forEach(b => {
          b.mesh.position.copy(b.basePos);
          b.mesh.rotation.set(0, 0, Math.PI / 2);
          b.vel.set(0,0,0);
        });
      }
    }

    const strikerWickets = new DynamicWicketSystem(10.0);

    let runningAnimationActive = false;
    let runProgress = 0;
    let totalRunsTaking = 0;

    function startRunningBetweenWickets(runs) {
      if (runs <= 0 || runs >= 4) return;
      runningAnimationActive = true;
      runProgress = 0;
      totalRunsTaking = runs;
    }

    function updateRunningBetweenWickets(dt) {
      if (!runningAnimationActive) return;
      runProgress += dt * (1.1 / totalRunsTaking);

      const cycle = runProgress * totalRunsTaking;
      const currentLap = Math.floor(cycle);
      const lapFraction = cycle - currentLap;
      const isOddLap = currentLap % 2 === 1;
      const sprintBounce = Math.sin(runProgress * 22) * 0.12;

      // Striker sprint lane (+0.7m off pitch centerline)
      const strikerZ = isOddLap ? THREE.MathUtils.lerp(-8.8, 8.8, lapFraction) : THREE.MathUtils.lerp(8.8, -8.8, lapFraction);
      strikerBatter.position.z = strikerZ;
      strikerBatter.position.x = 0.7;
      strikerBatter.rotation.y = isOddLap ? 0 : Math.PI;
      strikerBatter.batPivot.rotation.x = -Math.PI / 4 + sprintBounce;

      // Non-striker sprint lane (-0.7m off pitch centerline)
      const nonStrikerZ = isOddLap ? THREE.MathUtils.lerp(8.8, -8.8, lapFraction) : THREE.MathUtils.lerp(-8.8, 8.8, lapFraction);
      nonStrikerBatter.position.z = nonStrikerZ;
      nonStrikerBatter.position.x = -0.7;
      nonStrikerBatter.rotation.y = isOddLap ? Math.PI : 0;
      nonStrikerBatter.batPivot.rotation.x = -Math.PI / 4 + sprintBounce;

      if (runProgress >= 1.0) {
        runningAnimationActive = false;
        if (totalRunsTaking % 2 !== 0) {
          strikerBatter.position.set(-1.2, 0, -8.8); strikerBatter.rotation.y = Math.PI / 2;
          nonStrikerBatter.position.set(0.35, 0, 8.8); nonStrikerBatter.rotation.y = -Math.PI / 2;
        } else {
          strikerBatter.position.set(0.35, 0, 8.8); strikerBatter.rotation.y = -Math.PI / 2;
          nonStrikerBatter.position.set(-1.2, 0, -8.8); nonStrikerBatter.rotation.y = Math.PI / 2;
        }
      }
    }

    /* =======================================================
       6. SMART CAMERA DIRECTOR & DROPDOWN CONTROLLER
       ======================================================= */
    const cameraModes = {
      broadcast: { pos: new THREE.Vector3(0, 16, 32), target: new THREE.Vector3(0, 1.2, 2) },
      bowler:    { pos: new THREE.Vector3(0, 4.2, -22), target: new THREE.Vector3(0, 1.0, 9) },
      keeper:    { pos: new THREE.Vector3(0, 2.2, 14.5), target: new THREE.Vector3(0, 1.2, -5.0) },
      side:      { pos: new THREE.Vector3(26, 5, 8), target: new THREE.Vector3(0, 1.0, 8) },
      drone:     { pos: new THREE.Vector3(0, 52, 0.1), target: new THREE.Vector3(0, 0, 0) },
      follow:    { pos: new THREE.Vector3(0, 8, -6), target: new THREE.Vector3(0, 0.5, 9) }
    };

    let activeCamMode = 'broadcast';
    let isSmartDirectorOn = true;
    let camPos = cameraModes.broadcast.pos.clone();
    let camTarget = cameraModes.broadcast.target.clone();

    window.toggleSmartDirector = function() {
      isSmartDirectorOn = !isSmartDirectorOn;
      const btn = document.getElementById('btn-director');
      if (btn) {
        btn.className = isSmartDirectorOn ? 'hud-btn director-active' : 'hud-btn';
      }
    };

    // Dropdown change listener
    window.onCameraDropdownChange = function(mode) {
      if (!cameraModes[mode]) return;
      activeCamMode = mode;
      isSmartDirectorOn = false; // Disable director on manual selection
      const dirBtn = document.getElementById('btn-director');
      if (dirBtn) dirBtn.className = 'hud-btn';

      if (mode !== 'follow') camTarget.copy(cameraModes[mode].target);
    };

    window.toggleFullscreen = function() {
      const doc = window.document;
      if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
        if (doc.documentElement.requestFullscreen) doc.documentElement.requestFullscreen();
      } else {
        if (doc.exitFullscreen) doc.exitFullscreen();
      }
    };

    window.toggleAudio = function() {
      isAudioOn = !isAudioOn;
      const btn = document.getElementById('btnMic');
      if (btn) btn.innerText = isAudioOn ? '🔊' : '🔇';
    };

    const wagonCanvas = document.getElementById('wagonWheelCanvas');
    const wagonCtx = wagonCanvas.getContext('2d');
    const historicalShots = [];

    window.toggleWagonWheel = function() {
      wagonCanvas.style.display = wagonCanvas.style.display === 'block' ? 'none' : 'block';
      drawWagonWheel();
    };

    function drawWagonWheel() {
      const w = wagonCanvas.width, h = wagonCanvas.height;
      const cx = w / 2, cy = h / 2, radius = w / 2 - 12;
      wagonCtx.clearRect(0, 0, w, h);
      wagonCtx.beginPath();
      wagonCtx.arc(cx, cy, radius, 0, Math.PI * 2);
      wagonCtx.fillStyle = '#061324'; wagonCtx.fill();
      wagonCtx.strokeStyle = 'rgba(255,255,255,0.25)'; wagonCtx.lineWidth = 2; wagonCtx.stroke();
      wagonCtx.fillStyle = '#987349'; wagonCtx.fillRect(cx - 3, cy - 14, 6, 28);

      historicalShots.forEach(s => {
        wagonCtx.beginPath(); wagonCtx.moveTo(cx, cy);
        const endX = cx + Math.sin(s.angle) * (s.dist / 70 * radius);
        const endY = cy + Math.cos(s.angle) * (s.dist / 70 * radius);
        wagonCtx.lineTo(endX, endY);
        wagonCtx.strokeStyle = s.isWkt ? '#ef4444' : (s.runs === 6 ? '#ff6d00' : (s.runs === 4 ? '#22d3ee' : '#10b981'));
        wagonCtx.lineWidth = s.runs >= 4 ? 2.5 : 1.2; wagonCtx.stroke();
      });
    }

    /* =======================================================
       7. SCORING TAB OVER SUMMARY & MATCH SYNC
       ======================================================= */
    let lastProcessedShotIndex = -1;
    let currentOverBalls = [];

    function updateOverSummaryUI() {
      const container = document.getElementById('overDotsContainer');
      const totalEl = document.getElementById('overTotalRuns');
      if (!container) return;

      container.innerHTML = '';
      let overRuns = 0;

      for (let i = 0; i < 6; i++) {
        const b = currentOverBalls[i];
        const dot = document.createElement('div');
        dot.className = 'ball-badge dot';
        if (b) {
          if (b.isWicket) { dot.className = 'ball-badge wkt'; dot.innerText = 'W'; }
          else if (b.isSix) { dot.className = 'ball-badge six'; dot.innerText = '6'; overRuns += 6; }
          else if (b.isFour) { dot.className = 'ball-badge four'; dot.innerText = '4'; overRuns += 4; }
          else if (b.isNoBall) { dot.className = 'ball-badge nb'; dot.innerText = 'NB'; overRuns += (b.runs + 1); }
          else if (b.runs === 0) { dot.className = 'ball-badge dot'; dot.innerText = '0'; }
          else { dot.className = 'ball-badge runs'; dot.innerText = b.runs; overRuns += b.runs; }
        } else {
          dot.innerText = '•';
        }
        container.appendChild(dot);
      }
      if (totalEl) totalEl.innerText = `${overRuns} RUNS`;
    }

    function getSyncMatchObject() {
      try {
        if (window.parent && window.parent.match) return window.parent.match;
        if (window.match) return window.match;
      } catch (e) {}
      return null;
    }

    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data.type === 'SYNC_MATCH_STATE' && event.data.payload) applyMatchDataToScorecard(event.data.payload);
      if (event.data.type === 'TRIGGER_DELIVERY' && event.data.shot) playBall(event.data.shot);
    });

    function applyMatchDataToScorecard(m) {
      if (!m) return;

      const abbrEl = document.getElementById('tvAbbr');
      const scoreEl = document.getElementById('tvScore');
      const oversEl = document.getElementById('tvOvers');

      const teamName = m.teamBattingAbbr || m.battingTeam || m.teamBatting || 'IND';
      const totalRuns = m.runs !== undefined ? m.runs : (m.totalRuns !== undefined ? m.totalRuns : (m.score || 0));
      const wickets = m.wickets !== undefined ? m.wickets : (m.totalWickets || 0);
      const legalBalls = m.legalBalls !== undefined ? m.legalBalls : (m.ballsBowled || 0);

      if (abbrEl) abbrEl.innerText = teamName;
      if (scoreEl) scoreEl.innerText = `${totalRuns}/${wickets}`;
      if (oversEl) oversEl.innerText = `(${Math.floor(legalBalls / 6)}.${legalBalls % 6})`;

      const strikerKey = m.striker || (m.currentStriker && m.currentStriker.name) || 'Striker';
      const nonStrikerKey = m.nonStriker || (m.currentNonStriker && m.currentNonStriker.name) || 'Non-Striker';

      let strikerStats = { runs: 0, balls: 0 };
      let nonStrikerStats = { runs: 0, balls: 0 };
      if (m.batters) {
        if (m.batters[strikerKey]) strikerStats = m.batters[strikerKey];
        if (m.batters[nonStrikerKey]) nonStrikerStats = m.batters[nonStrikerKey];
      }

      const stNameEl = document.getElementById('tvStrikerName');
      const stRunsEl = document.getElementById('tvStrikerRuns');
      const nstNameEl = document.getElementById('tvNonStrikerName');
      const nstRunsEl = document.getElementById('tvNonStrikerRuns');

      if (stNameEl) stNameEl.innerText = `${strikerKey}*`;
      if (stRunsEl) stRunsEl.innerText = `${strikerStats.runs || 0}(${strikerStats.balls || 0})`;
      if (nstNameEl) nstNameEl.innerText = `${nonStrikerKey}`;
      if (nstRunsEl) nstRunsEl.innerText = `${nonStrikerStats.runs || 0}(${nonStrikerStats.balls || 0})`;

      const bowlerKey = m.currentBowler || (m.bowler && m.bowler.name) || 'Bowler';
      let bowlerStats = { balls: 0, maidens: 0, runs: 0, wickets: 0 };
      if (m.bowlers && m.bowlers[bowlerKey]) bowlerStats = m.bowlers[bowlerKey];

      const bwBalls = bowlerStats.balls || bowlerStats.legalBalls || 0;
      const bwNameEl = document.getElementById('tvBowlerName');
      const bwFigsEl = document.getElementById('tvBowlerFigs');
      if (bwNameEl) bwNameEl.innerText = bowlerKey;
      if (bwFigsEl) bwFigsEl.innerText = `${Math.floor(bwBalls / 6)}.${bwBalls % 6}-${bowlerStats.maidens || 0}-${bowlerStats.runs || 0}-${bowlerStats.wickets || 0}`;

      if (m.currentOverHistory && Array.isArray(m.currentOverHistory)) {
        currentOverBalls = m.currentOverHistory;
        updateOverSummaryUI();
      }

      const log = m.shotLog || m.ballsLog || m.deliveries;
      if (log && Array.isArray(log) && log.length > 0) {
        const latestIndex = log.length - 1;
        if (latestIndex > lastProcessedShotIndex) {
          lastProcessedShotIndex = latestIndex;
          playBall(log[latestIndex]);
        }
      }
    }

    setInterval(() => {
      const matchObj = getSyncMatchObject();
      if (matchObj) applyMatchDataToScorecard(matchObj);
    }, 200);

    /* =======================================================
       8. DETERMINISTIC DELIVERY ENGINE
       ======================================================= */
    let deliveryAnim = null;
    let lastRecordedShot = null;

    window.triggerReplay = function() {
      if (lastRecordedShot) playBall(lastRecordedShot);
    };

    window.simFeedScoringTab = function() {
      const scenarios = [
        { runs: 4, isFour: true, angle: 1.2, bowlerType: 'pace' },
        { runs: 6, isSix: true, angle: 2.3, bowlerType: 'pace' },
        { runs: 1, isFour: false, isSix: false, angle: 0.8, bowlerType: 'spin' },
        { runs: 0, isCatch: true, wicketType: 'caught', isWicket: true, angle: 1.8, bowlerType: 'spin' },
        { runs: 0, isWicket: true, angle: 0.0, bowlerType: 'pace' },
        { runs: 1, isNoBall: true, extraType: 'nb', angle: 2.1, bowlerType: 'pace' }
      ];
      const feed = scenarios[Math.floor(Math.random() * scenarios.length)];
      feed.ballSpeed = feed.bowlerType === 'spin' ? (88 + Math.random() * 8).toFixed(1) : (140 + Math.random() * 6).toFixed(1);
      playBall(feed);
    };

    function playBall(shot) {
      if (deliveryAnim) { cancelAnimationFrame(deliveryAnim); deliveryAnim = null; }

      strikerWickets.reset(); bowlerWickets.reset();
      fielders.forEach(f => f.reset());
      ball.visible = true;
      lastRecordedShot = shot;

      if (currentOverBalls.length >= 6) currentOverBalls = [];
      currentOverBalls.push(shot);
      updateOverSummaryUI();

      const speedRadar = document.getElementById('speedRadar');
      const deliverySpeed = shot.ballSpeed || shot.speed || (shot.bowlerType === 'spin' ? '92.4' : '142.1');
      speedRadar.innerText = `SPEED: ${deliverySpeed} KM/H`;
      speedRadar.classList.add('active');

      const startTime = performance.now();
      
      const isSpin = shot.bowlerType === 'spin';
      bowlerStartZ = isSpin ? -12.5 : -22.0;
      bowler.position.set(BOWLER_START_X, 0, bowlerStartZ);

      const pitchZ = isSpin ? 4.8 : (3.2 + ((shot.ballRandom !== undefined ? shot.ballRandom : Math.random()) * 1.8));
      const seamDeviation = isSpin ? (Math.random() > 0.5 ? 0.35 : -0.35) : (Math.random() - 0.5) * 0.18;
      const pitchX = shot.pitchX !== undefined ? shot.pitchX : (Math.random() - 0.5) * 0.4;

      let angle = Math.PI / 2;
      if (shot.angle !== undefined) angle = shot.angle > (Math.PI * 2) ? (shot.angle * Math.PI / 180) : shot.angle;
      else if (shot.wagonX !== undefined && shot.wagonY !== undefined) angle = Math.atan2(shot.wagonX, shot.wagonY);
      else if (shot.zoneIndex !== undefined && shot.zoneIndex >= 0) angle = (shot.zoneIndex * Math.PI / 4);

      const runs = shot.runs !== undefined ? shot.runs : 0;
      const isSix = shot.isSix || runs === 6;
      const isFour = shot.isFour || runs === 4;
      const isWicket = shot.isWicket || shot.isOut || false;
      const isNoBall = shot.isNoBall || shot.extraType === 'nb' || false;
      const isCatch = shot.isCatch || shot.wicketType === 'caught' || false;
      const isSlideSave = shot.isSlideSave || false;
      const isRunOut = shot.isRunOut || shot.wicketType === 'run out' || false;

      let finalDist;
      if (isSix) {
        finalDist = 78.0;
      } else if (isFour) {
        finalDist = 66.5;
      } else if (isSlideSave) {
        finalDist = 58.5;
      } else if (isCatch) {
        finalDist = 38.0;
      } else if (runs > 0) {
        finalDist = runs * 14.0;
      } else {
        finalDist = 18.0;
      }

      const hitX = Math.sin(angle) * finalDist;
      const hitZ = 8.8 + Math.cos(angle) * (finalDist * 0.7);

      let bouncedSoundPlayed = false;
      let contactSoundPlayed = false;
      let throwInitiated = false;
      let acrobaticsInitiated = false;

      let nearestFielder = fielders[0];
      let minFielderDist = 999;
      fielders.forEach(f => {
        const d = f.basePos.distanceTo(new THREE.Vector3(hitX, 0, hitZ));
        if (d < minFielderDist) { minFielderDist = d; nearestFielder = f; }
      });

      function loop(now) {
        const elapsed = now - startTime;

        if (isSmartDirectorOn && elapsed < 700) {
          camPos.lerp(new THREE.Vector3(0, 3.8, -19.5), 0.08);
          camTarget.lerp(new THREE.Vector3(0, 1.2, 8.8), 0.08);
        }

        // Phase 1: Bowler Run-Up (0ms - 700ms)
        if (elapsed < 700) {
          const t = elapsed / 700;
          bowler.position.x = THREE.MathUtils.lerp(BOWLER_START_X, 0.55, t);
          const releaseZ = isNoBall ? -8.65 : -9.8;
          bowler.position.z = THREE.MathUtils.lerp(bowlerStartZ, releaseZ, t);

          const armRotSpeed = isSpin ? 2 : 4;
          bowler.armR.rotation.x = -Math.PI * armRotSpeed * t;
          bowler.armL.rotation.x = Math.PI * armRotSpeed * t;
          ball.position.set(bowler.position.x + 0.3, 2.0, bowler.position.z);

          if (Math.floor(elapsed / 160) !== Math.floor((elapsed - 16) / 160)) {
            playCrowdRunUpClap(1.0 + t);
          }

          strikerBatter.batPivot.rotation.x = -Math.PI / 4 + Math.sin(t * 14) * 0.08;
          strikerBatter.rotation.y = -Math.PI / 2;

          if (isNoBall && elapsed > 650 && !bouncedSoundPlayed) playSoundNoBallSiren();
        }
        // Phase 2a: Release to Pitch Landing (700ms - 1000ms)
        else if (elapsed < 1000) {
          const t = (elapsed - 700) / 300;
          const releaseZ = isNoBall ? -8.65 : -9.8;
          ball.position.x = THREE.MathUtils.lerp(0.55, pitchX, t);
          ball.position.z = THREE.MathUtils.lerp(releaseZ, pitchZ, t);
          const flightApex = isSpin ? 2.8 : 2.0;
          ball.position.y = THREE.MathUtils.lerp(flightApex, 0.04, t * t);
        }
        // Phase 2b: Pitch Bounce to Bat Impact (1000ms - 1250ms)
        else if (elapsed < 1250) {
          const t = (elapsed - 1000) / 250;
          if (!bouncedSoundPlayed) {
            playSpatialPitchBounce(pitchX, pitchZ);
            bouncedSoundPlayed = true;
          }
          ball.position.x = THREE.MathUtils.lerp(pitchX, strikerBatter.position.x - 0.1 + seamDeviation, t);
          ball.position.z = THREE.MathUtils.lerp(pitchZ, 8.8, t);
          ball.position.y = 0.04 + Math.sin(t * Math.PI * 0.5) * (isSpin ? 1.05 : 0.85);
        }
        // Phase 3: Shot Contact & Trajectory (1250ms - 3400ms)
        else if (elapsed < 3400) {
          const t = (elapsed - 1250) / 2150;

          if (isSmartDirectorOn) {
            if (isSix || isFour) {
              camPos.lerp(new THREE.Vector3(ball.position.x * 0.5, 12.0, ball.position.z - 18.0), 0.05);
              camTarget.lerp(ball.position, 0.08);
            } else if (isWicket) {
              camPos.lerp(new THREE.Vector3(0, 2.2, 14.5), 0.06);
              camTarget.lerp(new THREE.Vector3(0, 1.2, 8.8), 0.08);
            } else {
              camPos.lerp(new THREE.Vector3(22.0, 7.0, 8.0), 0.04);
              camTarget.lerp(ball.position, 0.06);
            }
          }

          if (!contactSoundPlayed) {
            if (isWicket && !isCatch) {
              playSpatialStumpsShatter(0, 10.0);
              strikerWickets.triggerShatter();
            } else {
              playSpatialWillowBat(isSix ? 1.0 : (isFour ? 0.8 : 0.5), strikerBatter.position.x, 8.8);
              if (isSix || isFour || isCatch) playCrowdCheer();
            }
            historicalShots.push({ angle, dist: finalDist, runs, isWkt: isWicket });
            drawWagonWheel();
            contactSoundPlayed = true;

            if (!isSix && !isCatch && runs > 0) {
              nearestFielder.pursue(new THREE.Vector3(hitX, 0, hitZ), isFour);
              startRunningBetweenWickets(runs);
            }
          }

          if (isCatch && t > 0.45 && !acrobaticsInitiated) {
            nearestFielder.triggerAirborneCatch(new THREE.Vector3(hitX, 0, hitZ));
            acrobaticsInitiated = true;
          }
          if (isSlideSave && t > 0.65 && !acrobaticsInitiated) {
            nearestFielder.triggerBoundarySlide(new THREE.Vector3(hitX, 0, hitZ));
            acrobaticsInitiated = true;
          }

          if (isWicket && !isCatch) {
            strikerBatter.batPivot.rotation.x = 0;
            ball.position.set(0.1, 0.3, 10.4);
          }
          else if (runs === 0 && !isCatch) {
            ball.position.x = THREE.MathUtils.lerp(strikerBatter.position.x - 0.1, 0, t);
            ball.position.z = THREE.MathUtils.lerp(8.8, 12.5, t);
            ball.position.y = 0.85 + Math.sin(t * Math.PI) * 0.3;
          }
          else {
            if (angle > 0.3 && angle < 1.9) {
              strikerBatter.legL.rotation.x = THREE.MathUtils.lerp(0, -0.4, Math.min(1, t * 5));
              strikerBatter.batPivot.rotation.x = -Math.PI / 3 + (Math.min(1, t * 4) * Math.PI * 0.7);
            } else if (angle >= 1.9) {
              strikerBatter.rotation.y = -Math.PI / 2 + (Math.min(1, t * 4) * Math.PI * 0.45);
              strikerBatter.batPivot.rotation.x = -Math.PI / 3 + (Math.min(1, t * 4) * Math.PI * 0.85);
            } else {
              strikerBatter.batPivot.rotation.x = -Math.PI / 3 + (Math.min(1, t * 4) * Math.PI * 0.95);
            }

            ball.position.x = THREE.MathUtils.lerp(strikerBatter.position.x, hitX, t);
            ball.position.z = THREE.MathUtils.lerp(8.8, hitZ, t);
            ball.rotation.x += 0.3;

            if (isSix) {
              ball.position.y = 0.8 + (Math.sin(t * Math.PI) * 26.0) + (t * 8.0);
            } else if (isCatch) {
              ball.position.y = 0.8 + (Math.sin(t * Math.PI) * 7.5);
              if (t > 0.95) ball.position.copy(nearestFielder.rig.position).add(new THREE.Vector3(0, 1.4, 0));
            } else if (isFour) {
              ball.position.y = 0.05 + (Math.abs(Math.sin(t * Math.PI * 3.5)) * 1.5 * Math.max(0, 1 - t * 1.1));
            } else {
              ball.position.y = 0.05;
            }
          }

          if (!isSmartDirectorOn && activeCamMode === 'follow') {
            camPos.set(ball.position.x, ball.position.y + 2.5, ball.position.z - 6.0);
            camTarget.copy(ball.position);
          }
        }
        // Phase 4: Relay Return Throw (3400ms - 4800ms)
        else if (elapsed < 4800) {
          const t = (elapsed - 3400) / 1400;

          if (isSmartDirectorOn && runs > 0 && !isSix && !isFour) {
            const targetW = (runs % 2 === 0) ? strikerWickets.group.position : bowlerWickets.group.position;
            camPos.lerp(new THREE.Vector3(targetW.x + 4.5, 2.5, targetW.z + 4.5), 0.06);
            camTarget.lerp(targetW, 0.08);
          }

          if (!isSix && !isFour && !isCatch && runs > 0) {
            const targetWicket = (runs % 2 === 0) ? strikerWickets.group.position : bowlerWickets.group.position;
            if (!throwInitiated) {
              nearestFielder.triggerThrow(targetWicket);
              throwInitiated = true;
            }
            ball.position.x = THREE.MathUtils.lerp(hitX, targetWicket.x, t);
            ball.position.z = THREE.MathUtils.lerp(hitZ, targetWicket.z, t);
            ball.position.y = 0.2 + (Math.sin(t * Math.PI) * 4.5);

            if (t > 0.95 && isRunOut) {
              playSpatialStumpsShatter(targetWicket.x, targetWicket.z);
              if (runs % 2 === 0) strikerWickets.triggerShatter();
              else bowlerWickets.triggerShatter();
            }
          }
        } else {
          deliveryAnim = null;
          speedRadar.classList.remove('active');
          return;
        }

        deliveryAnim = requestAnimationFrame(loop);
      }

      deliveryAnim = requestAnimationFrame(loop);

      setTimeout(() => {
        const b = document.getElementById('eventBanner');
        b.className = 'event-banner';
        if (isNoBall) { b.innerText = 'NO BALL - FREE HIT!'; b.classList.add('noball', 'active'); }
        else if (isCatch) { b.innerText = 'OUT! WHAT A CATCH!'; b.classList.add('wkt', 'active'); }
        else if (isSlideSave) { b.innerText = 'SUPERB BOUNDARY SAVE!'; b.classList.add('four', 'active'); }
        else if (isRunOut) { b.innerText = 'DIRECT HIT! RUN OUT'; b.classList.add('wkt', 'active'); }
        else if (isWicket) { b.innerText = 'OUT / BOWLED!'; b.classList.add('wkt', 'active'); }
        else if (isSix) { b.innerText = 'MAXIMUM 6!'; b.classList.add('six', 'active'); }
        else if (isFour) { b.innerText = 'CRACKING FOUR!'; b.classList.add('four', 'active'); }
        else { b.innerText = runs > 0 ? `${runs} RUNS` : 'DOT BALL'; b.classList.add('active'); }
        setTimeout(() => b.classList.remove('active'), 2400);
      }, 1200);
    }

    /* =======================================================
       9. MAIN RENDER LOOP
       ======================================================= */
    let lastTime = 0;
    function animate(time) {
      requestAnimationFrame(animate);
      const dt = Math.min((time - lastTime) / 1000, 0.1);
      const tSec = time * 0.001;
      lastTime = time;

      updateLedTexture(tSec);
      updateRunningBetweenWickets(dt);

      strikerWickets.update(dt);
      bowlerWickets.update(dt);
      fielders.forEach(f => f.update(dt, tSec));

      if (audioCtx && audioCtx.listener) {
        audioCtx.listener.positionX.setValueAtTime(camera.position.x, audioCtx.currentTime);
        audioCtx.listener.positionY.setValueAtTime(camera.position.y, audioCtx.currentTime);
        audioCtx.listener.positionZ.setValueAtTime(camera.position.z, audioCtx.currentTime);
      }

      // Continuous Natural Stance Movements
      if (!deliveryAnim) {
        const batTap = Math.sin(tSec * 4.2);
        strikerBatter.batPivot.rotation.x = -Math.PI / 4 + Math.max(0, batTap) * 0.16;
        strikerBatter.torso.rotation.x = 0.15 + Math.sin(tSec * 2.1) * 0.03;
        strikerBatter.torso.rotation.y = Math.sin(tSec * 1.5) * 0.06;
        strikerBatter.head.rotation.y = -Math.PI / 10 + Math.sin(tSec * 1.2) * 0.05;

        nonStrikerBatter.torso.rotation.x = 0.12;
        nonStrikerBatter.torso.rotation.y = Math.sin(tSec * 1.6) * 0.05;
        nonStrikerBatter.head.rotation.y = Math.PI / 12 + Math.sin(tSec * 1.1) * 0.04;

        bowler.torso.rotation.y = Math.sin(tSec * 2.2) * 0.08;
        bowler.armR.rotation.x = Math.sin(tSec * 1.6) * 0.18;
        bowler.armL.rotation.x = -Math.sin(tSec * 1.6) * 0.18;
        bowler.position.z = bowlerStartZ + Math.sin(tSec * 1.2) * 0.25;

        if (isSmartDirectorOn) {
          camPos.lerp(cameraModes.broadcast.pos, 0.03);
          camTarget.lerp(cameraModes.broadcast.target, 0.03);
          // Keep dropdown synced to TV Broadcast
          const sel = document.getElementById('camSelect');
          if (sel && sel.value !== 'broadcast') sel.value = 'broadcast';
        }
      }

      if (!isSmartDirectorOn && activeCamMode !== 'follow') {
        camPos.lerp(cameraModes[activeCamMode].pos, 0.05);
        camTarget.lerp(cameraModes[activeCamMode].target, 0.05);
      }

      camera.position.copy(camPos);
      camera.lookAt(camTarget);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
