<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricMax 3D Viewer</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
  #container { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scorecard { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, rgba(10,14,26,.98), rgba(10,14,26,.85)); border-top: 1px solid rgba(255,255,255,.15); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); font-size: 12px; z-index: 100; }
  .team { display: flex; align-items: center; gap: 8px; border-right: 1px solid rgba(255,255,255,.1); padding-right: 16px; }
  .flag { background: #00e676; color: #0a0e1a; padding: 2px 8px; border-radius: 4px; font-weight: 900; font-size: 11px; }
  .score { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .overs { font-size: 11px; color: #94a3b8; font-weight: 700; }
  .batsmen { display: flex; flex-direction: column; gap: 2px; flex: 1; padding: 0 16px; }
  .bowler { display: flex; flex-direction: column; gap: 2px; border-left: 1px solid rgba(255,255,255,.1); padding-left: 16px; text-align: right; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
  .row.active { color: #00e676; }
  #distance { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 42px; font-weight: 900; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 20px #ff6d00, 0 0 40px #fbbf24, 0 6px 24px #000; display: none; pointer-events: none; z-index: 100; color: #fff; }
</style>
</head>
<body>
<div id="container"></div>
<div id="distance">0 m</div>
<div id="scorecard">
  <div class="team">
    <span class="flag" id="teamName">TEAM</span>
    <span class="score" id="teamScore">0-0</span>
    <span class="overs" id="teamOvers">(0.0)</span>
  </div>
  <div class="batsmen">
    <div class="row active"><span id="strikerName">-</span> <b id="strikerScore">0(0)</b></div>
    <div class="row"><span id="nonStrikerName">-</span> <b id="nonStrikerScore">0(0)</b></div>
  </div>
  <div class="bowler">
    <div class="row"><span id="bowlerName">-</span> <b id="bowlerFigures">0.0-0-0-0</b></div>
    <div class="row" style="color:#94a3b8;font-size:10px;">CRR: <b id="crr" style="color:#22d3ee;">0.00</b></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ==================== GLOBALS ====================
let scene, camera, renderer;
let ball, bat;
let stumpsBatting, stumpsBowling;
let shatterPieces = [];
let animState = 'idle'; // idle | delivery | shot | reset
let animTime = 0;
let ballStart, ballPitch, ballEnd;
let vppShot = null;
let lastSeenBallCount = 0;
let ballDistance = 0;
let lastTime = performance.now();

// Real-world dimensions (meters)
const PITCH_LEN = 20.12;
const STUMP_H = 0.71;
const STUMP_R = 0.035;
const BALL_R = 0.045;

// ==================== INIT ====================
function init() {
  const container = document.getElementById('container');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05080f);
  scene.fog = new THREE.Fog(0x05080f, 60, 180);

  // Camera: Fixed 45° from Bowler End (behind bowler, looking down the pitch)
  // Bowler end is at z = -10, Batsman end is at z = +10
  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(8, 12, -22);   // Behind and above bowler end, off to one side
  camera.lookAt(0, 0, 4);             // Look towards batsman's crease

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(15, 30, 15);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.left = -30;
  sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30;
  sun.shadow.camera.bottom = -30;
  scene.add(sun);

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x2d6f38, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Pitch (Brown)
  const pitch = new THREE.Mesh(
    new THREE.PlaneGeometry(3.05, PITCH_LEN),
    new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 1.0 })
  );
  pitch.rotation.x = -Math.PI / 2;
  pitch.position.y = 0.01;
  pitch.receiveShadow = true;
  scene.add(pitch);

  // ============ CREASE LINES ============
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  // Batsman's end creases (z = +10)
  addCreaseLines(+10, lineMat);
  // Bowler's end creases (z = -10)
  addCreaseLines(-10, lineMat);

  // ============ STUMPS ============
  stumpsBowling = createStumps(0, -10);
  stumpsBatting = createStumps(0, +10);
  scene.add(stumpsBowling);
  scene.add(stumpsBatting);

  // ============ BAT ============
  bat = new THREE.Group();
  const handle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.02, 0.3, 8),
    new THREE.MeshStandardMaterial({ color: 0x3a2a1a })
  );
  handle.position.y = 0.45;
  bat.add(handle);
  const blade = new THREE.Mesh(
    new THREE.BoxGeometry(0.11, 0.6, 0.04),
    new THREE.MeshStandardMaterial({ color: 0xd4b686 })
  );
  blade.position.y = 0.15;
  bat.add(blade);
  bat.position.set(0.35, 0.9, 10);
  bat.rotation.z = -0.4;
  scene.add(bat);

  // ============ BALL ============
  ball = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R, 20, 20),
    new THREE.MeshStandardMaterial({ color: 0xd40000, roughness: 0.3 })
  );
  ball.castShadow = true;
  ball.position.set(0, 2, -10); // Release point
  scene.add(ball);

  // Set initial trajectory points
  setRandomTrajectory();

  // Start loop
  requestAnimationFrame(loop);
}

// ============ CREASE LINES ============
function addCreaseLines(zEnd, mat) {
  const isBatsmanEnd = zEnd > 0;
  const dir = isBatsmanEnd ? -1 : 1; // Direction towards bowler

  // Popping crease (1.22m in front of stumps, 3.66m wide)
  const pop = new THREE.Mesh(new THREE.PlaneGeometry(3.66, 0.05), mat);
  pop.rotation.x = -Math.PI / 2;
  pop.position.set(0, 0.02, zEnd + dir * 1.22);
  scene.add(pop);

  // Return creases (1.5m long, at 1.83m either side of center stump)
  const retL = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 1.5), mat);
  retL.rotation.x = -Math.PI / 2;
  retL.position.set(-1.32, 0.02, zEnd + dir * (1.22 - 0.75));
  scene.add(retL);

  const retR = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 1.5), mat);
  retR.rotation.x = -Math.PI / 2;
  retR.position.set(1.32, 0.02, zEnd + dir * (1.22 - 0.75));
  scene.add(retR);

  // Wide lines (0.889m from center stump)
  const wideL = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.05), mat);
  wideL.rotation.x = -Math.PI / 2;
  wideL.position.set(-0.889, 0.02, zEnd + dir * 1.22);
  scene.add(wideL);

  const wideR = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.05), mat);
  wideR.rotation.x = -Math.PI / 2;
  wideR.position.set(0.889, 0.02, zEnd + dir * 1.22);
  scene.add(wideR);

  // Bowling crease (through stump base, 2.64m wide)
  const bowl = new THREE.Mesh(new THREE.PlaneGeometry(2.64, 0.05), mat);
  bowl.rotation.x = -Math.PI / 2;
  bowl.position.set(0, 0.02, zEnd);
  scene.add(bowl);
}

// ============ STUMPS ============
function createStumps(x, z) {
  const group = new THREE.Group();
  const stumpGeo = new THREE.CylinderGeometry(STUMP_R, STUMP_R, STUMP_H, 8);
  const stumpMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });

  // 3 stumps, total width 0.23m -> spacing 0.076m between centers
  for (let i = -1; i <= 1; i++) {
    const s = new THREE.Mesh(stumpGeo, stumpMat);
    s.position.set(i * 0.076, STUMP_H / 2, 0);
    s.castShadow = true;
    group.add(s);
  }

  // 2 Bails (glowing yellow)
  for (let i = -1; i <= 1; i += 2) {
    const bail = new THREE.Mesh(
      new THREE.BoxGeometry(0.04, 0.015, 0.03),
      new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0x998800, emissiveIntensity: 0.6 })
    );
    bail.position.set(i * 0.038, STUMP_H + 0.01, 0);
    bail.castShadow = true;
    group.add(bail);
  }

  group.position.set(x, 0, z);
  return group;
}

// ============ RANDOM TRAJECTORY ============
function setRandomTrajectory() {
  // Bounce on the pitch at random position
  const bounceZ = -2 + Math.random() * 4;     // Between -2 and +2 on pitch
  const bounceX = (Math.random() - 0.5) * 1.2; // Random line
  ballPitch = new THREE.Vector3(bounceX, BALL_R, bounceZ);

  // Contact point at batsman (random height/width)
  const contactX = (Math.random() - 0.5) * 1.0;
  const contactY = 0.5 + Math.random() * 0.6;
  ballEnd = new THREE.Vector3(contactX, contactY, 10);

  // Release point at bowler's hand (2m high)
  ballStart = new THREE.Vector3(
    (Math.random() - 0.5) * 0.5,
    2.0,
    -10
  );
  ball.position.copy(ballStart);
}

// ============ ANIMATION LOOP ============
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (animState === 'delivery') {
    animTime += dt;
    // Delivery takes 1.5 seconds total
    const DURATION = 1.5;
    const p = Math.min(animTime / DURATION, 1);

    if (p < 0.55) {
      // Phase 1: Bowler release -> Pitch bounce (ball drops down)
      const t = p / 0.55;
      ball.position.lerpVectors(ballStart, ballPitch, t);
      // Parabolic drop from 2m to 0.045m
      ball.position.y = ballStart.y + (ballPitch.y - ballStart.y) * t;
    } else {
      // Phase 2: Pitch bounce -> Batsman contact (ball rises to contact)
      const t = (p - 0.55) / 0.45;
      ball.position.lerpVectors(ballPitch, ballEnd, t);
      ball.position.y = ballPitch.y + (ballEnd.y - ballPitch.y) * t;
    }

    if (p >= 1) {
      animState = 'shot';
      animTime = 0;
      bat.rotation.z = 0.6; // Bat swing
    }
  }
  else if (animState === 'shot') {
    animTime += dt;
    // Shot takes 2.5 seconds to reach boundary
    const DURATION = 2.5;
    const p = Math.min(animTime / DURATION, 1);

    const isSix = vppShot && vppShot.isSix;
    const isFour = vppShot && vppShot.isFour;
    const isWicket = vppShot && vppShot.isWicket;

    if (isWicket) {
      // Ball flies backwards after hitting stumps
      ball.position.z -= 15 * dt;
      ball.position.y += 4 * dt;
      if (animTime < 0.05) shatterStumps();
    } else {
      // Direction from wagon wheel zone (0-7)
      const zone = (vppShot && vppShot.zoneIndex >= 0) ? vppShot.zoneIndex : 4;
      const angle = (zone * Math.PI / 4);

      // Target boundary at 60m radius
      const totalDist = 55 + Math.random() * 10;
      const targetX = Math.sin(angle) * totalDist;
      const targetZ = 10 + Math.cos(angle) * totalDist;

      // Ease out curve
      const ease = 1 - Math.pow(1 - p, 2);
      ball.position.x = ballEnd.x + (targetX - ballEnd.x) * ease;
      ball.position.z = ballEnd.z + (targetZ - ballEnd.z) * ease;

      if (isSix) {
        // High flying arc for six
        const arc = Math.sin(p * Math.PI) * 12;
        ball.position.y = ballEnd.y + arc;
        // Show distance
        const distEl = document.getElementById('distance');
        if (distEl) {
          const realDist = (vppShot && vppShot.distance) ? vppShot.distance : Math.round(90 + Math.random() * 30);
          distEl.style.display = 'block';
          distEl.innerText = realDist + ' m';
        }
      } else {
        // Four/1/2/3 - ball stays low, bounces
        const bounceY = Math.abs(Math.sin(p * Math.PI * 2)) * 0.5 * (1 - p);
        ball.position.y = ballEnd.y * (1 - p) + bounceY;
      }
    }

    if (p >= 1) {
      setTimeout(resetScene, 1200);
    }
  }

  // Animate shattered pieces
  shatterPieces.forEach(piece => {
    piece.position.x += piece.userData.vx * dt;
    piece.position.y += piece.userData.vy * dt;
    piece.position.z += piece.userData.vz * dt;
    piece.userData.vy -= 15 * dt;
    piece.rotation.x += piece.userData.rx * dt;
    piece.rotation.y += piece.userData.ry * dt;
  });

  renderer.render(scene, camera);
}

// ============ SHATTER STUMPS ============
function shatterStumps() {
  stumpsBatting.visible = false;
  for (let i = 0; i < 3; i++) {
    const piece = new THREE.Mesh(
      new THREE.CylinderGeometry(STUMP_R, STUMP_R, 0.35, 8),
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a })
    );
    piece.position.set((i - 1) * 0.076, 0.35, 10);
    piece.castShadow = true;
    piece.userData = {
      vx: (Math.random() - 0.5) * 8,
      vy: 5 + Math.random() * 5,
      vz: -5 - Math.random() * 5,
      rx: Math.random() * 10,
      ry: Math.random() * 10
    };
    scene.add(piece);
    shatterPieces.push(piece);
  }
  // Bails flying
  for (let i = -1; i <= 1; i += 2) {
    const bail = new THREE.Mesh(
      new THREE.BoxGeometry(0.04, 0.015, 0.03),
      new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0x998800 })
    );
    bail.position.set(i * 0.038, STUMP_H + 0.01, 10);
    bail.userData = {
      vx: (Math.random() - 0.5) * 10,
      vy: 8 + Math.random() * 5,
      vz: -8 - Math.random() * 5,
      rx: Math.random() * 15,
      ry: Math.random() * 15
    };
    scene.add(bail);
    shatterPieces.push(bail);
  }
}

// ============ RESET ============
function resetScene() {
  shatterPieces.forEach(p => scene.remove(p));
  shatterPieces = [];
  stumpsBatting.visible = true;
  bat.rotation.z = -0.4;
  setRandomTrajectory();
  animState = 'idle';
  animTime = 0;
  ballDistance = 0;
  document.getElementById('distance').style.display = 'none';
}

// ============ DATA SYNC FROM PARENT ============
function updateScore() {
  const m = window.parent.match;
  if (!m || !m.teamBatting) return;
  const ov = Math.floor(m.legalBalls / 6) + '.' + (m.legalBalls % 6);
  const crr = m.legalBalls > 0 ? (m.runs / (m.legalBalls / 6)).toFixed(2) : '0.00';

  document.getElementById('teamName').innerText = m.teamBattingAbbr || m.teamBatting;
  document.getElementById('teamScore').innerText = m.runs + '-' + m.wickets;
  document.getElementById('teamOvers').innerText = '(' + ov + ')';
  document.getElementById('crr').innerText = crr;

  const st = m.batters[m.striker] || {runs: 0, balls: 0};
  const ns = m.batters[m.nonStriker] || {runs: 0, balls: 0};
  document.getElementById('strikerName').innerText = m.striker || '-';
  document.getElementById('strikerScore').innerText = st.runs + '(' + st.balls + ')';
  document.getElementById('nonStrikerName').innerText = m.nonStriker || '-';
  document.getElementById('nonStrikerScore').innerText = ns.runs + '(' + ns.balls + ')';

  const bw = m.bowlers[m.currentBowler] || {balls: 0, maidens: 0, runs: 0, wickets: 0};
  document.getElementById('bowlerName').innerText = m.currentBowler || '-';
  document.getElementById('bowlerFigures').innerText = Math.floor(bw.balls / 6) + '.' + (bw.balls % 6) + '-' + bw.maidens + '-' + bw.runs + '-' + bw.wickets;
}

// ============ POLL PARENT FOR NEW BALLS ============
setInterval(() => {
  updateScore();
  const m = window.parent.match;
  if (m && m.shotLog && m.shotLog.length > lastSeenBallCount) {
    const last = m.shotLog[m.shotLog.length - 1];
    lastSeenBallCount = m.shotLog.length;
    vppShot = last;
    resetScene();
    animState = 'delivery';
    animTime = 0;
  }
  if (m && m.shotLog) lastSeenBallCount = Math.max(lastSeenBallCount, m.shotLog.length);
}, 400);

// ============ RESIZE ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ BOOT ============
init();
</script>
</body>
</html>
