<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CricMax Pro - 3D Stadium</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    .hud-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .broadcast-badge { background: #ef4444; color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 2px; padding: 5px 12px; border-radius: 6px; box-shadow: 0 0 15px rgba(239,68,68,.7); display: flex; align-items: center; gap: 6px; }
    .broadcast-badge::before { content:''; width: 7px; height: 7px; background: #fff; border-radius: 50%; display: inline-block; }
    
    .cam-pills { display: flex; gap: 6px; pointer-events: auto; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); }
    .cam-btn { background: transparent; border: 1px solid rgba(255,255,255,.18); color: #cbd5e1; padding: 7px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; transition: all .2s; }
    .cam-btn.active, .cam-btn:hover { background: #00e676; color: #0a0e1a; border-color: transparent; box-shadow: 0 0 14px rgba(0,230,118,.5); }
    
    .event-banner { position: absolute; top: 18%; left: 50%; transform: translateX(-50%) scale(.7); font-size: clamp(38px, 7vw, 84px); font-weight: 900; font-style: italic; text-transform: uppercase; color: #fff; opacity: 0; transition: all .35s cubic-bezier(.175,.885,.32,1.275); text-align: center; line-height: 1; pointer-events: none; }
    .event-banner.active { transform: translateX(-50%) scale(1); opacity: 1; }
    .event-banner.four { color: #22d3ee; text-shadow: 0 0 40px #0891b2, 0 6px 20px #000; }
    .event-banner.six { color: #ff6d00; text-shadow: 0 0 40px #fbbf24, 0 6px 20px #000; }
    .event-banner.wkt { color: #ef4444; text-shadow: 0 0 40px #7f1d1d, 0 6px 20px #000; }

    .tv-scorecard { pointer-events: auto; background: linear-gradient(90deg, rgba(8,18,30,.96), rgba(3,8,15,.98)); border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(16px); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.8); max-width: 900px; margin: 0 auto; width: 100%; }
    .tv-team { display: flex; align-items: center; gap: 10px; font-weight: 900; }
    .tv-team-badge { background: #00e676; color: #0a0e1a; padding: 2px 7px; border-radius: 4px; font-size: 11px; }
    .tv-score { font-size: 24px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
    .tv-overs { font-size: 12px; color: #94a3b8; font-weight: 700; margin-left: 4px; }
    .tv-batsmen { display: flex; gap: 24px; font-size: 13px; font-weight: 700; }
    .tv-batter.striker { color: #00e676; }
    .tv-bowler { font-size: 13px; font-weight: 700; text-align: right; color: #22d3ee; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-layer">
    <div class="top-bar">
      <div class="broadcast-badge">LIVE 3D BROADCAST</div>
      <div class="cam-pills">
        <button class="cam-btn active" id="btnCamBroadcast" onclick="setCameraMode('broadcast')">📺 TV</button>
        <button class="cam-btn" id="btnCamBowler" onclick="setCameraMode('bowler')">🎯 Bowler</button>
        <button class="cam-btn" id="btnCamSide" onclick="setCameraMode('side')">🎬 Side</button>
        <button class="cam-btn" id="btnCamFollow" onclick="setCameraMode('follow')">⚾ Ball Cam</button>
      </div>
    </div>

    <div id="eventBanner" class="event-banner">FOUR!</div>

    <div class="tv-scorecard">
      <div class="tv-team">
        <span class="tv-team-badge" id="tvAbbr">BAT</span>
        <span class="tv-score" id="tvScore">0/0</span>
        <span class="tv-overs" id="tvOvers">(0.0)</span>
      </div>
      <div class="tv-batsmen">
        <div class="tv-batter striker" id="tvStriker">Striker* 0(0)</div>
        <div class="tv-batter" id="tvNonStriker">Non-Striker 0(0)</div>
      </div>
      <div class="tv-bowler" id="tvBowler">Bowler: 0.0-0-0-0</div>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060b14);
    scene.fog = new THREE.FogExp2(0x060b14, 0.007);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 800);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xdde8ff, 0.5);
    scene.add(ambientLight);

    // Floodlight Towers
    const towerCoords = [{ x: -55, z: -55 }, { x: 55, z: -55 }, { x: -55, z: 55 }, { x: 55, z: 55 }];
    towerCoords.forEach(pos => {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 38, 8), new THREE.MeshStandardMaterial({ color: 0x222a38, metalness: 0.8 }));
      pole.position.set(pos.x, 19, pos.z);
      scene.add(pole);

      const light = new THREE.SpotLight(0xfffae6, 1.4, 160, Math.PI / 3.5, 0.4, 1.2);
      light.position.set(pos.x, 37, pos.z);
      light.target.position.set(0, 0, 0);
      light.castShadow = true;
      light.shadow.mapSize.width = 1024;
      light.shadow.mapSize.height = 1024;
      scene.add(light);
      scene.add(light.target);
    });

    // Ground & Pitch
    function generateGrassTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1024;
      const ctx = cv.getContext('2d');
      for (let r = 512; r > 0; r -= 32) {
        ctx.beginPath();
        ctx.arc(512, 512, r, 0, Math.PI * 2);
        ctx.fillStyle = (r / 32) % 2 === 0 ? '#26632f' : '#2f7839';
        ctx.fill();
      }
      return new THREE.CanvasTexture(cv);
    }

    const ground = new THREE.Mesh(new THREE.CircleGeometry(68, 64), new THREE.MeshStandardMaterial({ map: generateGrassTexture(), roughness: 0.9 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const pitch = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 22.2), new THREE.MeshStandardMaterial({ color: 0xc4ab80, roughness: 0.85 }));
    pitch.rotation.x = -Math.PI / 2;
    pitch.position.y = 0.03;
    pitch.receiveShadow = true;
    scene.add(pitch);

    function addCrease(z) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.04, z);
      scene.add(line);
    }
    addCrease(8.8); addCrease(-8.8); addCrease(10.0); addCrease(-10.0);

    const rope = new THREE.Mesh(new THREE.TorusGeometry(62, 0.35, 12, 96), new THREE.MeshStandardMaterial({ color: 0xefefef }));
    rope.rotation.x = -Math.PI / 2;
    rope.position.y = 0.3;
    scene.add(rope);

    function createStumps(zPos) {
      const group = new THREE.Group();
      const woodMat = new THREE.MeshStandardMaterial({ color: 0xf3ede2, roughness: 0.4 });
      for (let i = -1; i <= 1; i++) {
        const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.76, 12), woodMat);
        stump.position.set(i * 0.11, 0.38, 0);
        stump.castShadow = true;
        group.add(stump);
      }
      const bail = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.28, 8), woodMat);
      bail.rotation.z = Math.PI / 2;
      bail.position.set(0, 0.77, 0);
      group.add(bail);
      group.position.set(0, 0, zPos);
      scene.add(group);
      return group;
    }
    const strikerStumps = createStumps(10.0);
    const bowlerStumps = createStumps(-10.0);

    // Characters
    function buildBatsman() {
      const rig = new THREE.Group();
      const jersey = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
      const skin = new THREE.MeshLambertMaterial({ color: 0xd9a57a });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.65, 10), jersey);
      torso.position.y = 1.3;
      rig.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), skin);
      head.position.y = 1.75;
      rig.add(head);

      const shoulders = new THREE.Group();
      shoulders.position.set(0, 1.5, 0);
      rig.add(shoulders);

      const batPivot = new THREE.Group();
      batPivot.position.set(0, -0.45, 0.25);
      shoulders.add(batPivot);

      const bat = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.85, 0.05), new THREE.MeshStandardMaterial({ color: 0xd4a373 }));
      bat.position.y = -0.35;
      batPivot.add(bat);

      rig.shoulders = shoulders;
      rig.batPivot = batPivot;
      return rig;
    }
    const batsman = buildBatsman();
    batsman.position.set(0.3, 0, 8.8);
    batsman.rotation.y = -Math.PI / 2;
    scene.add(batsman);

    function buildUmpire() {
      const rig = new THREE.Group();
      const coat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
      const skin = new THREE.MeshLambertMaterial({ color: 0xd4a373 });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.24, 0.85, 10), coat);
      torso.position.y = 1.25;
      rig.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), skin);
      head.position.y = 1.82;
      rig.add(head);

      const leftShoulder = new THREE.Group();
      leftShoulder.position.set(-0.36, 1.6, 0);
      rig.add(leftShoulder);
      const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.65, 8), coat);
      leftArm.position.y = -0.32;
      leftShoulder.add(leftArm);

      const rightShoulder = new THREE.Group();
      rightShoulder.position.set(0.36, 1.6, 0);
      rig.add(rightShoulder);
      const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.65, 8), coat);
      rightArm.position.y = -0.32;
      rightShoulder.add(rightArm);

      rig.leftShoulder = leftShoulder;
      rig.rightShoulder = rightShoulder;
      return rig;
    }
    const umpire = buildUmpire();
    umpire.position.set(0, 0, -11.8);
    scene.add(umpire);

    const bowler = new THREE.Group();
    const bTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.72, 8), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
    bTorso.position.y = 1.05;
    bowler.add(bTorso);
    const bArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.6, 8), new THREE.MeshStandardMaterial({ color: 0xdc2626 }));
    bArm.position.set(0.35, 1.25, 0);
    bowler.add(bArm);
    bowler.arm = bArm;
    bowler.position.set(0, 0, -18.0);
    scene.add(bowler);

    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 24), new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.3 }));
    ball.castShadow = true;
    ball.visible = false;
    scene.add(ball);

    /* =======================================================
       CAMERA MODES & DISPATCHER
       ======================================================= */
    const cameraModes = {
      broadcast: { pos: new THREE.Vector3(0, 16, 32), target: new THREE.Vector3(0, 1.2, 2) },
      bowler:    { pos: new THREE.Vector3(0, 4.2, -22), target: new THREE.Vector3(0, 1, 9) },
      side:      { pos: new THREE.Vector3(26, 5, 8), target: new THREE.Vector3(0, 1, 8) },
      follow:    { pos: new THREE.Vector3(0, 8, -6), target: new THREE.Vector3(0, 0.5, 9) }
    };

    let activeCam = 'broadcast';
    let currentCamPos = cameraModes.broadcast.pos.clone();
    let currentCamTarget = cameraModes.broadcast.target.clone();

    window.setCameraMode = function(mode) {
      if (!cameraModes[mode]) return;
      activeCam = mode;

      document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btnCam' + mode.charAt(0).toUpperCase() + mode.slice(1));
      if (activeBtn) activeBtn.classList.add('active');
    };

    // Expose for parent window buttons
    window.setCamExternal = window.setCameraMode;

    let deliveryAnimId = null;
    let umpireSignal = 'idle';
    let signalStartTime = 0;
    let lastPlayedShot = null;

    window.replayLastBall = function() {
      if (lastPlayedShot) play3DDelivery(lastPlayedShot);
    };

    function animateUmpireGesture(now) {
      if (umpireSignal === 'idle') {
        umpire.leftShoulder.rotation.z = THREE.MathUtils.lerp(umpire.leftShoulder.rotation.z, 0, 0.08);
        umpire.leftShoulder.rotation.x = THREE.MathUtils.lerp(umpire.leftShoulder.rotation.x, 0, 0.08);
        umpire.rightShoulder.rotation.z = THREE.MathUtils.lerp(umpire.rightShoulder.rotation.z, 0, 0.08);
        umpire.rightShoulder.rotation.x = THREE.MathUtils.lerp(umpire.rightShoulder.rotation.x, 0, 0.08);
        return;
      }

      const elapsed = (now - signalStartTime) / 1000;

      if (umpireSignal === 'wicket') {
        umpire.rightShoulder.rotation.z = THREE.MathUtils.lerp(umpire.rightShoulder.rotation.z, -Math.PI * 0.95, 0.12);
        umpire.leftShoulder.rotation.z = THREE.MathUtils.lerp(umpire.leftShoulder.rotation.z, 0, 0.1);
      } else if (umpireSignal === 'six') {
        umpire.leftShoulder.rotation.z = THREE.MathUtils.lerp(umpire.leftShoulder.rotation.z, Math.PI * 0.95, 0.12);
        umpire.rightShoulder.rotation.z = THREE.MathUtils.lerp(umpire.rightShoulder.rotation.z, -Math.PI * 0.95, 0.12);
      } else if (umpireSignal === 'four') {
        const wave = Math.sin(elapsed * 7.5);
        umpire.rightShoulder.rotation.x = THREE.MathUtils.lerp(umpire.rightShoulder.rotation.x, -Math.PI / 2.3, 0.15);
        umpire.rightShoulder.rotation.z = -Math.PI / 4 + (wave * 0.45);
        umpire.leftShoulder.rotation.z = THREE.MathUtils.lerp(umpire.leftShoulder.rotation.z, 0, 0.1);
      }

      if (elapsed > 4.2) umpireSignal = 'idle';
    }

    function play3DDelivery(shotData) {
      if (deliveryAnimId) cancelAnimationFrame(deliveryAnimId);
      lastPlayedShot = shotData;

      ball.visible = true;
      const startTime = performance.now();
      const pitchZ = 3.5 + ((shotData.ballRandom || 0.5) * 1.5);
      const pitchX = (Math.random() - 0.5) * 0.4;
      const runs = shotData.runs || 0;
      const isSix = shotData.isSix;
      const isFour = shotData.isFour;
      const isWicket = shotData.isWicket;

      const angle = shotData.zoneIndex >= 0 ? (shotData.zoneIndex * Math.PI / 4) : Math.PI / 2;
      let finalDist = 18;
      if (isSix) finalDist = 67;
      else if (isFour) finalDist = 63;
      else if (runs > 0) finalDist = runs * 9;

      const hitX = Math.sin(angle) * finalDist;
      const hitZ = 8.8 + Math.cos(angle) * (finalDist * 0.7);

      function loop(now) {
        const elapsed = now - startTime;

        if (elapsed < 600) {
          const t = elapsed / 600;
          bowler.position.z = -18 + (t * 7.5);
          bowler.arm.rotation.x = -Math.PI * 2 * t * 2;
          ball.position.set(bowler.position.x + 0.35, 2.0, bowler.position.z);
          batsman.batPivot.rotation.x = -Math.PI / 5;
        } else if (elapsed < 1150) {
          const t = (elapsed - 600) / 550;
          if (t < 0.65) {
            const pt = t / 0.65;
            ball.position.x = THREE.MathUtils.lerp(0, pitchX, pt);
            ball.position.z = THREE.MathUtils.lerp(-10.5, pitchZ, pt);
            ball.position.y = THREE.MathUtils.lerp(2.2, 0.14, pt * pt);
          } else {
            const pt = (t - 0.65) / 0.35;
            ball.position.x = THREE.MathUtils.lerp(pitchX, batsman.position.x - 0.1, pt);
            ball.position.z = THREE.MathUtils.lerp(pitchZ, 8.8, pt);
            ball.position.y = 0.14 + (Math.sin(pt * Math.PI * 0.5) * 0.95);
          }
          batsman.batPivot.rotation.x = -Math.PI / 3;
        } else if (elapsed < 3500) {
          const t = (elapsed - 1150) / 2350;

          if (isWicket) {
            batsman.batPivot.rotation.x = 0;
            strikerStumps.rotation.z = Math.min(0.85, t * 2.5);
            ball.position.set(0.1, 0.3, 10.4);
          } else {
            batsman.batPivot.rotation.x = -Math.PI / 3 + (Math.min(1, t * 4) * Math.PI * 0.85);
            ball.position.x = THREE.MathUtils.lerp(batsman.position.x, hitX, t);
            ball.position.z = THREE.MathUtils.lerp(8.8, hitZ, t);

            if (isSix) ball.position.y = 0.8 + (Math.sin(t * Math.PI) * 22.0);
            else if (isFour) ball.position.y = 0.2 + (Math.abs(Math.sin(t * Math.PI * 3.5)) * 1.5 * (1 - t));
            else ball.position.y = 0.14;
          }

          // Follow Mode: Ball Cam directly tails the projectile
          if (activeCam === 'follow') {
            currentCamPos.set(ball.position.x, ball.position.y + 2.5, ball.position.z - 6.0);
            currentCamTarget.copy(ball.position);
          } else if (activeCam === 'broadcast' && (isSix || isFour)) {
            currentCamTarget.lerp(ball.position, 0.05);
          }
        } else {
          deliveryAnimId = null;
          return;
        }

        deliveryAnimId = requestAnimationFrame(loop);
      }

      deliveryAnimId = requestAnimationFrame(loop);

      setTimeout(() => {
        signalStartTime = performance.now();
        if (isWicket) umpireSignal = 'wicket';
        else if (isSix) umpireSignal = 'six';
        else if (isFour) umpireSignal = 'four';
        else umpireSignal = 'idle';

        const b = document.getElementById('eventBanner');
        b.className = 'event-banner';
        if (shotData.isWicket) { b.innerText = 'OUT / WICKET!'; b.classList.add('wkt', 'active'); }
        else if (shotData.isSix) { b.innerText = 'MAXIMUM 6!'; b.classList.add('six', 'active'); }
        else if (shotData.isFour) { b.innerText = 'CRACKING FOUR!'; b.classList.add('four', 'active'); }
        else { b.innerText = shotData.runs > 0 ? `${shotData.runs} RUNS` : 'DOT BALL'; b.classList.add('active'); }
        setTimeout(() => b.classList.remove('active'), 2400);
      }, 1200);
    }

    let lastSeenBallCount = 0;
    function pollMatchState() {
      const m = window.parent ? window.parent.match : window.match;
      if (!m) return;

      document.getElementById('tvAbbr').innerText = m.teamBattingAbbr || m.teamBatting || 'BAT';
      document.getElementById('tvScore').innerText = `${m.runs || 0}/${m.wickets || 0}`;
      document.getElementById('tvOvers').innerText = `(${Math.floor((m.legalBalls || 0) / 6)}.${(m.legalBalls || 0) % 6})`;

      const st = (m.batters && m.batters[m.striker]) || { runs: 0, balls: 0 };
      const nst = (m.batters && m.batters[m.nonStriker]) || { runs: 0, balls: 0 };
      const bw = (m.bowlers && m.bowlers[m.currentBowler]) || { balls: 0, maidens: 0, runs: 0, wickets: 0 };

      document.getElementById('tvStriker').innerText = `${m.striker || 'Striker'}* ${st.runs}(${st.balls})`;
      document.getElementById('tvNonStriker').innerText = `${m.nonStriker || 'Non-Striker'} ${nst.runs}(${nst.balls})`;
      document.getElementById('tvBowler').innerText = `${m.currentBowler || 'Bowler'}: ${Math.floor(bw.balls / 6)}.${bw.balls % 6}-${bw.maidens}-${bw.runs}-${bw.wickets}`;

      if (m.shotLog && m.shotLog.length > lastSeenBallCount) {
        const lastShot = m.shotLog[m.shotLog.length - 1];
        lastSeenBallCount = m.shotLog.length;
        play3DDelivery(lastShot);
      }
    }
    setInterval(pollMatchState, 400);

    function render(now) {
      requestAnimationFrame(render);

      if (activeCam !== 'follow') {
        currentCamPos.lerp(cameraModes[activeCam].pos, 0.05);
        if (!deliveryAnimId || activeCam !== 'broadcast') {
          currentCamTarget.lerp(cameraModes[activeCam].target, 0.05);
        }
      }

      camera.position.copy(currentCamPos);
      camera.lookAt(currentCamTarget);

      animateUmpireGesture(now);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(render);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
