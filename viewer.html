<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricMax 3D Viewer</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
  #container { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scorecard { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, rgba(10,14,26,.98), rgba(10,14,26,.85)); border-top: 1px solid rgba(255,255,255,.15); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); font-size: 12px; z-index: 100; }
  .team { display: flex; align-items: center; gap: 8px; border-right: 1px solid rgba(255,255,255,.1); padding-right: 16px; }
  .flag { background: #00e676; color: #0a0e1a; padding: 2px 8px; border-radius: 4px; font-weight: 900; font-size: 11px; }
  .score { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .overs { font-size: 11px; color: #94a3b8; font-weight: 700; }
  .batsmen { display: flex; flex-direction: column; gap: 2px; flex: 1; padding: 0 16px; }
  .bowler { display: flex; flex-direction: column; gap: 2px; border-left: 1px solid rgba(255,255,255,.1); padding-left: 16px; text-align: right; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
  .row.active { color: #00e676; }
  #distance { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 36px; font-weight: 900; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 20px #ff6d00, 0 0 40px #fbbf24, 0 6px 24px #000; display: none; pointer-events: none; z-index: 100; color: #fff; }
  .camera-btns { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 150; }
  .camera-btns button { background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.2); color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 800; cursor: pointer; backdrop-filter: blur(5px); }
  .camera-btns button.active { background: #00e676; color: #000; }
</style>
</head>
<body>
<div id="container"></div>
<div id="distance">0 m</div>
<div class="camera-btns">
  <button id="cam-broadcast" class="active" onclick="setCamera('broadcast')">📺 Broadcast</button>
  <button id="cam-side" onclick="setCamera('side')">🎬 Side</button>
  <button id="cam-bowl" onclick="setCamera('bowl')">🎯 Behind Bowler</button>
  <button id="cam-ball" onclick="setCamera('ball')">⚾ Ball Cam</button>
</div>
<div id="scorecard">
  <div class="team">
    <span class="flag" id="teamName">TEAM</span>
    <span class="score" id="teamScore">0-0</span>
    <span class="overs" id="teamOvers">(0.0)</span>
  </div>
  <div class="batsmen">
    <div class="row active"><span id="strikerName">-</span> <b id="strikerScore">0(0)</b></div>
    <div class="row"><span id="nonStrikerName">-</span> <b id="nonStrikerScore">0(0)</b></div>
  </div>
  <div class="bowler">
    <div class="row"><span id="bowlerName">-</span> <b id="bowlerFigures">0.0-0-0-0</b></div>
    <div class="row" style="color:#94a3b8;font-size:10px;">CRR: <b id="crr" style="color:#22d3ee;">0.00</b></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- 3D GLOBALS ---
let scene, camera, renderer;
let ball, bat, stumpsBatting, stumpsBowling;
let shatterPieces = [];
let clock = new THREE.Clock();
let animState = 'idle'; // 'delivery', 'shot'
let animTime = 0;
let currentCam = 'broadcast';
let ballDistance = 0;
let vppShot = null;

// --- REAL-WORLD DIMENSIONS (in meters) ---
const PITCH_LENGTH = 20.12;
const STUMP_HEIGHT = 0.71;
const STUMP_WIDTH = 0.23;
const BALL_RADIUS = 0.04; // Slightly larger than real for visibility
const POPPING_CREASE_DIST = 1.22;
const BAT_LENGTH = 0.96;
const BAT_WIDTH = 0.11;

let ballStartPos = new THREE.Vector3(0, 2.0, -10.06); // Bowler release height
let ballBouncePos = new THREE.Vector3(0, 0, 0); // Random pitch bounce point
let ballEndPos = new THREE.Vector3(0, 0.8, 10.06); // Batsman contact point

function init3D() {
  const container = document.getElementById('container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e1a);
  scene.fog = new THREE.Fog(0x0a0e1a, 60, 200);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(20, 40, 20);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  scene.add(dirLight);

  // Ground (Green)
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x2d6f38, roughness: 0.9 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Pitch (Brown)
  const pitch = new THREE.Mesh(new THREE.PlaneGeometry(3.05, PITCH_LENGTH), new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 1.0 }));
  pitch.rotation.x = -Math.PI / 2;
  pitch.position.y = 0.01;
  pitch.receiveShadow = true;
  scene.add(pitch);

  // Boundary Rope (Radius 60)
  const boundaryGeo = new THREE.TorusGeometry(60, 0.5, 16, 100);
  const boundary = new THREE.Mesh(boundaryGeo, new THREE.MeshStandardMaterial({ color: 0xffffff }));
  boundary.rotation.x = Math.PI / 2;
  boundary.position.y = 0.1;
  scene.add(boundary);

  // --- CREASE MARKINGS (White Lines) ---
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  
  // Popping Crease (1.22m from stumps, 3.66m wide)
  const popCreaseGeo = new THREE.PlaneGeometry(3.66, 0.05);
  const popCreaseBat = new THREE.Mesh(popCreaseGeo, lineMat);
  popCreaseBat.rotation.x = -Math.PI / 2;
  popCreaseBat.position.set(0, 0.02, 10.06 - POPPING_CREASE_DIST);
  scene.add(popCreaseBat);
  
  const popCreaseBowl = new THREE.Mesh(popCreaseGeo, lineMat);
  popCreaseBowl.rotation.x = -Math.PI / 2;
  popCreaseBowl.position.set(0, 0.02, -10.06 + POPPING_CREASE_DIST);
  scene.add(popCreaseBowl);

  // Return Creases (Extending backwards from popping crease)
  const returnCreaseGeo = new THREE.PlaneGeometry(0.05, 1.5);
  const returnBatL = new THREE.Mesh(returnCreaseGeo, lineMat);
  returnBatL.rotation.x = -Math.PI / 2;
  returnBatL.position.set(-1.83, 0.02, 10.06 - POPPING_CREASE_DIST + 0.75);
  scene.add(returnBatL);
  
  const returnBatR = new THREE.Mesh(returnCreaseGeo, lineMat);
  returnBatR.rotation.x = -Math.PI / 2;
  returnBatR.position.set(1.83, 0.02, 10.06 - POPPING_CREASE_DIST + 0.75);
  scene.add(returnBatR);

  // Wide Lines (35 inches / 0.889m from center stump)
  const wideLineGeo = new THREE.PlaneGeometry(0.05, 0.05);
  const wideBatL = new THREE.Mesh(wideLineGeo, lineMat);
  wideBatL.rotation.x = -Math.PI / 2;
  wideBatL.position.set(-0.889, 0.02, 10.06 - POPPING_CREASE_DIST);
  scene.add(wideBatL);
  
  const wideBatR = new THREE.Mesh(wideLineGeo, lineMat);
  wideBatR.rotation.x = -Math.PI / 2;
  wideBatR.position.set(0.889, 0.02, 10.06 - POPPING_CREASE_DIST);
  scene.add(wideBatR);

  // --- 3D STUMPS (Dark & Visible) ---
  function createStumps(x, z) {
    const group = new THREE.Group();
    const stumpGeo = new THREE.CylinderGeometry(0.04, 0.04, STUMP_HEIGHT, 8);
    const stumpMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
    for (let i = -1; i <= 1; i++) {
      const stump = new THREE.Mesh(stumpGeo, stumpMat);
      stump.position.set(i * 0.08, STUMP_HEIGHT/2, 0); // Real width 22.86cm
      stump.castShadow = true;
      group.add(stump);
    }
    const bailGeo = new THREE.BoxGeometry(0.24, 0.03, 0.05);
    const bailMat = new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0x554400 }); 
    const bail = new THREE.Mesh(bailGeo, bailMat);
    bail.position.set(0, STUMP_HEIGHT + 0.02, 0);
    bail.castShadow = true;
    group.add(bail);
    group.position.set(x, 0, z);
    return group;
  }

  stumpsBowling = createStumps(0, -10.06);
  stumpsBatting = createStumps(0, 10.06);
  scene.add(stumpsBowling);
  scene.add(stumpsBatting);

  // --- BATSMAN & BAT ---
  bat = new THREE.Group();
  const batHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 8), new THREE.MeshStandardMaterial({ color: 0x3a2a1a }));
  batHandle.position.y = -0.15;
  bat.add(batHandle);
  const batBlade = new THREE.Mesh(new THREE.BoxGeometry(BAT_WIDTH, BAT_LENGTH * 0.6, 0.04), new THREE.MeshStandardMaterial({ color: 0xd4b686 }));
  batBlade.position.y = -0.15 - BAT_LENGTH * 0.3;
  bat.add(batBlade);
  bat.position.set(0.5, 0.8, 10.06); // At batting crease
  bat.rotation.z = -0.3;
  scene.add(bat);

  // --- BALL ---
  ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.2 }));
  ball.castShadow = true;
  ball.position.copy(ballStartPos);
  scene.add(ball);

  clock = new THREE.Clock();
  setCamera('broadcast');
  animate();
}

// --- CAMERA CONTROLS (No Manual Pan/Zoom) ---
window.setCamera = function(view) {
  currentCam = view;
  document.querySelectorAll('.camera-btns button').forEach(b => b.classList.remove('active'));
  document.getElementById('cam-' + view).classList.add('active');

  if (view === 'broadcast') {
    camera.position.set(0, 10, 25);
    camera.lookAt(0, 0, 0);
  } else if (view === 'side') {
    camera.position.set(25, 5, 0);
    camera.lookAt(0, 0, 0);
  } else if (view === 'bowl') {
    camera.position.set(0, 3, -18);
    camera.lookAt(0, 0, 10.06);
  }
  // 'ball' camera is handled in the animation loop
};

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);

  if (animState === 'delivery') {
    animTime += delta;
    // 2 seconds for ball to bounce on pitch
    const progress = Math.min(1, animTime / 2.0);
    
    // Phase 1: Bowler to Pitch (Drop)
    if (progress < 0.5) {
      const p = progress / 0.5;
      ball.position.lerpVectors(ballStartPos, ballBouncePos, p);
      ball.position.y = THREE.MathUtils.lerp(ballStartPos.y, 0, p);
    } 
    // Phase 2: Pitch to Batsman (Bounce)
    else {
      const p = (progress - 0.5) / 0.5;
      ball.position.lerpVectors(ballBouncePos, ballEndPos, p);
      ball.position.y = THREE.MathUtils.lerp(0, ballEndPos.y, p);
    }

    if (progress >= 1) { 
      animState = 'shot'; 
      animTime = 0; 
      bat.rotation.z = 0.5; // Bat swing animation
    }
  } 
  else if (animState === 'shot') {
    animTime += delta;
    const isSix = vppShot && vppShot.isSix;
    const isFour = vppShot && vppShot.isFour;
    const isWicket = vppShot && vppShot.isWicket;
    
    // 3 seconds for ball to reach boundary
    const duration = 3.0;
    const progress = Math.min(1, animTime / duration);
    const angle = (vppShot && vppShot.zoneIndex >= 0 ? vppShot.zoneIndex : 4) * (Math.PI / 4);

    if (isWicket) {
      // Shatter logic handled below
      ball.position.z -= 20 * delta;
      ball.position.y += 5 * delta;
    } else {
      const speed = isSix ? 40 : 25;
      const dx = Math.cos(angle) * speed * delta;
      const dz = Math.sin(angle) * speed * delta;
      ball.position.x += dx;
      ball.position.z += dz;
      ballDistance += Math.sqrt(dx*dx + dz*dz);

      if (isSix) {
        // Six flies high
        ball.position.y += (Math.sin(progress * Math.PI) * 15) * delta;
        
        // Show distance ONLY for Six, using wagon wheel data
        const sixDist = vppShot.distance > 0 ? vppShot.distance : Math.round(90 + Math.random() * 30);
        document.getElementById('distance').style.display = 'block';
        document.getElementById('distance').innerText = sixDist + ' m';
      } else {
        // Four rolls/bounces
        const bounceHeight = Math.max(0, Math.sin(progress * Math.PI * 2) * 0.5 * (1 - progress));
        ball.position.y = bounceHeight;
      }
    }
    
    // Ball Cam: Follow the ball automatically
    if (currentCam === 'ball') {
      camera.position.copy(ball.position).add(new THREE.Vector3(-2, 3, -2));
      camera.lookAt(ball.position);
    }

    if (progress >= 1) {
      document.getElementById('distance').style.display = 'none';
      setTimeout(resetScene, 1500);
    }
  }

  // Shatter Pieces Animation
  shatterPieces.forEach(p => {
    p.position.x += p.userData.velocity.x * delta;
    p.position.y += p.userData.velocity.y * delta;
    p.position.z += p.userData.velocity.z * delta;
    p.userData.velocity.y -= 20 * delta; // Gravity
    p.rotation.x += p.userData.rotationSpeed.x * delta;
    p.rotation.y += p.userData.rotationSpeed.y * delta;
    p.rotation.z += p.userData.rotationSpeed.z * delta;
  });

  renderer.render(scene, camera);
}

function shatterStumps() {
  stumpsBatting.visible = false;
  for (let i = 0; i < 3; i++) {
    const piece = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
    piece.position.copy(stumpsBatting.position);
    piece.position.x += (i - 1) * 0.08;
    piece.position.y = 0.35;
    piece.userData = { 
      velocity: new THREE.Vector3((Math.random() - 0.5) * 15, Math.random() * 10 + 5, -Math.random() * 15 - 5), 
      rotationSpeed: new THREE.Vector3(Math.random() * 10, Math.random() * 10, Math.random() * 10) 
    };
    scene.add(piece);
    shatterPieces.push(piece);
  }
}

function resetScene() {
  ball.position.copy(ballStartPos);
  ball.visible = true;
  stumpsBatting.visible = true;
  bat.rotation.z = -0.3;
  shatterPieces.forEach(p => scene.remove(p));
  shatterPieces = [];
  animState = 'idle';
  animTime = 0;
  ballDistance = 0;
}

// --- DATA SYNC FROM MAIN APP ---
function updateScore() {
  const m = window.parent.match; 
  if (!m || !m.teamBatting) return;
  const ov = Math.floor(m.legalBalls/6) + '.' + (m.legalBalls%6);
  const crr = m.legalBalls > 0 ? (m.runs / (m.legalBalls/6)).toFixed(2) : '0.00';
  
  document.getElementById('teamName').innerText = m.teamBattingAbbr || m.teamBatting;
  document.getElementById('teamScore').innerText = m.runs + '-' + m.wickets;
  document.getElementById('teamOvers').innerText = '(' + ov + ')';
  document.getElementById('crr').innerText = crr;
  
  const st = m.batters[m.striker] || {runs:0, balls:0};
  const ns = m.batters[m.nonStriker] || {runs:0, balls:0};
  document.getElementById('strikerName').innerText = m.striker || '-';
  document.getElementById('strikerScore').innerText = st.runs + '(' + st.balls + ')';
  document.getElementById('nonStrikerName').innerText = m.nonStriker || '-';
  document.getElementById('nonStrikerScore').innerText = ns.runs + '(' + ns.balls + ')';
  
  const bw = m.bowlers[m.currentBowler] || {balls:0, maidens:0, runs:0, wickets:0};
  document.getElementById('bowlerName').innerText = m.currentBowler || '-';
  document.getElementById('bowlerFigures').innerText = Math.floor(bw.balls/6) + '.' + (bw.balls%6) + '-' + bw.maidens + '-' + bw.runs + '-' + bw.wickets;
}

init3D();

setInterval(() => {
  updateScore();
  const m = window.parent.match;
  if (m && m.shotLog && m.shotLog.length > lastSeenBallCount) {
    const last = m.shotLog[m.shotLog.length - 1];
    lastSeenBallCount = m.shotLog.length;
    vppShot = last;
    resetScene();
    animState = 'delivery';
    
    // Randomize bounce point
    ballBouncePos.set((Math.random() - 0.5) * 2, 0, (Math.random() * 4) + 2); // Between 2m and 6m from bowler
    ballEndPos.set((Math.random() - 0.5) * 1.5, 0.8, 10.06);
    
    if(vppShot.isWicket) setTimeout(shatterStumps, 2000); // Trigger shatter after ball hits stumps
  }
  if (m && m.shotLog) lastSeenBallCount = Math.max(lastSeenBallCount, m.shotLog.length);
}, 500);

window.addEventListener('resize', () => {
  if (camera && renderer) {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
});
</script>
</body>
</html>
