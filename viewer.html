<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CricMax Pro — Match Viewer</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:9999;}
  .top-row{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;}
  .top-left-stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:auto;}
  .top-center{display:flex;justify-content:center;align-items:flex-start;pointer-events:auto;flex:1;min-width:0;}
  .top-right{display:flex;gap:8px;align-items:flex-start;pointer-events:auto;}
  .cluster{display:flex;gap:6px;background:rgba(8,14,28,.85);padding:5px 8px;border-radius:14px;backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);pointer-events:auto;align-items:center;}
  .live{background:#ef4444;color:#fff;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:900;letter-spacing:1.5px;display:inline-flex;align-items:center;gap:7px;box-shadow:0 0 16px rgba(239,68,68,.75);}
  .live::before{content:'';width:8px;height:8px;background:#fff;border-radius:50%;animation:blink 1s infinite alternate;}
  @keyframes blink{0%{opacity:.3;}100%{opacity:1;}}
  .btn{background:transparent;border:1px solid rgba(255,255,255,.12);color:#cbd5e1;padding:6px 11px;border-radius:8px;font-size:10.5px;font-weight:800;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:rgba(0,230,118,.18);color:#fff;border-color:rgba(0,230,118,.5);}
  .btn.on{background:linear-gradient(135deg,#009270,#00e676);color:#0a0e1a;border-color:transparent;box-shadow:0 0 16px rgba(0,230,118,.6);}
  .ctrl{width:38px;height:38px;border-radius:11px;background:rgba(8,14,28,.85);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(12px);transition:transform .15s;font-family:inherit;pointer-events:auto;}
  .ctrl:active{transform:scale(.92);}
  .ctrl.on{background:linear-gradient(135deg,#009270,#00e676);border-color:transparent;box-shadow:0 0 14px rgba(0,230,118,.5);color:#0a0e1a;}
  .cam-select-center{background:rgba(15,23,42,.92);border:1px solid rgba(0,230,118,.45);color:#00e676;font-size:12px;font-weight:800;padding:9px 16px;border-radius:12px;outline:none;cursor:pointer;font-family:inherit;backdrop-filter:blur(14px);box-shadow:0 4px 18px rgba(0,0,0,.5),0 0 20px rgba(0,230,118,.15);min-width:180px;transition:all .2s;}
  .cam-select-center:hover{border-color:#00e676;box-shadow:0 6px 22px rgba(0,0,0,.6),0 0 24px rgba(0,230,118,.35);}
  .cam-select-center option{background:#0b1329;color:#fff;font-weight:700;padding:6px;}
  .menu-btn{background:linear-gradient(135deg,rgba(0,146,112,.9),rgba(0,230,118,.9));border:none;color:#fff;padding:9px 16px;border-radius:12px;font-size:12px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(0,230,118,.45);transition:all .2s;font-family:inherit;pointer-events:auto;z-index:10000;position:relative;}
  .menu-btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(0,230,118,.65);}
  .menu-btn.on{background:linear-gradient(135deg,#ef4444,#f43f5e);box-shadow:0 4px 18px rgba(239,68,68,.5);}
  .menu-btn .hamburger{font-size:16px;line-height:1;}
  #menuPanel{position:absolute;top:64px;right:14px;width:min(92vw,340px);background:linear-gradient(160deg,rgba(15,23,42,.98),rgba(3,8,16,.99));border:1px solid rgba(0,230,118,.35);border-radius:16px;padding:14px;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.85), 0 0 40px rgba(0,230,118,.15);z-index:100001;pointer-events:auto;opacity:0;transform:translateY(-12px) scale(.95);transition:all .25s cubic-bezier(.175,.885,.32,1.275);visibility:hidden;}
  #menuPanel.open{opacity:1;transform:translateY(0) scale(1);visibility:visible;}
  .menu-section{margin-bottom:14px;}
  .menu-section:last-child{margin-bottom:0;}
  .menu-title{font-size:9.5px;font-weight:900;letter-spacing:2px;color:#00e676;text-transform:uppercase;margin-bottom:8px;padding-left:2px;opacity:.9;}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .menu-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .menu-tile{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 8px;color:#e2e8f0;font-size:11.5px;font-weight:800;cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center;}
  .menu-tile:hover{background:rgba(0,230,118,.15);border-color:rgba(0,230,118,.55);color:#fff;transform:translateY(-1px);}
  .menu-tile:active{transform:scale(.97);}
  .menu-tile.on{background:linear-gradient(135deg,rgba(0,146,112,.35),rgba(0,230,118,.25));border-color:#00e676;color:#fff;box-shadow:0 0 14px rgba(0,230,118,.4);}
  .menu-tile .ico{font-size:16px;line-height:1;}
  .menu-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);margin:12px 0;}
  .menu-tile-cam{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;color:#e2e8f0;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;width:100%;outline:none;}
  .menu-tile-cam:hover{border-color:rgba(0,230,118,.5);}
  .menu-tile-cam option{background:#0b1329;color:#fff;font-weight:700;}
  .bottom-wrap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:min(92vw,720px);display:flex;flex-direction:column;gap:8px;pointer-events:auto;z-index:10000;}
  .over-summary{background:rgba(8,18,32,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;color:#cbd5e1;}
  .over-dots{display:flex;gap:6px;align-items:center;}
  .badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;background:rgba(255,255,255,.08);color:#94a3b8;border:1px solid rgba(255,255,255,.15);}
  .badge.dot{background:rgba(148,163,184,.2);color:#94a3b8;}
  .badge.run{background:rgba(2,132,199,.3);color:#38bdf8;border-color:#38bdf8;}
  .badge.four{background:rgba(34,211,238,.35);color:#22d3ee;border-color:#22d3ee;}
  .badge.six{background:rgba(251,191,36,.35);color:#fbbf24;border-color:#fbbf24;}
  .badge.wkt{background:rgba(239,68,68,.5);color:#fff;border-color:#ef4444;}
  .badge.nb{background:rgba(232,121,249,.4);color:#e879f9;border-color:#e879f9;}
  .badge.bye{background:rgba(16,185,129,.3);color:#34d399;border-color:#10b981;}
  .bottom-bar{background:linear-gradient(90deg,rgba(8,18,32,.95),rgba(3,8,16,.98));border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 20px;display:flex;align-items:center;gap:20px;backdrop-filter:blur(18px);color:#fff;box-shadow:0 14px 40px rgba(0,0,0,.85);font-size:12px;font-weight:800;}
  .bb-team{display:flex;align-items:center;gap:10px;border-right:1px solid rgba(255,255,255,.12);padding-right:16px;}
  .bb-badge{background:#00e676;color:#0a0e1a;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:900;}
  .bb-score{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;}
  .bb-ov{font-size:11px;color:#94a3b8;font-weight:700;}
  .bb-bats{display:flex;flex-direction:column;gap:2px;flex:1;}
  .bb-row{display:flex;justify-content:space-between;font-weight:700;}
  .bb-row.striker{color:#00e676;}
  .bb-bowl{text-align:right;color:#22d3ee;border-left:1px solid rgba(255,255,255,.12);padding-left:16px;font-weight:700;}
  .banner{position:absolute;top:22%;left:50%;transform:translateX(-50%) scale(.6);font-size:clamp(38px,7vw,78px);font-weight:900;font-style:italic;text-transform:uppercase;color:#fff;opacity:0;transition:all .35s cubic-bezier(.175,.885,.32,1.275);pointer-events:none;text-align:center;line-height:1;}
  .banner.on{transform:translateX(-50%) scale(1);opacity:1;}
  .banner.four{color:#22d3ee;text-shadow:0 0 45px #0891b2,0 8px 24px #000;}
  .banner.six{color:#ff6d00;text-shadow:0 0 45px #fbbf24,0 8px 24px #000;}
  .banner.wkt{color:#ef4444;text-shadow:0 0 45px #7f1d1d,0 8px 24px #000;}
  .banner.run{color:#00e676;text-shadow:0 0 45px #009270,0 8px 24px #000;}
  .speed-tag{position:absolute;top:80px;right:14px;background:rgba(15,23,42,.9);border:1px solid rgba(34,211,238,.4);padding:6px 14px;border-radius:8px;color:#38bdf8;font-family:monospace;font-size:14px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9999;}
  .speed-tag.on{opacity:1;}
  #wagonWheelCanvas{position:absolute;top:80px;left:14px;width:150px;height:150px;background:rgba(8,15,30,0.88);border:1px solid rgba(255,255,255,0.2);border-radius:50%;pointer-events:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.7);z-index:10001;}
  @media(max-width:700px){
    .cam-select-center{min-width:120px;padding:8px 10px;font-size:11px;}
    .menu-btn{padding:8px 12px;font-size:11px;}
    #menuPanel{width:min(94vw,320px);}
    .bottom-bar{padding:8px 12px;gap:10px;font-size:11px;}
    .bb-score{font-size:18px;}
    .live{padding:5px 10px;font-size:10px;}
  }
</style>
</head>
<body>

<div class="hud">
  <div class="top-row">
    <div class="top-left-stack">
      <div class="cluster"><div class="live">VR LIVE</div></div>
      <div class="cluster" style="gap:6px;">
        <div class="ctrl on" id="util-snd" onclick="toggleAudio()" title="Sound"><span id="snd-ico">🔊</span></div>
        <div class="ctrl" onclick="triggerReplay()" title="Replay">↻</div>
        <div class="ctrl" onclick="toggleFullscreen()" title="Fullscreen">⛶</div>
      </div>
    </div>
    <div class="top-center">
      <select class="cam-select-center" id="camSel" onchange="setCamera(this.value)">
        <option value="broadcast">📺 TV Broadcast</option>
        <option value="bowler">🎯 Bowler View</option>
        <option value="keeper">🧤 Keeper View</option>
        <option value="slip">👐 Slip Cord</option>
        <option value="side">🎬 Square Side</option>
        <option value="drone">🚁 Drone</option>
        <option value="helmet">⛑️ Helmet Cam</option>
        <option value="follow">⚾ Ball Follow</option>
      </select>
    </div>
    <div class="top-right">
      <button class="btn on" id="btn-dir" onclick="toggleDirector()">🎬 Director</button>
      <button class="menu-btn" id="btn-menu" onclick="toggleMenu(event)"><span class="hamburger">☰</span> MENU</button>
    </div>
  </div>

  <div id="menuPanel">
    <div class="menu-section">
      <div class="menu-title">Navigate</div>
      <div class="menu-grid">
        <button class="menu-tile on" data-pane="pitch" onclick="navTo('pitch')"><span class="ico">🏏</span> 3D Pitch</button>
        <button class="menu-tile" data-pane="scorecard" onclick="navTo('scorecard')"><span class="ico">🃏</span> Card</button>
        <button class="menu-tile" data-pane="analytics" onclick="navTo('analytics')"><span class="ico">📊</span> Analysis</button>
        <button class="menu-tile" data-pane="leaderboards" onclick="navTo('leaderboards')"><span class="ico">📈</span> Stats</button>
      </div>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <div class="menu-title">Environment</div>
      <div class="menu-grid-3">
        <button class="menu-tile on" id="env-day" onclick="setSky('day')"><span class="ico">☀️</span> Day</button>
        <button class="menu-tile" id="env-sunset" onclick="setSky('sunset')"><span class="ico">🌇</span> Sunset</button>
        <button class="menu-tile" id="env-night" onclick="setSky('night')"><span class="ico">🌙</span> Night</button>
      </div>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <div class="menu-title">Camera</div>
      <select class="menu-tile-cam" id="camSelMenu" onchange="setCamera(this.value)">
        <option value="broadcast">📺 TV Broadcast</option>
        <option value="bowler">🎯 Bowler View</option>
        <option value="keeper">🧤 Keeper View</option>
        <option value="slip">👐 Slip Cord</option>
        <option value="side">🎬 Square Side</option>
        <option value="drone">🚁 Drone</option>
        <option value="helmet">⛑️ Helmet Cam</option>
        <option value="follow">⚾ Ball Follow</option>
      </select>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section" style="margin-bottom:0;">
      <div class="menu-title">Utilities</div>
      <div class="menu-grid-3">
        <button class="menu-tile" id="util-wagon" onclick="toggleWagonWheel()"><span class="ico">🕸️</span> Wagon</button>
        <button class="menu-tile" onclick="simFeedScoringTab()"><span class="ico">⚡</span> Feed</button>
        <button class="menu-tile" onclick="toggleMenu(event)"><span class="ico">✕</span> Close</button>
      </div>
    </div>
  </div>

  <div class="speed-tag" id="speedTag">SPEED: -- KM/H</div>
  <canvas id="wagonWheelCanvas" width="300" height="300"></canvas>
  <div class="banner" id="banner">FOUR!</div>

  <div class="bottom-wrap">
    <div class="over-summary">
      <span>THIS OVER:</span>
      <div class="over-dots" id="overDotsContainer"></div>
      <span id="overTotalRuns">0 RUNS</span>
    </div>
    <div class="bottom-bar">
      <div class="bb-team">
        <span class="bb-badge" id="bbAbbr">T1</span>
        <span class="bb-score" id="bbScore">0/0</span>
        <span class="bb-ov" id="bbOvers">(0.0)</span>
      </div>
      <div class="bb-bats">
        <div class="bb-row striker"><span id="bbStriker">Striker*</span><b id="bbStrikerRuns">0(0)</b></div>
        <div class="bb-row"><span id="bbNonStriker">Non-Striker</span><b id="bbNonStrikerRuns">0(0)</b></div>
      </div>
      <div class="bb-bowl">
        <div id="bbBowler">Bowler</div>
        <div id="bbBowlerFigs" style="color:#fff">0.0-0-0-0</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="stadium.js"></script> 
<script src="cricket-data.js"></script>
<script src="shot-library.js"></script>
<script src="fielding-ai.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   1. THREE.JS SCENE
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020713);
scene.fog = new THREE.FogExp2(0x050d24, 0.0055);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 800);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.domElement.style.zIndex = '0';
document.body.appendChild(renderer.domElement);

/* ============================================================
   2. STADIUM MODULE
   ============================================================ */
const stadium = window.CricMaxStadium ? window.CricMaxStadium.build(scene) : null;
const woodTex = window.CricMaxStadium ? window.CricMaxStadium.makeWoodTexture() : null;

/* ============================================================
   3. UI: MENU
   ============================================================ */
let menuOpen = false;
function toggleMenu(e){
  if (e && e.stopPropagation) e.stopPropagation();
  menuOpen = !menuOpen;
  const panel = document.getElementById('menuPanel');
  const btn = document.getElementById('btn-menu');
  if (panel) panel.classList.toggle('open', menuOpen);
  if (btn) btn.classList.toggle('on', menuOpen);
}
document.addEventListener('click', function(e){
  if (!menuOpen) return;
  const panel = document.getElementById('menuPanel');
  const btn = document.getElementById('btn-menu');
  if (panel && panel.contains(e.target)) return;
  if (btn && btn.contains(e.target)) return;
  menuOpen = false;
  if (panel) panel.classList.remove('open');
  if (btn) btn.classList.remove('on');
}, true);

/* ============================================================
   4. UI: SKY
   ============================================================ */
function setSky(mode){
  ['day','sunset','night'].forEach(m => {
    const b = document.getElementById('env-' + m);
    if (b) b.classList.toggle('on', m === mode);
  });
  if (stadium && stadium.setSky) stadium.setSky(mode);
}
setSky('day');

/* ============================================================
   5. NAV
   ============================================================ */
function navTo(pane){
  document.querySelectorAll('.menu-tile[data-pane]').forEach(t => {
    t.classList.toggle('on', t.getAttribute('data-pane') === pane);
  });
  if (pane === 'pitch'){ toggleMenu(); return; }
  try { window.parent.postMessage({ type: 'CM_NAV_TO', pane: pane }, '*'); } catch(e){}
  toggleMenu();
}

/* ============================================================
   6. PLAYER MODEL
   ============================================================ */
const SKIN = [0xd4a373, 0xc68642, 0xe0ac69, 0x8d5524, 0xf1c27d];
const PAD  = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
const SHOE = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 });
const HELM = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });
const GLOVE= new THREE.MeshStandardMaterial({ color: 0x1e40af, roughness: 0.5 });

function makePlayer(opts){
  opts = opts || {};
  const jersey = opts.jersey || 0x0284c7;
  const isBat = !!opts.batsman;
  const isKeeper = !!opts.keeper;
  const skin = SKIN[(opts.skinIndex || 0) % SKIN.length];

  const rig = new THREE.Group();
  rig.jerseyMat = new THREE.MeshStandardMaterial({ color: jersey, roughness: 0.55 });
  rig.skinMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.55 });
  rig.idlePhase = Math.random() * Math.PI * 2;
  rig.fidget = 1.4 + Math.random() * 1.2;

  const shadowCv = document.createElement('canvas');
  shadowCv.width = shadowCv.height = 64;
  const sctx = shadowCv.getContext('2d');
  const sgrad = sctx.createRadialGradient(32, 32, 3, 32, 32, 32);
  sgrad.addColorStop(0, 'rgba(0,0,0,.68)');
  sgrad.addColorStop(0.5, 'rgba(0,0,0,.3)');
  sgrad.addColorStop(1, 'rgba(0,0,0,0)');
  sctx.fillStyle = sgrad; sctx.fillRect(0, 0, 64, 64);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.8), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCv), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.028;
  rig.add(shadow);

  function buildLeg(xOff){
    const leg = new THREE.Group();
    leg.position.set(xOff, 0.82, 0);
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.092, 0.078, 0.38, 8), rig.jerseyMat);
    thigh.position.y = -0.19; thigh.castShadow = true; leg.add(thigh);
    const knee = new THREE.Mesh(new THREE.SphereGeometry(0.082, 10, 10), isBat ? PAD : rig.jerseyMat);
    knee.position.y = -0.38; leg.add(knee);
    const shin = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.40, 0.16), isBat ? PAD : rig.jerseyMat);
    shin.position.set(0, -0.58, 0.02); shin.castShadow = true; leg.add(shin);
    if (isBat){
      for (let s = 0; s < 3; s++){
        const strap = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.03, 0.17), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        strap.position.set(0, -0.48 - s * 0.13, 0.02); leg.add(strap);
      }
    }
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.25), SHOE);
    foot.position.set(0, -0.78, 0.04); foot.castShadow = true; leg.add(foot);
    leg.userData = { thigh, shin };
    return leg;
  }
  rig.legL = buildLeg(-0.13); rig.legR = buildLeg(0.13);
  rig.add(rig.legL); rig.add(rig.legR);

  const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.18, 0.22), PAD);
  pelvis.position.y = 0.91; pelvis.castShadow = true; rig.add(pelvis);

  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.18, 0.54, 12), rig.jerseyMat);
  torso.position.y = 1.25; torso.castShadow = true;
  rig.add(torso); rig.torso = torso;

  if (opts.number){
    const numCv = document.createElement('canvas');
    numCv.width = numCv.height = 128;
    const nctx = numCv.getContext('2d');
    nctx.clearRect(0, 0, 128, 128);
    nctx.fillStyle = '#ffffff';
    nctx.font = 'bold 96px -apple-system,sans-serif';
    nctx.textAlign = 'center'; nctx.textBaseline = 'middle';
    nctx.fillText(String(opts.number), 64, 64);
    const numMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.18), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(numCv), transparent: true }));
    numMesh.position.set(0, 1.3, -0.235);
    numMesh.rotation.y = Math.PI;
    rig.add(numMesh);
  }

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), rig.skinMat);
  head.position.y = 1.68; head.castShadow = true;

  }

  function buildArm(xOff){
    const arm = new THREE.Group();
    arm.position.set(xOff, 1.42, 0);
    const bicep = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.32, 8), rig.jerseyMat);

      glove.position.y = -0.62; arm.add(glove);
    }
    return arm;
  }
  rig.armL = buildArm(-0.28); rig.armR = buildArm(0.28);
  rig.add(rig.armL); rig.add(rig.armR);

  if (isBat){
    const batPivot = new THREE.Group();
    batPivot.position.set(0, 1.05, 0.25);

class Fielder {
  constructor(name, x, z, skinIdx){
    this.name = name;
    this.home = new THREE.Vector3(x, 0, z);
    this.target = this.home.clone();
    this.state = 'idle';
    this.rig = makePlayer({ jersey: 0xdc2626, skinIndex: skinIdx });
    this.rig.position.copy(this.home);
    scene.add(this.rig);
  }
  reset(){ this.state = 'returning'; this.target.copy(this.home); }
  chase(p){ this.state = 'chasing'; this.target.copy(p); }
  update(dt, t){
    if (this.state === 'idle'){
      const sway = Math.sin(t * this.rig.fidget + this.rig.idlePhase);
      this.rig.torso.rotation.y = sway * 0.08;
      this.rig.armL.rotation.x = -0.2 + sway * 0.06;
      this.rig.armR.rotation.x = -0.2 - sway * 0.06;
      return;
    }
    const dist = this.rig.position.distanceTo(this.target);
    if (dist > 0.3){
      const dir = new THREE.Vector3().subVectors(this.target, this.rig.position).normalize();
      this.rig.position.addScaledVector(dir, 14 * dt);
      this.rig.lookAt(this.target.x, this.rig.position.y, this.target.z);
      const cycle = Math.sin(t * 18);
      this.rig.legL.userData.thigh.rotation.x = cycle * 0.6;
      this.rig.legR.userData.thigh.rotation.x = -cycle * 0.6;
      this.rig.armL.rotation.x = -cycle * 0.7;
      this.rig.armR.rotation.x = cycle * 0.7;
    } else if (this.state === 'returning'){
      this.state = 'idle';
      this.rig.rotation.y = Math.atan2(this.home.x, this.home.z); // Face pitch
    }
  }
}

class Wicket {
  constructor(zPos){
    this.group = new THREE.Group();
    this.stumps = []; this.bails = []; this.flying = false;
    const mat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.4 });
    [-0.11, 0, 0.11].forEach(x => {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.76, 12), mat);
      s.position.set(x, 0.38, 0); s.castShadow = true;
      this.group.add(s);
      this.stumps.push({ mesh: s, base: s.position.clone(), vel: new THREE.Vector3(), rot: new THREE.Vector3() });
    });
    [-0.055, 0.055].forEach(x => {
      const b = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.13, 8), mat);
      b.rotation.z = Math.PI / 2; b.position.set(x, 0.77, 0);
      this.group.add(b);
      this.bails.push({ mesh: b, base: b.position.clone(), vel: new THREE.Vector3(), rot: new THREE.Vector3() });
    });
    this.group.position.set(0, 0, zPos);
    scene.add(this.group);
  }
  shatter(){
    this.flying = true;
    this.stumps.forEach((s, i) => {
      s.vel.set((i - 1) * 2.4 + (Math.random() - 0.5) * 1.5, 4.5 + Math.random() * 2.5, 4 + Math.random() * 3);
      s.rot.set(Math.random() * 8, Math.random() * 6, Math.random() * 8);
    });
  }
  update(dt){
    if (!this.flying) return;
    [...this.stumps].forEach(item => {
      item.vel.y -= 9.8 * dt * 1.5;
      item.mesh.position.addScaledVector(item.vel, dt);
      item.mesh.rotation.x += item.rot.x * dt;
      if (item.mesh.position.y < 0.05) { item.mesh.position.y = 0.05; item.vel.y *= -0.35; }
    });
  }
  reset(){
    this.flying = false;
    this.stumps.forEach(s => { s.mesh.position.copy(s.base); s.mesh.rotation.set(0,0,0); s.vel.set(0,0,0); });
    this.bails.forEach(b => { b.mesh.position.copy(b.base); b.mesh.rotation.set(0,0,Math.PI/2); b.vel.set(0,0,0); });
  }
}

let actx = null, audioOn = true;
function initAudio(){
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function playBatCrack(power){
  if (!audioOn || !actx) return;
  const buf = actx.createBuffer(1, actx.sampleRate * 0.05, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = buf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.8 * power, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.05);
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  src.start();
}

/* ============================================================
   10. GLOBAL RUNNING STATE 
   ============================================================ */
const RunningState = {
  active: false,
  targetRuns: 0,
  currentRun: 0,
  progress: 0,
  speed: 0.38,
  update: function(dt){
    if (!this.active) return;
    
    this.progress += dt * this.speed;
    
    if (this.progress >= 1.0) {
      this.progress = 0;
      this.currentRun++;
      if (this.currentRun >= this.targetRuns) {
        this.active = false;
        strikerBat.rotation.set(0, -Math.PI / 2, 0);
        nonStrikerBat.rotation.set(0, Math.PI / 2, 0);
        [strikerBat, nonStrikerBat].forEach(bat => {
          bat.legL.userData.thigh.rotation.x = 0;
          bat.legR.userData.thigh.rotation.x = 0;
          bat.armL.rotation.x = 0;
          bat.armR.rotation.x = 0;
        });
        return;
      }
    }

    const fraction = this.progress;
    const isEven = (this.currentRun % 2 === 0);
    
    const sZ_start = isEven ? 8.8 : -8.8;
    const sZ_end   = isEven ? -8.8 : 8.8;
    const nZ_start = isEven ? -8.8 : 8.8;
    const nZ_end   = isEven ? 8.8 : -8.8;

    strikerBat.position.z = THREE.MathUtils.lerp(sZ_start, sZ_end, fraction);
    nonStrikerBat.position.z = THREE.MathUtils.lerp(nZ_start, nZ_end, fraction);

    strikerBat.rotation.y = isEven ? Math.PI : 0;
    nonStrikerBat.rotation.y = isEven ? 0 : Math.PI;

    const cycle = Math.sin(this.progress * Math.PI * 12);
    [strikerBat, nonStrikerBat].forEach(bat => {
      bat.legL.userData.thigh.rotation.x = cycle * 0.8;
      bat.legR.userData.thigh.rotation.x = -cycle * 0.8;
      bat.armL.rotation.x = -cycle * 0.8;
      bat.armR.rotation.x = cycle * 0.8;
    });
  }
};

const wagonCanvas = document.getElementById('wagonWheelCanvas');

function toggleWagonWheel(){
  const on = wagonCanvas.style.display === 'block';
  wagonCanvas.style.display = on ? 'none' : 'block';
  document.getElementById('util-wagon').classList.toggle('on', !on);
  if (!on) drawWagonWheel();
}
function drawWagonWheel(){
  const w = wagonCanvas.width, h = wagonCanvas.height;
  const cx = w/2, cy = h/2, radius = w/2 - 12;
  wagonCtx.clearRect(0, 0, w, h);
  wagonCtx.beginPath(); wagonCtx.arc(cx, cy, radius, 0, Math.PI*2);
  wagonCtx.fillStyle = '#061324'; wagonCtx.fill();
  wagonCtx.strokeStyle = 'rgba(255,255,255,.25)'; wagonCtx.stroke();
  wagonCtx.fillStyle = '#987349'; wagonCtx.fillRect(cx - 3, cy - 14, 6, 28);
  
  historicalShots.forEach(s => {
    const endX = cx + Math.sin(s.angle) * (s.dist / 70 * radius);
    const endY = cy - Math.cos(s.angle) * (s.dist / 70 * radius);
    wagonCtx.beginPath(); wagonCtx.moveTo(cx, cy); wagonCtx.lineTo(endX, endY);
    wagonCtx.strokeStyle = s.runs >= 4 ? '#22d3ee' : '#10b981';
    wagonCtx.lineWidth = s.runs >= 4 ? 2.5 : 1.2; wagonCtx.stroke();
  });
}

/* ============================================================
   13. DELIVERY ENGINE (INTEGRATED AI & ANIMATIONS)
   ============================================================ */
let anim = null;
let lastShot = null;

function playBall(shot){
  if (anim) cancelAnimationFrame(anim);
  initAudio();
  lastShot = shot;

  // Reset Scene
  strikerWicket.reset(); bowlerWicket.reset();
  fielders.forEach(f => f.reset());
  ball.visible = true;
  
  RunningState.active = false;
  strikerBat.position.set(0.35, 0, 8.8);
  strikerBat.rotation.set(0, -Math.PI / 2, 0); 
  nonStrikerBat.position.set(-1.2, 0, -8.8);
  nonStrikerBat.rotation.set(0, Math.PI / 2, 0); 

  const runs = shot.runs || 0;
  const isSix = runs === 6;
  const isFour = runs === 4;
  
  // Use CricMaxData Logic
  const bowlerType = shot.bowlerType || 'fast_pace';
  const deliveryType = window.CricMaxData && window.CricMaxData.pickDelivery ? window.CricMaxData.pickDelivery(bowlerType) : 'length_ball';
  const deliveryData = window.CricMaxData && window.CricMaxData.DELIVERY_TYPES ? window.CricMaxData.DELIVERY_TYPES[deliveryType] : { bouncePoint: 6 };
  const pickedShot = window.CricMaxData && window.CricMaxData.pickShot ? window.CricMaxData.pickShot(runs, bowlerType, deliveryType, 'hard') : { shotType: 'defend', angle: 1.5, distance: 10, flightTime: 2.5, peakHeight: 2 };
  const animPose = window.CricMaxShots && window.CricMaxShots.get ? window.CricMaxShots.get(pickedShot.shotType) : { prepTime: 200, contactTime: 500, followTime: 400, pose: { batStart: {rotX: -1}, batContact: {rotX: -0.5}, batEnd: {rotX: 0}, torsoRotY: 0, legStride: 0 }};

  // Trajectory Map
  const pitchZ = (deliveryData.bouncePoint || 6) - 12; 
  const pitchX = (Math.random() - 0.5) * 0.5;

  const shotRotY = pickedShot.angle - 1.57; 
  const hitX = -Math.sin(shotRotY) * pickedShot.distance;
  const hitZ = 8.8 - Math.cos(shotRotY) * pickedShot.distance;

  if (runs > 0 && runs < 4) {
    RunningState.targetRuns = runs;
    RunningState.currentRun = 0;
    RunningState.progress = 0;
    RunningState.active = true;
  }

  const targetPoint = new THREE.Vector3(hitX, 0, hitZ);
  if (runs > 0 && !isFour && !isSix){
    let closest = fielders[0], minDist = 999;
    fielders.forEach(f => {
      const d = f.home.distanceTo(targetPoint);
      if(d < minDist) { minDist = d; closest = f; }
    });
    if(closest) closest.chase(targetPoint);
  }

  historicalShots.push({ angle: pickedShot.angle, dist: pickedShot.distance, runs: runs });
  drawWagonWheel();

  const start = performance.now();
  const TIME_RELEASE = 700;
  const TIME_PITCH = TIME_RELEASE + 300;
  const TIME_CONTACT = TIME_PITCH + 250; 
  const flightTime = (pickedShot.flightTime || 2.5) * 1000;
  const TIME_LAND = TIME_CONTACT + flightTime;

  function loop(now){
    const elapsed = now - start;

    if (elapsed < TIME_RELEASE){
      const t = elapsed / TIME_RELEASE;
      bowler.position.z = THREE.MathUtils.lerp(-22, -9.8, t);
      bowler.armR.rotation.x = -Math.PI * 4 * t;
      ball.position.set(bowler.position.x + 0.3, 2.0, bowler.position.z);
    } 
    else if (elapsed < TIME_PITCH){
      const t = (elapsed - TIME_RELEASE) / (TIME_PITCH - TIME_RELEASE);
      ball.position.x = THREE.MathUtils.lerp(0.55, pitchX, t);
      ball.position.z = THREE.MathUtils.lerp(-9.8, pitchZ, t);
      ball.position.y = THREE.MathUtils.lerp(2.0, 0.04, t * t);
    } 
    else if (elapsed < TIME_CONTACT){
      const t = (elapsed - TIME_PITCH) / (TIME_CONTACT - TIME_PITCH);
      ball.position.x = THREE.MathUtils.lerp(pitchX, strikerBat.position.x - 0.1, t);
      ball.position.z = THREE.MathUtils.lerp(pitchZ, 8.8, t);
      ball.position.y = 0.04 + Math.sin(t * Math.PI * 0.5) * 0.9;
    } 
    else if (elapsed < TIME_LAND){
      if(elapsed - TIME_CONTACT < 20) { playBatCrack(isSix ? 1 : 0.6); }

      const t = (elapsed - TIME_CONTACT) / flightTime;
      ball.position.x = THREE.MathUtils.lerp(strikerBat.position.x, hitX, t);
      ball.position.z = THREE.MathUtils.lerp(8.8, hitZ, t);
      ball.position.y = 0.05 + 4 * (pickedShot.peakHeight || 2) * t * (1 - t);
      
      if(directorOn && (isSix || isFour)) {
        camPos.lerp(new THREE.Vector3(ball.position.x*0.5, 12, ball.position.z-15), 0.05);
        camTarget.lerp(ball.position, 0.08);
      }
    } else {
      anim = null;
      ball.visible = false;
      return;
    }

    // Shot Animation
    if (animPose && animPose.pose) {
      const prepStart = TIME_CONTACT - animPose.prepTime;
      const followEnd = TIME_CONTACT + animPose.followTime;
      
      if (elapsed > prepStart && elapsed <= TIME_CONTACT) {
        const t = (elapsed - prepStart) / animPose.prepTime;
        strikerBat.batPivot.rotation.x = THREE.MathUtils.lerp(animPose.pose.batStart.rotX, animPose.pose.batContact.rotX, t);
        strikerBat.torso.rotation.y = THREE.MathUtils.lerp(0, animPose.pose.torsoRotY, t);
        strikerBat.legL.userData.thigh.rotation.x = THREE.MathUtils.lerp(0, animPose.pose.legStride, t);
      } else if (elapsed > TIME_CONTACT && elapsed <= followEnd) {
        const t = (elapsed - TIME_CONTACT) / animPose.followTime;
        strikerBat.batPivot.rotation.x = THREE.MathUtils.lerp(animPose.pose.batContact.rotX, animPose.pose.batEnd.rotX, t);
        strikerBat.torso.rotation.y = THREE.MathUtils.lerp(animPose.pose.torsoRotY, 0, t);
      }
    }

    anim = requestAnimationFrame(loop);
  }
  anim = requestAnimationFrame(loop);

  setTimeout(() => {
    const b = document.getElementById('banner');
    b.className = 'banner run on';
    b.innerText = isSix ? 'MAXIMUM!' : isFour ? 'FOUR!' : runs + ' RUNS';
    if(isSix) b.classList.add('six'); else if(isFour) b.classList.add('four');
    setTimeout(() => b.classList.remove('on'), 2400);
  }, 1300);
}

function renderOverDots(ballTags){
  const container = document.getElementById('overDotsContainer');
  const totalEl = document.getElementById('overTotalRuns');
  if (!container) return;
  container.innerHTML = '';
  let overRuns = 0;
  const tags = Array.isArray(ballTags) ? ballTags : [];
  for (let i = 0; i < 6; i++){
    const tag = tags[i] !== undefined ? String(tags[i]) : null;
    const dot = document.createElement('div');
    if (tag !== null && tag !== ''){
      const isWicket = tag.indexOf('W') >= 0;
      const isFour = tag === '4', isSix = tag === '6';
      if (isWicket){ dot.className = 'badge wkt'; dot.innerText = 'W'; }
      else if (isFour){ dot.className = 'badge four'; dot.innerText = '4'; overRuns += 4; }
      else if (isSix){ dot.className = 'badge six'; dot.innerText = '6'; overRuns += 6; }
      else { 
        const n = parseInt(tag) || 0; 
        dot.className = n === 0 ? 'badge dot' : 'badge run'; 
        dot.innerText = String(n); overRuns += n; 
      }
    } else {
      dot.className = 'badge dot'; dot.innerText = '·';
    }
    container.appendChild(dot);
  }
  if (totalEl) totalEl.innerText = overRuns + ' RUNS';
}

  document.getElementById('bbAbbr').innerText = m.teamBattingAbbr || 'T1';

}

});

/* ============================================================
   15. MAIN RENDER LOOP
   ============================================================ */
let lastT = 0;
function animate(t){
  requestAnimationFrame(animate);
  const dt = Math.min((t - lastT) / 1000, 0.1);
  const elapsed = t * 0.001;
  lastT = t;

  if (stadium && stadium.update) stadium.update(dt, elapsed);
  fielders.forEach(f => f.update(dt, elapsed));
  RunningState.update(dt);

  if (!anim && !RunningState.active){
    strikerBat.batPivot.rotation.x = -Math.PI / 4 + Math.max(0, Math.sin(elapsed * 4)) * 0.15;
    bowler.position.z = -22 + Math.sin(elapsed * 1.2) * 0.25;
    if (directorOn){ camPos.lerp(CAM_MODES.broadcast.pos, 0.03); camTarget.lerp(CAM_MODES.broadcast.target, 0.03); }
  }

  if (!directorOn && activeCam !== 'follow'){
    camPos.lerp(CAM_MODES[activeCam].pos, 0.05);
    camTarget.lerp(CAM_MODES[activeCam].target, 0.05);
  }
  
  camera.position.copy(camPos);
  camera.lookAt(camTarget);
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// Exports
window.toggleMenu = toggleMenu; window.setSky = setSky; window.navTo = navTo; window.setCamera = setCamera;
window.toggleDirector = toggleDirector; window.toggleWagonWheel = toggleWagonWheel;
window.simFeedScoringTab = simFeedScoringTab; window.triggerReplay = triggerReplay;
})();
