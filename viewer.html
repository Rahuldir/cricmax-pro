<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CricMax Pro 3D - Ultimate Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #01040a; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* Broadcast Toolbar Layer */
    .hud-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 18px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; flex-wrap: wrap; }

    .live-badge { background: #ef4444; color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 1.5px; padding: 6px 14px; border-radius: 20px; display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 0 16px rgba(239,68,68,.75); pointer-events: auto; }
    .live-badge::before { content:''; width: 8px; height: 8px; background: #fff; border-radius: 50%; display: inline-block; animation: pulse 1s infinite alternate; }
    @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.1); } }

    .bar-cluster { display: flex; gap: 5px; background: rgba(8,14,28,.85); padding: 5px; border-radius: 14px; backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); pointer-events: auto; overflow-x: auto; max-width: 100%; }
    .hud-btn { background: transparent; border: 1px solid rgba(255,255,255,.12); color: #cbd5e1; padding: 6px 10px; border-radius: 8px; font-size: 10.5px; font-weight: 800; cursor: pointer; transition: all .2s; font-family: inherit; white-space: nowrap; }
    .hud-btn:hover { background: rgba(0,230,118,.18); color: #fff; border-color: rgba(0,230,118,.4); }
    .hud-btn.active { background: linear-gradient(135deg,#009270,#00e676); color: #0a0e1a; border-color: transparent; box-shadow: 0 0 16px rgba(0,230,118,.6); font-weight: 900; }

    .ctrl-cluster { display: flex; gap: 6px; pointer-events: auto; }
    .ctrl-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(8,14,28,.82); border: 1px solid rgba(255,255,255,.18); color: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(12px); transition: transform .15s; font-family: inherit; }
    .ctrl-btn:active { transform: scale(0.92); }

    /* Speed Radar & Overlays */
    .radar-tag { position: absolute; top: 72px; right: 18px; background: rgba(15,23,42,0.9); border: 1px solid rgba(34,211,238,0.4); padding: 6px 14px; border-radius: 8px; color: #38bdf8; font-family: monospace; font-size: 14px; font-weight: 800; pointer-events: none; opacity: 0; transition: opacity .3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .radar-tag.active { opacity: 1; }

    #wagonWheelCanvas { position: absolute; top: 72px; left: 18px; width: 140px; height: 140px; background: rgba(8,15,30,0.88); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.7); }

    /* DRS Snickometer Modal Overlay (Section 2) */
    #drsModal { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); width: 300px; height: 180px; background: rgba(7,14,26,0.94); border: 2px solid #ef4444; border-radius: 12px; backdrop-filter: blur(12px); display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px; box-shadow: 0 0 30px rgba(239,68,68,0.4); pointer-events: auto; }
    .drs-title { font-size: 12px; font-weight: 900; letter-spacing: 1.5px; color: #ef4444; text-transform: uppercase; }
    #snickoCanvas { width: 100%; height: 110px; background: #030814; border-radius: 6px; }

    /* Interactive Gameplay Controls (Section 6) */
    #gameControls { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: auto; }
    .timing-meter-bg { width: 260px; height: 16px; background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; position: relative; overflow: hidden; }
    .timing-sweetspot { position: absolute; top: 0; bottom: 0; left: 42%; width: 16%; background: #00e676; box-shadow: 0 0 10px #00e676; }
    .timing-cursor { position: absolute; top: 0; bottom: 0; width: 6px; background: #fff; left: 0%; transform: translateX(-50%); box-shadow: 0 0 8px #fff; }
    .play-btn { background: linear-gradient(135deg,#0284c7,#38bdf8); color: #fff; border: none; font-weight: 900; padding: 8px 24px; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(2,132,199,0.5); font-size: 12px; letter-spacing: 1px; transition: transform 0.1s; }
    .play-btn:active { transform: scale(0.95); }

    /* Event Banner */
    .event-banner { position: absolute; top: 20%; left: 50%; transform: translateX(-50%) scale(.6); font-size: clamp(38px, 7vw, 76px); font-weight: 900; font-style: italic; text-transform: uppercase; color: #fff; opacity: 0; transition: all .35s cubic-bezier(.175,.885,.32,1.275); text-align: center; line-height: 1; pointer-events: none; }
    .event-banner.active { transform: translateX(-50%) scale(1); opacity: 1; }
    .event-banner.four { color: #22d3ee; text-shadow: 0 0 45px #0891b2, 0 8px 24px #000; }
    .event-banner.six { color: #ff6d00; text-shadow: 0 0 45px #fbbf24, 0 8px 24px #000; }
    .event-banner.wkt { color: #ef4444; text-shadow: 0 0 45px #7f1d1d, 0 8px 24px #000; }

    /* TV Broadcast Scorecard */
    .tv-scorecard { pointer-events: auto; background: linear-gradient(90deg, rgba(8,18,32,.96), rgba(3,8,16,.98)); border: 1px solid rgba(255,255,255,.16); border-radius: 14px; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(18px); color: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.85); max-width: 880px; margin: 0 auto; width: 100%; gap: 14px; }
    .tv-team { display: flex; align-items: center; gap: 10px; font-weight: 900; border-right: 1px solid rgba(255,255,255,.12); padding-right: 16px; }
    .tv-team-badge { background: #00e676; color: #0a0e1a; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 900; }
    .tv-score { font-size: 24px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
    .tv-overs { font-size: 12px; color: #94a3b8; font-weight: 700; margin-left: 2px; }
    .tv-batsmen { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .tv-bat-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
    .tv-bat-row.striker { color: #00e676; }
    .tv-bowler { font-size: 12px; font-weight: 700; text-align: right; color: #22d3ee; border-left: 1px solid rgba(255,255,255,.12); padding-left: 16px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-layer">
    <div class="top-bar">
      <div class="live-badge">ULTRA 3D LIVE</div>

      <!-- Section 5: Dynamic Camera Suite -->
      <div class="bar-cluster">
        <button class="hud-btn active" id="btn-broadcast" onclick="switchCamera('broadcast')">📺 TV</button>
        <button class="hud-btn" id="btn-bowler" onclick="switchCamera('bowler')">🎯 Bowler</button>
        <button class="hud-btn" id="btn-keeper" onclick="switchCamera('keeper')">🧤 Keeper/Slip</button>
        <button class="hud-btn" id="btn-side" onclick="switchCamera('side')">🎬 Side</button>
        <button class="hud-btn" id="btn-midwicket" onclick="switchCamera('midwicket')">🏏 Mid-Wicket</button>
        <button class="hud-btn" id="btn-drone" onclick="switchCamera('drone')">🚁 Drone</button>
        <button class="hud-btn" id="btn-follow" onclick="switchCamera('follow')">⚾ Ball Cam</button>
      </div>

      <!-- Section 3: Atmosphere / Time of Day Mode -->
      <div class="bar-cluster">
        <button class="hud-btn" id="env-day" onclick="setAtmosphere('day')">☀️ Day</button>
        <button class="hud-btn" id="env-sunset" onclick="setAtmosphere('sunset')">🌇 Sunset</button>
        <button class="hud-btn active" id="env-night" onclick="setAtmosphere('night')">🌙 Night</button>
      </div>

      <div class="ctrl-cluster">
        <button class="ctrl-btn" id="btnWagon" onclick="toggleWagonWheel()" title="Toggle Wagon Wheel">🕸️</button>
        <button class="ctrl-btn" id="btnDrs" onclick="testDRSAppeal()" title="Trigger DRS Snicko">🔬</button>
        <button class="ctrl-btn" id="btnMic" onclick="toggleAudio()" title="Live Sound FX">🔊</button>
        <button class="ctrl-btn" onclick="triggerReplay()" title="Replay Delivery">↻</button>
        <button class="ctrl-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
      </div>
    </div>

    <!-- Section 2: Radar & Visual Overlays -->
    <div id="speedRadar" class="radar-tag">SPEED: -- KM/H</div>
    <canvas id="wagonWheelCanvas" width="280" height="280"></canvas>

    <!-- Section 2: DRS Snickometer / UltraEdge Modal -->
    <div id="drsModal">
      <div class="drs-title">ULTRAEDGE™ SLOW-MO</div>
      <canvas id="snickoCanvas" width="280" height="110"></canvas>
      <div style="font-size:10px; color:#94a3b8; font-weight:700;">ACOUSTIC FREQUENCY VERIFIED</div>
    </div>

    <!-- Section 6: Interactive Batter Hit Controls -->
    <div id="gameControls">
      <div class="timing-meter-bg">
        <div class="timing-sweetspot"></div>
        <div class="timing-cursor" id="timingCursor"></div>
      </div>
      <button class="play-btn" onclick="userTriggerBatStroke()">HIT SHOT 🏏</button>
    </div>

    <div id="eventBanner" class="event-banner">FOUR!</div>

    <div class="tv-scorecard">
      <div class="tv-team">
        <span class="tv-team-badge" id="tvAbbr">IND</span>
        <span class="tv-score" id="tvScore">142/2</span>
        <span class="tv-overs" id="tvOvers">(15.4)</span>
      </div>
      <div class="tv-batsmen">
        <div class="tv-bat-row striker"><span id="tvStrikerName">Striker*</span><b id="tvStrikerRuns">54(32)</b></div>
        <div class="tv-bat-row"><span id="tvNonStrikerName">Non-Striker</span><b id="tvNonStrikerRuns">38(24)</b></div>
      </div>
      <div class="tv-bowler">
        <div id="tvBowlerName">Pace Bowler</div>
        <div id="tvBowlerFigs" style="color:#fff;font-variant-numeric:tabular-nums;">3.4-0-28-1</div>
      </div>
    </div>
  </div>

  <script>
    /* =======================================================
       1. SYNTHESIZED WEB AUDIO API
       ======================================================= */
    let audioCtx = null;
    let isAudioOn = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSoundPitchBounce() {
      if (!isAudioOn) return; initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(110, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    }

    function playSoundWillowBat(power = 1.0) {
      if (!isAudioOn) return; initAudio();
      const bufferSize = audioCtx.sampleRate * 0.05;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1600;

      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(0.8 * power, audioCtx.currentTime);
      nGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      noise.connect(filter); filter.connect(nGain); nGain.connect(audioCtx.destination);
      noise.start();

      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.14);
      oscGain.gain.setValueAtTime(0.7 * power, audioCtx.currentTime);
      oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
      osc.connect(oscGain); oscGain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.14);
    }

    function playSoundStumpsShatter() {
      if (!isAudioOn) return; initAudio();
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(600 + (i * 200), audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }, i * 35);
      }
    }

    function playSoundCrowdCheer(duration = 2.5) {
      if (!isAudioOn) return; initAudio();
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const crowd = audioCtx.createBufferSource();
      crowd.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 650;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 0.5);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      crowd.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      crowd.start();
    }

    /* =======================================================
       2. THREE.JS SCENE, SHADOWS & ATMOSPHERE (SECTION 3)
       ======================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020713);
    scene.fog = new THREE.FogExp2(0x050d24, 0.0055);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 800);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xd4e2ff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e6, 0);
    sunLight.position.set(40, 80, 40);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    scene.add(sunLight);

    const floodlights = [];
    const towerPositions = [
      { x: -55, z: -55 }, { x: 55, z: -55 },
      { x: -55, z: 55 },  { x: 55, z: 55 }
    ];

    towerPositions.forEach(pos => {
      const towerGroup = new THREE.Group();
      towerGroup.position.set(pos.x, 0, pos.z);
      const steelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.3 });
      for (let c = 0; c < 4; c++) {
        const ang = (c * Math.PI) / 2;
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 42, 6), steelMat);
        col.position.set(Math.cos(ang) * 1.6, 21, Math.sin(ang) * 1.6);
        towerGroup.add(col);
      }
      for (let b = 4; b <= 40; b += 4) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.08, 4, 4), steelMat);
        ring.rotation.x = Math.PI / 2; ring.position.y = b;
        towerGroup.add(ring);
      }
      const headMat = new THREE.MeshBasicMaterial({ color: 0xfffaea });
      const panel = new THREE.Mesh(new THREE.BoxGeometry(9, 4.5, 1.2), headMat);
      panel.position.set(0, 42, 0); panel.lookAt(0, 0, 0);
      towerGroup.add(panel);

      const spot = new THREE.SpotLight(0xfff6e0, 1.5, 190, Math.PI / 3.0, 0.38, 1.15);
      spot.position.set(pos.x, 42, pos.z);
      spot.target.position.set(0, 0, 0);
      spot.castShadow = true;
      spot.shadow.mapSize.set(1024, 1024);
      scene.add(spot); scene.add(spot.target);
      scene.add(towerGroup);
      floodlights.push(spot);
    });

    // Section 3: Atmospheric Modes (Day, Sunset, Night)
    window.setAtmosphere = function(mode) {
      document.querySelectorAll('#env-day, #env-sunset, #env-night').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('env-' + mode);
      if (activeBtn) activeBtn.classList.add('active');

      if (mode === 'day') {
        scene.background.set(0x87ceeb);
        scene.fog.color.set(0xbfe3f7);
        ambientLight.color.set(0xffffff);
        ambientLight.intensity = 0.9;
        sunLight.intensity = 1.6;
        floodlights.forEach(fl => fl.intensity = 0.0);
      } else if (mode === 'sunset') {
        scene.background.set(0xfd5e53);
        scene.fog.color.set(0x3e1d35);
        ambientLight.color.set(0xffa07a);
        ambientLight.intensity = 0.65;
        sunLight.intensity = 0.7;
        floodlights.forEach(fl => fl.intensity = 0.75);
      } else {
        scene.background.set(0x020713);
        scene.fog.color.set(0x050d24);
        ambientLight.color.set(0xd4e2ff);
        ambientLight.intensity = 0.45;
        sunLight.intensity = 0.0;
        floodlights.forEach(fl => fl.intensity = 1.5);
      }
    };

    /* =======================================================
       3. OUTFIELD, LED BOARDS & PITCH DEGRADATION (SECTION 5)
       ======================================================= */
    function createLawnTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1024;
      const ctx = cv.getContext('2d');
      for (let r = 512; r > 0; r -= 28) {
        ctx.beginPath();
        ctx.arc(512, 512, r, 0, Math.PI * 2);
        ctx.fillStyle = (r / 28) % 2 === 0 ? '#1b4d24' : '#23592c';
        ctx.fill();
      }
      return new THREE.CanvasTexture(cv);
    }

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(68, 64),
      new THREE.MeshStandardMaterial({ map: createLawnTexture(), roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const innerRing = new THREE.Mesh(
      new THREE.RingGeometry(27.4, 27.7, 64),
      new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.35, transparent: true, side: THREE.DoubleSide })
    );
    innerRing.rotation.x = -Math.PI / 2; innerRing.position.y = 0.02;
    scene.add(innerRing);

    const rope = new THREE.Mesh(new THREE.TorusGeometry(62, 0.35, 12, 96), new THREE.MeshStandardMaterial({ color: 0xf1f5f9 }));
    rope.rotation.x = -Math.PI / 2; rope.position.y = 0.3;
    scene.add(rope);

    // Animated LED Hoardings
    const ledCanvas = document.createElement('canvas');
    ledCanvas.width = 2048; ledCanvas.height = 128;
    const ledCtx = ledCanvas.getContext('2d');
    const ledTexture = new THREE.CanvasTexture(ledCanvas);
    ledTexture.wrapS = THREE.RepeatWrapping;
    ledTexture.repeat.set(12, 1);

    const ledRibbon = new THREE.Mesh(
      new THREE.CylinderGeometry(63.2, 63.2, 1.2, 96, 1, true),
      new THREE.MeshBasicMaterial({ map: ledTexture, side: THREE.BackSide })
    );
    ledRibbon.position.y = 0.6;
    scene.add(ledRibbon);

    function updateLedTexture(time) {
      ledCtx.fillStyle = '#090d16';
      ledCtx.fillRect(0, 0, 2048, 128);
      const brands = ['CRICMAX PRO', 'TATA IPL', 'FLY EMIRATES', 'APOLLO TYRES', 'JIO CINEMA'];
      ledCtx.font = 'bold 44px sans-serif';
      const offset = (time * 120) % 2048;
      brands.forEach((brand, idx) => {
        ledCtx.fillStyle = idx % 2 === 0 ? '#00e676' : '#38bdf8';
        ledCtx.fillText(brand, (idx * 410 - offset + 2048) % 2048, 80);
      });
      ledTexture.needsUpdate = true;
    }

    // Grandstands
    for (let t = 0; t < 3; t++) {
      const stand = new THREE.Mesh(
        new THREE.CylinderGeometry(70 + t * 6, 64 + t * 6, 4.8, 64, 1, true),
        new THREE.MeshStandardMaterial({ color: 0x0f172a + (t * 0x040608), roughness: 0.8 })
      );
      stand.position.y = 2.4 + (t * 4.8);
      scene.add(stand);
    }

    // Section 5: Clay Pitch with Dynamic Wear Footmarks
    const pitch = new THREE.Mesh(
      new THREE.PlaneGeometry(3.6, 22.2),
      new THREE.MeshStandardMaterial({ color: 0x987349, roughness: 0.95 })
    );
    pitch.rotation.x = -Math.PI / 2; pitch.position.y = 0.03; pitch.receiveShadow = true;
    scene.add(pitch);

    function addMarking(x, z, w, h, col = 0xffffff) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col }));
      line.rotation.x = -Math.PI / 2; line.position.set(x, 0.04, z);
      scene.add(line);
    }
    addMarking(0, 8.8, 3.6, 0.12);
    addMarking(0, -8.8, 3.6, 0.12);
    addMarking(0, 10.0, 2.64, 0.08);
    addMarking(0, -10.0, 2.64, 0.08);

    // Stampable Footmark Wear Rings
    const footmarkGroup = new THREE.Group();
    scene.add(footmarkGroup);

    function stampFootmark(x, z) {
      const wear = new THREE.Mesh(
        new THREE.CircleGeometry(0.18 + Math.random() * 0.15, 12),
        new THREE.MeshBasicMaterial({ color: 0x54391e, transparent: true, opacity: 0.65 })
      );
      wear.rotation.x = -Math.PI / 2;

    class DynamicWicketSystem {
      constructor(zPos) {
        this.zPos = zPos;
        this.group = new THREE.Group();
        this.stumps = [];
        this.bails = [];
        this.isFlying = false;

        const woodMat = new THREE.MeshStandardMaterial({ color: 0xfde68a, roughness: 0.35 });
        [-0.11, 0, 0.11].forEach(x => {
          const s = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.76, 10), woodMat);
          s.position.set(x, 0.38, 0); s.castShadow = true;
          this.group.add(s);
          this.stumps.push({ mesh: s, basePos: s.position.clone(), vel: new THREE.Vector3(), rotVel: new THREE.Vector3() });
        });

        [-0.055, 0.055].forEach(x => {
          const b = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.13, 8), woodMat);
          b.rotation.z = Math.PI / 2; b.position.set(x, 0.77, 0);
          this.group.add(b);
          this.bails.push({ mesh: b, basePos: b.position.clone(), vel: new THREE.Vector3(), rotVel: new THREE.Vector3() });
        });

        this.group.position.set(0, 0, zPos);
        scene.add(this.group);
      }

      triggerShatter() {
        this.isFlying = true;
        this.stumps.forEach((s, idx) => {
          s.vel.set((idx - 1) * 2.2 + (Math.random() - 0.5), 4.5 + Math.random() * 2, 4.0 + Math.random() * 3);
          s.rotVel.set(Math.random() * 8, Math.random() * 6, Math.random() * 8);
        });
        this.bails.forEach(b => {
          b.vel.set((Math.random() - 0.5) * 4, 6.0 + Math.random() * 2, 5.0 + Math.random() * 3);
          b.rotVel.set(Math.random() * 14, Math.random() * 12, Math.random() * 14);
        });
      }

      update(dt) {
        if (!this.isFlying) return;
        [...this.stumps, ...this.bails].forEach(item => {
          item.vel.y -= 9.8 * dt * 1.5;
          item.mesh.position.addScaledVector(item.vel, dt);
          item.mesh.rotation.x += item.rotVel.x * dt;
          item.mesh.rotation.y += item.rotVel.y * dt;
          item.mesh.rotation.z += item.rotVel.z * dt;
          if (item.mesh.position.y < 0.05) {
            item.mesh.position.y = 0.05;
            item.vel.y = -item.vel.y * 0.3;
            item.vel.x *= 0.7; item.vel.z *= 0.7;
          }
        });
      }

      reset() {
        this.isFlying = false;
        this.stumps.forEach(s => {
          s.mesh.position.copy(s.basePos);
          s.mesh.rotation.set(0, 0, 0);
          s.vel.set(0,0,0);
        });
        this.bails.forEach(b => {
          b.mesh.position.copy(b.basePos);
          b.mesh.rotation.set(0, 0, Math.PI / 2);
          b.vel.set(0,0,0);
        });
      }
    }

      constructor(name, x, z) {
        this.name = name;
        this.basePos = new THREE.Vector3(x, 0, z);
        this.currentPos = this.basePos.clone();
        this.targetPos = this.basePos.clone();
        this.state = 'idle'; // idle, chasing, returning

        this.group = new THREE.Group();
        const jersey = new THREE.MeshStandardMaterial({ color: 0xdc2626 });
        const white = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const skin = new THREE.MeshLambertMaterial({ color: 0xd4a373 });

        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.18, 0.68, 8), jersey);
        torso.position.y = 1.05; this.group.add(torso);

        legR.position.set(0.14, 0.35, 0); this.group.add(legR);

        this.group.position.copy(this.basePos);
        scene.add(this.group);
      }

      pursue(ballPos) {
        this.state = 'chasing';
        this.targetPos.set(ballPos.x, 0, ballPos.z);
      }

      reset() {
        this.state = 'returning';
        this.targetPos.copy(this.basePos);
      }

      update(dt) {
        if (this.state === 'idle') return;
        const dist = this.group.position.distanceTo(this.targetPos);
        if (dist > 0.3) {
          const dir = new THREE.Vector3().subVectors(this.targetPos, this.group.position).normalize();
          this.group.position.addScaledVector(dir, 14.0 * dt);
          this.group.lookAt(this.targetPos.x, this.group.position.y, this.targetPos.z);
        } else {
          if (this.state === 'returning') this.state = 'idle';
        }
      }
    }

    function renderDRSOscilloscope(hasEdge = false) {
      drsModal.style.display = 'flex';

      function drawSnicko() {
        frame++;
        const w = snickoCanvas.width, h = snickoCanvas.height;
        snickoCtx.fillStyle = '#030814';
        snickoCtx.fillRect(0, 0, w, h);

        snickoCtx.strokeStyle = 'rgba(255,255,255,0.15)';
        snickoCtx.beginPath();
        snickoCtx.moveTo(0, h / 2); snickoCtx.lineTo(w, h / 2); snickoCtx.stroke();

        // Contact Window marker line
        snickoCtx.strokeStyle = '#38bdf8';
        snickoCtx.strokeRect(w * 0.48, 4, 2, h - 8);

        snickoCtx.strokeStyle = hasEdge ? '#ef4444' : '#00e676';
        snickoCtx.lineWidth = 2;
        snickoCtx.beginPath();

        for (let x = 0; x < w; x++) {
          let noise = (Math.random() - 0.5) * 6;
          // Spike at middle frames
          if (hasEdge && Math.abs(x - w / 2) < 22) {
            noise = (Math.random() - 0.5) * (h * 0.85);
          }
          const y = (h / 2) + noise;
          if (x === 0) snickoCtx.moveTo(x, y); else snickoCtx.lineTo(x, y);
        }
        snickoCtx.stroke();

        if (frame < totalFrames) {
          snickoAnim = requestAnimationFrame(drawSnicko);
        } else {
          setTimeout(() => { drsModal.style.display = 'none'; }, 1600);
        }

    /* =======================================================

    let deliveryAnim = null;

    function playBall(shot) {
      if (deliveryAnim) { cancelAnimationFrame(deliveryAnim); deliveryAnim = null; }

      strikerWickets.reset(); bowlerWickets.reset();
      fielders.forEach(f => f.reset());
      pitchImpactRing.material.opacity = 0;
      ball.visible = true;
      lastRecordedShot = shot;

      trailCount = 0;
      trailMat.color.setHex(shot.isWicket ? 0xef4444 : 0x38bdf8);
      hawkeyeLine.visible = true;

      const speedRadar = document.getElementById('speedRadar');
      const deliverySpeed = (136 + Math.random() * 11).toFixed(1);
      speedRadar.innerText = `RADAR: ${deliverySpeed} KM/H`;
      speedRadar.classList.add('active');

      const startTime = performance.now();
      const pitchZ = 3.5 + ((shot.ballRandom || 0.5) * 1.5);
      // Section 5: Seam off the deck random deviation
      const seamDeviation = (Math.random() - 0.5) * 0.35;
      const pitchX = (Math.random() - 0.5) * 0.4;
      const angle = shot.zoneIndex >= 0 ? (shot.zoneIndex * Math.PI / 4) : Math.PI / 2;
      const finalDist = shot.runs > 0 ? (shot.isSix ? 67 : (shot.isFour ? 62 : shot.runs * 9)) : 18;
      const hitX = Math.sin(angle) * finalDist;
      const hitZ = 8.8 + Math.cos(angle) * (finalDist * 0.7);

      let bouncedSoundPlayed = false;
      let contactSoundPlayed = false;

      // Identify closest fielder for pursuit AI (Section 1)
      let nearestFielder = fielders[0];
      let minFielderDist = 999;
      fielders.forEach(f => {
        const d = f.basePos.distanceTo(new THREE.Vector3(hitX, 0, hitZ));
        if (d < minFielderDist) { minFielderDist = d; nearestFielder = f; }
      });

      function loop(now) {
        const elapsed = now - startTime;

        // Phase 1: Bowler Run-up (0 - 700ms)
        if (elapsed < 700) {
          const t = elapsed / 700;
          bowler.position.x = THREE.MathUtils.lerp(BOWLER_START_X, 0.55, t);
          bowler.position.z = THREE.MathUtils.lerp(BOWLER_START_Z, -9.8, t);
          bowler.armJoint.rotation.x = -Math.PI * 4 * t;
          ball.position.set(bowler.position.x + 0.3, 2.0, bowler.position.z);

          // Bat stance tap
          batsman.batPivot.rotation.x = -Math.PI / 5 + (Math.sin(t * 10) * 0.05);
          batsman.rotation.y = -Math.PI / 2;
          batsman.legL.position.set(-0.16, 0.45, 0);
        }
        // Phase 2: Delivery & Pitch Bounce with Seam (700ms - 1200ms)
        else if (elapsed < 1200) {
          const t = (elapsed - 700) / 500;
          if (t < 0.65) {
            const pt = t / 0.65;
            ball.position.x = THREE.MathUtils.lerp(0.55, pitchX, pt);
            ball.position.z = THREE.MathUtils.lerp(-9.8, pitchZ, pt);
            ball.position.y = THREE.MathUtils.lerp(2.1, 0.14, pt * pt);
          } else {
            if (!bouncedSoundPlayed) {
              playSoundPitchBounce();
              bouncedSoundPlayed = true;
              stampFootmark(pitchX, pitchZ); // Section 5 wear
              pitchImpactRing.position.set(pitchX, 0.05, pitchZ);
              pitchImpactRing.material.opacity = 0.85;
            }
            pitchImpactRing.material.opacity = Math.max(0, pitchImpactRing.material.opacity - 0.02);

            const pt = (t - 0.65) / 0.35;
            // Apply seam deviation off pitch
            ball.position.x = THREE.MathUtils.lerp(pitchX, batsman.position.x - 0.1 + seamDeviation, pt);
            ball.position.z = THREE.MathUtils.lerp(pitchZ, 8.8, pt);
            ball.position.y = 0.14 + (Math.sin(pt * Math.PI * 0.5) * 0.95);
          }
          addTrailPoint(ball.position);
        }
        // Phase 3: Shot Execution Variety & Fielder AI Pursuit (1200ms - 3400ms)
        else if (elapsed < 3400) {
          const t = (elapsed - 1200) / 2200;

          if (!contactSoundPlayed) {
            if (shot.isWicket) {
              playSoundStumpsShatter();
              strikerWickets.triggerShatter();
              renderDRSOscilloscope(true); // Section 2 Snicko on wicket
            } else {
              playSoundWillowBat(shot.isSix ? 1.0 : (shot.isFour ? 0.8 : 0.5));
              if (shot.isSix || shot.isFour) playSoundCrowdCheer();
            }
            historicalShots.push({ angle, dist: finalDist, runs: shot.runs, isWkt: shot.isWicket });
            drawWagonWheel();
            contactSoundPlayed = true;

            // Trigger Nearest Fielder Chasing (Section 1)
            if (!shot.isSix && shot.runs > 0) nearestFielder.pursue(new THREE.Vector3(hitX, 0, hitZ));
          }

          if (shot.isWicket) {
            batsman.batPivot.rotation.x = 0;
            ball.position.set(0.1, 0.3, 10.4);
          } else {
            // Section 4: Shot Mechanics Branching
            if (shot.zoneIndex === 1 || shot.zoneIndex === 2) {
              // Cover Drive: Leaning front foot forward
              batsman.legL.position.z = THREE.MathUtils.lerp(0, 0.35, Math.min(1, t * 5));
              batsman.batPivot.rotation.x = -Math.PI / 3 + (Math.min(1, t * 4) * Math.PI * 0.7);
            } else if (shot.zoneIndex >= 5) {
              // Pull/Hook: Hips & Shoulders pivot around Y
              batsman.rotation.y = -Math.PI / 2 + (Math.min(1, t * 4) * Math.PI * 0.45);
              batsman.batPivot.rotation.x = -Math.PI / 3 + (Math.min(1, t * 4) * Math.PI * 0.85);
            } else {
              // Straight Drive / Loft
              batsman.batPivot.rotation.x = -Math.PI / 3 + (Math.min(1, t * 4) * Math.PI * 0.85);
            }

            const dragFactor = 1 - Math.pow(t, 1.4) * 0.18;
            ball.position.x = THREE.MathUtils.lerp(batsman.position.x, hitX * dragFactor, t);
            ball.position.z = THREE.MathUtils.lerp(8.8, hitZ * dragFactor, t);

            if (shot.isSix) ball.position.y = 0.8 + (Math.sin(t * Math.PI) * 22.0 * dragFactor);
            else if (shot.isFour) ball.position.y = 0.2 + (Math.abs(Math.sin(t * Math.PI * 3.5)) * 1.5 * (1 - t));
            else ball.position.y = 0.14;
            addTrailPoint(ball.position);
          }

          if (activeCamMode === 'follow') {
            camPos.set(ball.position.x, ball.position.y + 2.5, ball.position.z - 6.0);
            camTarget.copy(ball.position);
          } else if (activeCamMode === 'broadcast' && (shot.isSix || shot.isFour)) {
            camTarget.lerp(ball.position, 0.05);
          }
        } else {
          deliveryAnim = null;
          speedRadar.classList.remove('active');
          return;
        }

        deliveryAnim = requestAnimationFrame(loop);
      }

      deliveryAnim = requestAnimationFrame(loop);

      setTimeout(() => {
        const b = document.getElementById('eventBanner');
        b.className = 'event-banner';
        if (shot.isWicket) { b.innerText = 'OUT / WICKET!'; b.classList.add('wkt', 'active'); }
        else if (shot.isSix) { b.innerText = 'MAXIMUM 6!'; b.classList.add('six', 'active'); }
        else if (shot.isFour) { b.innerText = 'CRACKING FOUR!'; b.classList.add('four', 'active'); }
        else { b.innerText = shot.runs > 0 ? `${shot.runs} RUNS` : 'DOT BALL'; b.classList.add('active'); }
        setTimeout(() => b.classList.remove('active'), 2200);
      }, 1200);
    }

    /* =======================================================
       11. MASTER RENDER ENGINE LOOP
       ======================================================= */
    let lastTime = 0;
    function animate(time) {
      requestAnimationFrame(animate);
      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      updateLedTexture(time * 0.001);

      strikerWickets.update(dt);
      bowlerWickets.update(dt);
      fielders.forEach(f => f.update(dt));

      if (activeCamMode !== 'follow') {
        camPos.lerp(cameraModes[activeCamMode].pos, 0.05);
        if (!deliveryAnim || activeCamMode !== 'broadcast') {
          camTarget.lerp(cameraModes[activeCamMode].target, 0.05);
        }
      }

      camera.position.copy(camPos);
      camera.lookAt(camTarget);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
