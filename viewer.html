<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CricMax Pro - 3D Stadium</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #01040a; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* Single Clean Broadcast TV Toolbar */
    .hud-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 18px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }

    .live-badge { background: #ef4444; color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 1.5px; padding: 6px 14px; border-radius: 20px; display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 0 16px rgba(239,68,68,.75); pointer-events: auto; }
    .live-badge::before { content:''; width: 8px; height: 8px; background: #fff; border-radius: 50%; display: inline-block; animation: pulse 1s infinite alternate; }
    @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.1); } }

    .cam-cluster { display: flex; gap: 6px; background: rgba(8,14,28,.82); padding: 5px; border-radius: 14px; backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); pointer-events: auto; }
    .cam-btn { background: transparent; border: 1px solid rgba(255,255,255,.12); color: #cbd5e1; padding: 7px 12px; border-radius: 9px; font-size: 11px; font-weight: 800; cursor: pointer; transition: all .2s; font-family: inherit; }
    .cam-btn:hover { background: rgba(0,230,118,.18); color: #fff; border-color: rgba(0,230,118,.4); }
    .cam-btn.active { background: linear-gradient(135deg,#009270,#00e676); color: #0a0e1a; border-color: transparent; box-shadow: 0 0 16px rgba(0,230,118,.6); font-weight: 900; }

    .ctrl-cluster { display: flex; gap: 6px; pointer-events: auto; }
    .ctrl-btn { width: 38px; height: 38px; border-radius: 11px; background: rgba(8,14,28,.82); border: 1px solid rgba(255,255,255,.18); color: #fff; font-size: 17px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(12px); transition: transform .15s; font-family: inherit; }
    .ctrl-btn:active { transform: scale(0.92); }

    /* Cinematic Boundary / Wicket Banner */
    .event-banner { position: absolute; top: 18%; left: 50%; transform: translateX(-50%) scale(.6); font-size: clamp(42px, 8vw, 86px); font-weight: 900; font-style: italic; text-transform: uppercase; color: #fff; opacity: 0; transition: all .35s cubic-bezier(.175,.885,.32,1.275); text-align: center; line-height: 1; pointer-events: none; }
    .event-banner.active { transform: translateX(-50%) scale(1); opacity: 1; }
    .event-banner.four { color: #22d3ee; text-shadow: 0 0 45px #0891b2, 0 8px 24px #000; }
    .event-banner.six { color: #ff6d00; text-shadow: 0 0 45px #fbbf24, 0 8px 24px #000; }
    .event-banner.wkt { color: #ef4444; text-shadow: 0 0 45px #7f1d1d, 0 8px 24px #000; }

    /* TV Broadcast Scorecard Lower Third */
    .tv-scorecard { pointer-events: auto; background: linear-gradient(90deg, rgba(8,18,32,.96), rgba(3,8,16,.98)); border: 1px solid rgba(255,255,255,.16); border-radius: 14px; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(18px); color: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.85); max-width: 860px; margin: 0 auto; width: 100%; gap: 14px; }
    .tv-team { display: flex; align-items: center; gap: 10px; font-weight: 900; border-right: 1px solid rgba(255,255,255,.12); padding-right: 16px; }
    .tv-team-badge { background: #00e676; color: #0a0e1a; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 900; }
    .tv-score { font-size: 24px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
    .tv-overs { font-size: 12px; color: #94a3b8; font-weight: 700; margin-left: 2px; }
    .tv-batsmen { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .tv-bat-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
    .tv-bat-row.striker { color: #00e676; }
    .tv-bowler { font-size: 12px; font-weight: 700; text-align: right; color: #22d3ee; border-left: 1px solid rgba(255,255,255,.12); padding-left: 16px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-layer">
    <div class="top-bar">
      <div class="live-badge">3D MATCH CAM</div>
      
      <!-- Camera Angle Toggles -->
      <div class="cam-cluster">
        <button class="cam-btn active" id="btn-broadcast" onclick="switchCamera('broadcast')">📺 TV</button>
        <button class="cam-btn" id="btn-bowler" onclick="switchCamera('bowler')">🎯 Bowler</button>
        <button class="cam-btn" id="btn-side" onclick="switchCamera('side')">🎬 Side</button>
        <button class="cam-btn" id="btn-follow" onclick="switchCamera('follow')">⚾ Ball Cam</button>
      </div>

      <!-- Controls: Audio, Replay, Fullscreen -->
      <div class="ctrl-cluster">
        <button class="ctrl-btn" id="btnMic" onclick="toggleAudio()" title="Live Commentary">🔊</button>
        <button class="ctrl-btn" onclick="triggerReplay()" title="Replay Delivery">↻</button>
        <button class="ctrl-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
      </div>
    </div>

    <div id="eventBanner" class="event-banner">FOUR!</div>

    <div class="tv-scorecard">
      <div class="tv-team">
        <span class="tv-team-badge" id="tvAbbr">BAT</span>
        <span class="tv-score" id="tvScore">0/0</span>
        <span class="tv-overs" id="tvOvers">(0.0)</span>
      </div>
      <div class="tv-batsmen">
        <div class="tv-bat-row striker"><span id="tvStrikerName">Striker*</span><b id="tvStrikerRuns">0(0)</b></div>
        <div class="tv-bat-row"><span id="tvNonStrikerName">Non-Striker</span><b id="tvNonStrikerRuns">0(0)</b></div>
      </div>
      <div class="tv-bowler">
        <div id="tvBowlerName">Bowler</div>
        <div id="tvBowlerFigs" style="color:#fff;font-variant-numeric:tabular-nums;">0.0-0-0-0</div>
      </div>
    </div>
  </div>

  <script>
    /* =======================================================
       1. ATMOSPHERE, RENDERER & STADIUM FLOODLIGHTS
       ======================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020713);
    scene.fog = new THREE.FogExp2(0x050d24, 0.0055);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 800);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xd4e2ff, 0.45);
    scene.add(ambientLight);

    // 4 High-Realism Structural Lattice Towers with Volumetric Glare
    const towerPositions = [
      { x: -55, z: -55 }, { x: 55, z: -55 },
      { x: -55, z: 55 },  { x: 55, z: 55 }
    ];

    towerPositions.forEach(pos => {
      const towerGroup = new THREE.Group();
      towerGroup.position.set(pos.x, 0, pos.z);

      // Steel Truss Cross-Members
      const steelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.3 });
      for (let c = 0; c < 4; c++) {
        const ang = (c * Math.PI) / 2;
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 42, 6), steelMat);
        col.position.set(Math.cos(ang) * 1.6, 21, Math.sin(ang) * 1.6);
        towerGroup.add(col);
      }
      for (let b = 4; b <= 40; b += 4) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.08, 4, 4), steelMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = b;
        towerGroup.add(ring);
      }

      // Floodlight Matrix Panel
      const headMat = new THREE.MeshBasicMaterial({ color: 0xfffaea });
      const panel = new THREE.Mesh(new THREE.BoxGeometry(9, 4.5, 1.2), headMat);
      panel.position.set(0, 42, 0);
      panel.lookAt(0, 0, 0);
      towerGroup.add(panel);

      // Volumetric Light Cone
      const coneGeo = new THREE.ConeGeometry(38, 70, 16, 1, true);
      const coneMat = new THREE.MeshBasicMaterial({ color: 0xfff3c4, transparent: true, opacity: 0.045, side: THREE.DoubleSide });
      const cone = new THREE.Mesh(coneGeo, coneMat);
      cone.position.set(0, 21, 0);
      cone.rotation.x = Math.PI / 2;
      cone.lookAt(0, 0, 0);
      towerGroup.add(cone);

      const spot = new THREE.SpotLight(0xfff6e0, 1.5, 190, Math.PI / 3.0, 0.38, 1.15);
      spot.position.set(pos.x, 42, pos.z);
      spot.target.position.set(0, 0, 0);
      spot.castShadow = true;
      spot.shadow.mapSize.set(1024, 1024);
      scene.add(spot);
      scene.add(spot.target);

      scene.add(towerGroup);
    });

    /* =======================================================
       2. OUTFIELD, CROWD GRANDSTANDS & CANOPY
       ======================================================= */
    function createLawnTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1024;
      const ctx = cv.getContext('2d');
      for (let r = 512; r > 0; r -= 28) {
        ctx.beginPath();
        ctx.arc(512, 512, r, 0, Math.PI * 2);
        ctx.fillStyle = (r / 28) % 2 === 0 ? '#1b4d24' : '#23592c';
        ctx.fill();
      }
      return new THREE.CanvasTexture(cv);
    }

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(68, 64),
      new THREE.MeshStandardMaterial({ map: createLawnTexture(), roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Infield 30-Yard White Marker Ring
    const innerRing = new THREE.Mesh(
      new THREE.RingGeometry(27.4, 27.7, 64),
      new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.35, transparent: true, side: THREE.DoubleSide })
    );
    innerRing.rotation.x = -Math.PI / 2;
    innerRing.position.y = 0.02;
    scene.add(innerRing);

    // Boundary Rope & Foam Wedge Cushions
    const rope = new THREE.Mesh(new THREE.TorusGeometry(62, 0.35, 12, 96), new THREE.MeshStandardMaterial({ color: 0xf1f5f9 }));
    rope.rotation.x = -Math.PI / 2;
    rope.position.y = 0.3;
    scene.add(rope);

    const wedgeMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
    for (let w = 0; w < 48; w++) {
      const ang = (w / 48) * Math.PI * 2;
      const cushion = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.5, 0.6), wedgeMat);
      cushion.position.set(Math.cos(ang) * 62, 0.25, Math.sin(ang) * 62);
      cushion.lookAt(0, 0.25, 0);
      scene.add(cushion);
    }

    // 3-Tier Grandstands with Instanced Crowd Points
    for (let t = 0; t < 3; t++) {
      const stand = new THREE.Mesh(
        new THREE.CylinderGeometry(70 + t * 6, 64 + t * 6, 4.8, 64, 1, true),
        new THREE.MeshStandardMaterial({ color: 0x0f172a + (t * 0x040608), roughness: 0.8 })
      );
      stand.position.y = 2.4 + (t * 4.8);
      scene.add(stand);
    }

    // Modern Cantilever Roof Ring
    const roof = new THREE.Mesh(
      new THREE.RingGeometry(72, 90, 48),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, side: THREE.DoubleSide, roughness: 0.5 })
    );
    roof.rotation.x = -Math.PI / 2;
    roof.position.y = 21;
    scene.add(roof);

    // Instanced Crowd Points (1,800 Fans)
    const crowdGeo = new THREE.BufferGeometry();
    const crowdCount = 1800;
    const crowdPos = new Float32Array(crowdCount * 3);
    const crowdCol = new Float32Array(crowdCount * 3);
    const palette = [
      new THREE.Color(0xef4444), new THREE.Color(0x3b82f6),
      new THREE.Color(0xfbbf24), new THREE.Color(0xffffff),
      new THREE.Color(0x10b981)
    ];

    for (let i = 0; i < crowdCount; i++) {
      const ang = Math.random() * Math.PI * 2;
      const tier = Math.floor(Math.random() * 3);
      const rad = 65 + tier * 6 + Math.random() * 4;
      crowdPos[i * 3] = Math.cos(ang) * rad;
      crowdPos[i * 3 + 1] = 1.0 + tier * 4.8 + Math.random() * 3.5;
      crowdPos[i * 3 + 2] = Math.sin(ang) * rad;

      const c = palette[Math.floor(Math.random() * palette.length)];
      crowdCol[i * 3] = c.r;
      crowdCol[i * 3 + 1] = c.g;
      crowdCol[i * 3 + 2] = c.b;
    }
    crowdGeo.setAttribute('position', new THREE.BufferAttribute(crowdPos, 3));
    crowdGeo.setAttribute('color', new THREE.BufferAttribute(crowdCol, 3));
    const crowdPoints = new THREE.Points(crowdGeo, new THREE.PointsMaterial({ size: 0.65, vertexColors: true }));
    scene.add(crowdPoints);

    /* =======================================================
       3. AUTHENTIC CLAY PITCH & CHALK MARKINGS
       ======================================================= */
    // Weathered Sandy Clay Turf
    const pitch = new THREE.Mesh(
      new THREE.PlaneGeometry(3.6, 22.2),
      new THREE.MeshStandardMaterial({ color: 0x987349, roughness: 0.95 })
    );
    pitch.rotation.x = -Math.PI / 2;
    pitch.position.y = 0.03;
    pitch.receiveShadow = true;
    scene.add(pitch);

    // Footmark Rough Patches outside Off-Stump
    function addRough(x, z, w, h) {
      const rough = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: 0x644626, transparent: true, opacity: 0.55 })
      );
      rough.rotation.x = -Math.PI / 2;
      rough.position.set(x, 0.035, z);
      scene.add(rough);
    }
    addRough(0.5, 8.2, 0.6, 1.4);
    addRough(-0.5, -8.0, 0.6, 1.4);

    // Chalk Markings Helper
    function addMarking(x, z, w, h, col = 0xffffff) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col }));
      line.rotation.x = -Math.PI / 2;
      line.position.set(x, 0.04, z);
      scene.add(line);
    }
    addMarking(0, 8.8, 3.6, 0.12);   // Striker Popping Crease
    addMarking(0, -8.8, 3.6, 0.12);  // Non-Striker Popping Crease
    addMarking(0, 10.0, 2.64, 0.08); // Bowling Crease
    addMarking(0, -10.0, 2.64, 0.08);
    // Yellow Wide Guidelines (0.89m from off-stump)
    addMarking(-0.89, 9.4, 0.08, 1.2, 0xfef08a);
    addMarking(0.89, 9.4, 0.08, 1.2, 0xfef08a);
    addMarking(-0.89, -9.4, 0.08, 1.2, 0xfef08a);
    addMarking(0.89, -9.4, 0.08, 1.2, 0xfef08a);

    // Stumps & Bails
    function createWickets(z) {
      const group = new THREE.Group();
      const wood = new THREE.MeshStandardMaterial({ color: 0xfde68a, roughness: 0.35 });
      for (let i = -1; i <= 1; i++) {
        const s = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.76, 10), wood);
        s.position.set(i * 0.11, 0.38, 0);
        s.castShadow = true;
        group.add(s);
      }
      const b = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.28, 8), wood);
      b.rotation.z = Math.PI / 2;
      b.position.set(0, 0.77, 0);
      group.add(b);
      group.position.set(0, 0, z);
      scene.add(group);
      return group;
    }
    const strikerWickets = createWickets(10.0);
    const bowlerWickets = createWickets(-10.0);

    /* =======================================================
       4. ARTICULATED PLAYER RIGS & POSITIONING
       ======================================================= */
    // Striker Batsman
    function buildBatsman() {
      const rig = new THREE.Group();
      const jersey = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
      const skin = new THREE.MeshLambertMaterial({ color: 0xd4a373 });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.72, 10), jersey);
      torso.position.y = 1.25;
      torso.castShadow = true;
      rig.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), skin);
      head.position.y = 1.74;
      rig.add(head);

      const helmet = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 16, 16, 0, Math.PI * 2, 0, Math.PI / 1.7),
        new THREE.MeshStandardMaterial({ color: 0x0369a1 })
      );
      helmet.position.y = 1.78;
      rig.add(helmet);

      const padMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.76, 0.2), padMat);
      legL.position.set(-0.16, 0.45, 0);
      rig.add(legL);
      const legR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.76, 0.2), padMat);
      legR.position.set(0.16, 0.45, 0);
      rig.add(legR);

      // Shoulders & Bat Joint
      const shoulders = new THREE.Group();
      shoulders.position.set(0, 1.48, 0);
      rig.add(shoulders);

      const batPivot = new THREE.Group();
      batPivot.position.set(0, -0.4, 0.25);
      shoulders.add(batPivot);

      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.35, 8), new THREE.MeshStandardMaterial({ color: 0xffffff }));
      handle.position.y = 0.15;
      batPivot.add(handle);

      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.85, 0.05), new THREE.MeshStandardMaterial({ color: 0xd4a373 }));
      blade.position.y = -0.35;
      blade.castShadow = true;
      batPivot.add(blade);

      rig.shoulders = shoulders;
      rig.batPivot = batPivot;
      return rig;
    }
    const batsman = buildBatsman();
    batsman.position.set(0.3, 0, 8.8);
    batsman.rotation.y = -Math.PI / 2; // Facing the bowler
    scene.add(batsman);

    // Umpire (Positioned directly behind non-striker stumps)
    function buildUmpire() {
      const rig = new THREE.Group();
      const coat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
      const white = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const skin = new THREE.MeshLambertMaterial({ color: 0xd4a373 });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.24, 0.85, 10), coat);
      torso.position.y = 1.25;
      torso.castShadow = true;
      rig.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), skin);
      head.position.y = 1.82;
      rig.add(head);

      const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.03, 16), white);
      hat.position.y = 1.9;
      rig.add(hat);

      // Articulated Shoulders for Gestures
      const leftShoulder = new THREE.Group();
      leftShoulder.position.set(-0.36, 1.58, 0);
      rig.add(leftShoulder);
      const lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.65, 8), coat);
      lArm.position.y = -0.32;
      leftShoulder.add(lArm);

      const rightShoulder = new THREE.Group();
      rightShoulder.position.set(0.36, 1.58, 0);
      rig.add(rightShoulder);
      const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.65, 8), coat);
      rArm.position.y = -0.32;
      rightShoulder.add(rArm);

      rig.leftShoulder = leftShoulder;
      rig.rightShoulder = rightShoulder;
      return rig;
    }
    const umpire = buildUmpire();
    umpire.position.set(0, 0, -11.6); // Direct sight line down pitch
    scene.add(umpire);

    // Bowler (Starting from Over the Wicket)
    function buildBowler() {
      const rig = new THREE.Group();
      const red = new THREE.MeshStandardMaterial({ color: 0xdc2626 });
      const skin = new THREE.MeshLambertMaterial({ color: 0xd4a373 });

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.22, 0.72, 8), red);
      torso.position.y = 1.15;
      torso.castShadow = true;
      rig.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), skin);
      head.position.y = 1.62;
      rig.add(head);

      const armJoint = new THREE.Group();
      armJoint.position.set(0.35, 1.4, 0);
      rig.add(armJoint);

      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.65, 8), red);
      arm.position.y = -0.3;
      armJoint.add(arm);

      rig.armJoint = armJoint;
      return rig;
    }
    const bowler = buildBowler();
    const BOWLER_START_X = 1.5;  // Over the Wicket starting offset
    const BOWLER_START_Z = -22.0;
    bowler.position.set(BOWLER_START_X, 0, BOWLER_START_Z);
    scene.add(bowler);

    // Cricket Ball
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 24), new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.35 }));
    ball.castShadow = true;
    ball.visible = false;
    scene.add(ball);

    /* =======================================================
       5. BROADCAST CAMERA CONTROLLER (FIXED DISPATCH)
       ======================================================= */
    const cameraModes = {
      broadcast: { pos: new THREE.Vector3(0, 16, 32), target: new THREE.Vector3(0, 1.2, 2) },
      bowler:    { pos: new THREE.Vector3(0, 4.2, -22), target: new THREE.Vector3(0, 1.0, 9) },
      side:      { pos: new THREE.Vector3(26, 5, 8), target: new THREE.Vector3(0, 1.0, 8) },
      follow:    { pos: new THREE.Vector3(0, 8, -6), target: new THREE.Vector3(0, 0.5, 9) }
    };

    let activeCamMode = 'broadcast';
    let camPos = cameraModes.broadcast.pos.clone();
    let camTarget = cameraModes.broadcast.target.clone();

    window.switchCamera = function(mode) {
      if (!cameraModes[mode]) return;
      activeCamMode = mode;

      document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + mode);
      if (activeBtn) activeBtn.classList.add('active');
    };

    window.toggleFullscreen = function() {
      const doc = window.document;
      const el = doc.documentElement;
      if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (doc.exitFullscreen) doc.exitFullscreen();
        else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
      }
    };

    let isAudioOn = true;
    window.toggleAudio = function() {
      isAudioOn = !isAudioOn;
      const btn = document.getElementById('btnMic');
      if (btn) btn.innerText = isAudioOn ? '🔊' : '🔇';

      if (window.parent && typeof window.parent.toggleCommentaryVoice === 'function') {
        window.parent.toggleCommentaryVoice();
      }
    };

    /* =======================================================
       6. RUN-UP PHYSICS, TRAJECTORY & UMPIRE GESTURES
       ======================================================= */
    let deliveryAnim = null;
    let umpireSignal = 'idle';
    let signalStart = 0;
    let lastRecordedShot = null;

    window.triggerReplay = function() {
      if (lastRecordedShot) playBall(lastRecordedShot);
    };

    function updateUmpire(now) {
      if (umpireSignal === 'idle') {
        umpire.leftShoulder.rotation.z = THREE.MathUtils.lerp(umpire.leftShoulder.rotation.z, 0, 0.08);
        umpire.leftShoulder.rotation.x = THREE.MathUtils.lerp(umpire.leftShoulder.rotation.x, 0, 0.08);
        umpire.rightShoulder.rotation.z = THREE.MathUtils.lerp(umpire.rightShoulder.rotation.z, 0, 0.08);
        umpire.rightShoulder.rotation.x = THREE.MathUtils.lerp(umpire.rightShoulder.rotation.x, 0, 0.08);
        return;
      }

      const t = (now - signalStart) / 1000;

      if (umpireSignal === 'wicket') {
        // OUT: Raised right index finger
        umpire.rightShoulder.rotation.z = THREE.MathUtils.lerp(umpire.rightShoulder.rotation.z, -Math.PI * 0.95, 0.12);
      } else if (umpireSignal === 'six') {
        // SIX: Both arms raised vertically
        umpire.leftShoulder.rotation.z = THREE.MathUtils.lerp(umpire.leftShoulder.rotation.z, Math.PI * 0.95, 0.12);
        umpire.rightShoulder.rotation.z = THREE.MathUtils.lerp(umpire.rightShoulder.rotation.z, -Math.PI * 0.95, 0.12);
      } else if (umpireSignal === 'four') {
        // FOUR: Horizontal wave across body
        const wave = Math.sin(t * 7.5);
        umpire.rightShoulder.rotation.x = -Math.PI / 2.2;
        umpire.rightShoulder.rotation.z = -Math.PI / 4 + (wave * 0.45);
      }

      if (t > 4.2) umpireSignal = 'idle';
    }

    function playBall(shot) {
      if (deliveryAnim) cancelAnimationFrame(deliveryAnim);
      lastRecordedShot = shot;
      ball.visible = true;

      const startTime = performance.now();
      const pitchZ = 3.5 + ((shot.ballRandom || 0.5) * 1.5);
      const pitchX = (Math.random() - 0.5) * 0.4;
      const isSix = shot.isSix;
      const isFour = shot.isFour;
      const isWicket = shot.isWicket;

      const angle = shot.zoneIndex >= 0 ? (shot.zoneIndex * Math.PI / 4) : Math.PI / 2;
      let finalDist = shot.runs > 0 ? (isSix ? 67 : (isFour ? 62 : shot.runs * 9)) : 18;
      const hitX = Math.sin(angle) * finalDist;
      const hitZ = 8.8 + Math.cos(angle) * (finalDist * 0.7);

      function loop(now) {
        const elapsed = now - startTime;

        // Phase 1: Bowler Run-Up (Over the Wicket sprint past Umpire) [0 - 750ms]
        if (elapsed < 750) {
          const t = elapsed / 750;
          bowler.position.x = THREE.MathUtils.lerp(BOWLER_START_X, 0.55, t);
          bowler.position.z = THREE.MathUtils.lerp(BOWLER_START_Z, -9.8, t);
          bowler.armJoint.rotation.x = -Math.PI * 4 * t;
          ball.position.set(bowler.position.x + 0.3, 2.0, bowler.position.z);

          // Batsman stance movement
          batsman.batPivot.rotation.x = -Math.PI / 5 + (Math.sin(t * 10) * 0.05);
        }
        // Phase 2: Flight & Turf Drop [750ms - 1300ms]
        else if (elapsed < 1300) {
          const t = (elapsed - 750) / 550;
          if (t < 0.65) {
            const pt = t / 0.65;
            ball.position.x = THREE.MathUtils.lerp(0.55, pitchX, pt);
            ball.position.z = THREE.MathUtils.lerp(-9.8, pitchZ, pt);
            ball.position.y = THREE.MathUtils.lerp(2.1, 0.14, pt * pt);
          } else {
            const pt = (t - 0.65) / 0.35;
            ball.position.x = THREE.MathUtils.lerp(pitchX, batsman.position.x - 0.1, pt);
            ball.position.z = THREE.MathUtils.lerp(pitchZ, 8.8, pt);
            ball.position.y = 0.14 + (Math.sin(pt * Math.PI * 0.5) * 0.95);
          }
          batsman.batPivot.rotation.x = -Math.PI / 3;
        }
        // Phase 3: Shot Contact & Trajectory [1300ms - 3600ms]
        else if (elapsed < 3600) {
          const t = (elapsed - 1300) / 2300;

          if (isWicket) {
            batsman.batPivot.rotation.x = 0;
            strikerWickets.rotation.z = Math.min(0.85, t * 3);
            ball.position.set(0.1, 0.3, 10.4);
          } else {
            batsman.batPivot.rotation.x = -Math.PI / 3 + (Math.min(1, t * 4) * Math.PI * 0.85);

            ball.position.x = THREE.MathUtils.lerp(batsman.position.x, hitX, t);
            ball.position.z = THREE.MathUtils.lerp(8.8, hitZ, t);

            if (isSix) ball.position.y = 0.8 + (Math.sin(t * Math.PI) * 22.0);
            else if (isFour) ball.position.y = 0.2 + (Math.abs(Math.sin(t * Math.PI * 3.5)) * 1.5 * (1 - t));
            else ball.position.y = 0.14;
          }

          if (activeCamMode === 'follow') {
            camPos.set(ball.position.x, ball.position.y + 2.5, ball.position.z - 6.0);
            camTarget.copy(ball.position);
          } else if (activeCamMode === 'broadcast' && (isSix || isFour)) {
            camTarget.lerp(ball.position, 0.05);
          }
        } else {
          deliveryAnim = null;
          return;
        }

        deliveryAnim = requestAnimationFrame(loop);
      }

      deliveryAnim = requestAnimationFrame(loop);

      // Trigger Umpire Gesture
      setTimeout(() => {
        signalStart = performance.now();
        if (isWicket) umpireSignal = 'wicket';
        else if (isSix) umpireSignal = 'six';
        else if (isFour) umpireSignal = 'four';
        else umpireSignal = 'idle';

        const b = document.getElementById('eventBanner');
        b.className = 'event-banner';
        if (shot.isWicket) { b.innerText = 'OUT / WICKET!'; b.classList.add('wkt', 'active'); }
        else if (shot.isSix) { b.innerText = 'MAXIMUM 6!'; b.classList.add('six', 'active'); }
        else if (shot.isFour) { b.innerText = 'CRACKING FOUR!'; b.classList.add('four', 'active'); }
        else { b.innerText = shot.runs > 0 ? `${shot.runs} RUNS` : 'DOT BALL'; b.classList.add('active'); }
        setTimeout(() => b.classList.remove('active'), 2400);
      }, 1300);
    }

    /* =======================================================
       7. REAL-TIME DATA SYNC & RENDER LOOP
       ======================================================= */
    let lastSeenCount = 0;
    function pollMatchState() {
      const m = window.parent ? window.parent.match : window.match;
      if (!m) return;

      document.getElementById('tvAbbr').innerText = m.teamBattingAbbr || m.teamBatting || 'BAT';
      document.getElementById('tvScore').innerText = `${m.runs || 0}/${m.wickets || 0}`;
      document.getElementById('tvOvers').innerText = `(${Math.floor((m.legalBalls || 0) / 6)}.${(m.legalBalls || 0) % 6})`;

      const st = (m.batters && m.batters[m.striker]) || { runs: 0, balls: 0 };
      const nst = (m.batters && m.batters[m.nonStriker]) || { runs: 0, balls: 0 };
      const bw = (m.bowlers && m.bowlers[m.currentBowler]) || { balls: 0, maidens: 0, runs: 0, wickets: 0 };

      document.getElementById('tvStrikerName').innerText = `${m.striker || 'Striker'}*`;
      document.getElementById('tvStrikerRuns').innerText = `${st.runs}(${st.balls})`;
      document.getElementById('tvNonStrikerName').innerText = `${m.nonStriker || 'Non-Striker'}`;
      document.getElementById('tvNonStrikerRuns').innerText = `${nst.runs}(${nst.balls})`;

      document.getElementById('tvBowlerName').innerText = `${m.currentBowler || 'Bowler'}`;
      document.getElementById('tvBowlerFigs').innerText = `${Math.floor(bw.balls / 6)}.${bw.balls % 6}-${bw.maidens}-${bw.runs}-${bw.wickets}`;

      if (m.shotLog && m.shotLog.length > lastSeenCount) {
        const shot = m.shotLog[m.shotLog.length - 1];
        lastSeenCount = m.shotLog.length;
        playBall(shot);
      }
    }
    setInterval(pollMatchState, 350);

    function animate(now) {
      requestAnimationFrame(animate);

      if (activeCamMode !== 'follow') {
        camPos.lerp(cameraModes[activeCamMode].pos, 0.05);
        if (!deliveryAnim || activeCamMode !== 'broadcast') {
          camTarget.lerp(cameraModes[activeCamMode].target, 0.05);
        }
      }

      camera.position.copy(camPos);
      camera.lookAt(camTarget);

      updateUmpire(now);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
