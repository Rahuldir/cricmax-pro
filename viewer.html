<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#020713">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>CricMax Pro — Match Viewer</title>

<link rel="preload" as="script" href="stadium.js">
<link rel="preload" as="script" href="shot-fx.js">

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none;}
  canvas#three-canvas{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;touch-action:none;}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(circle at center,transparent 55%,rgba(0,0,0,.5) 100%);}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:9999;touch-action:manipulation;}

  #cm-loader{position:fixed;inset:0;background:#020713;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#00e676;font-family:-apple-system,sans-serif;transition:opacity .45s ease;}
  #cm-loader.cm-hide{opacity:0;pointer-events:none;}
  .cm-spin{font-size:46px;margin-bottom:12px;animation:cmSpin 1.2s linear infinite;display:inline-block;}
  @keyframes cmSpin{to{transform:rotate(360deg);}}
  .cm-loader-title{font-size:14px;font-weight:900;letter-spacing:2px;color:#00e676;}
  .cm-loader-sub{font-size:11px;color:#64748b;margin-top:8px;}
  .cm-loader-bar-wrap{width:180px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:20px;overflow:hidden;}
  #cm-loader-bar{width:0%;height:100%;background:linear-gradient(90deg,#009270,#00e676);transition:width .3s ease;}

  .top-bar{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;align-items:center;gap:4px;pointer-events:none;}
  .top-left{display:flex;gap:4px;align-items:center;pointer-events:auto;}
  .top-center{display:flex;justify-content:center;align-items:center;pointer-events:auto;flex:1;min-width:0;}
  .top-right{display:flex;gap:3px;align-items:center;pointer-events:auto;}

  .live{background:#ef4444;color:#fff;padding:4px 8px;border-radius:14px;font-size:9px;font-weight:900;letter-spacing:.8px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 0 10px rgba(239,68,68,.7);white-space:nowrap;}
  .live::before{content:'';width:5px;height:5px;background:#fff;border-radius:50%;animation:blink 1s infinite alternate;}
  @keyframes blink{0%{opacity:.3;}100%{opacity:1;}}

  .ic{width:30px;height:30px;border-radius:9px;background:rgba(8,14,28,.88);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;pointer-events:auto;flex-shrink:0;touch-action:manipulation;}
  .ic:active{transform:scale(.92);}
  .ic.on{background:linear-gradient(135deg,#009270,#00e676);border-color:transparent;color:#0a0e1a;}

  .cam-sel{background:rgba(15,23,42,.92);border:1px solid rgba(0,230,118,.45);color:#00e676;font-size:10px;font-weight:800;padding:5px 7px;border-radius:9px;outline:none;cursor:pointer;font-family:inherit;min-width:0;max-width:120px;width:100%;}
  .cam-sel option{background:#0b1329;color:#fff;font-weight:700;}

  .audio-fab{position:absolute;top:44px;left:6px;z-index:100003;pointer-events:auto;display:flex;flex-direction:column;align-items:flex-start;touch-action:manipulation;}
  .audio-fab > .ic{width:36px;height:36px;font-size:16px;border-radius:10px;position:relative;}
  .audio-fab > .ic .snd-caret{position:absolute;bottom:2px;right:3px;font-size:8px;opacity:.9;line-height:1;}

  #audioMenu{position:absolute;top:42px;left:0;width:min(74vw,220px);background:linear-gradient(160deg,rgba(15,23,42,.98),rgba(3,8,16,.99));border:1px solid rgba(0,230,118,.4);border-radius:12px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.7);opacity:0;transform:translateY(-6px) scale(.96);transition:all .2s;visibility:hidden;pointer-events:auto;touch-action:manipulation;}
  #audioMenu.open{opacity:1;transform:translateY(0) scale(1);visibility:visible;}
  .audio-opt{display:flex;align-items:center;gap:8px;width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:10px;color:#e2e8f0;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:5px;text-align:left;}
  .audio-opt:last-child{margin-bottom:0;}
  .audio-opt:active{transform:scale(.98);}
  .audio-opt .ai{font-size:15px;line-height:1;}
  .audio-opt .as{margin-left:auto;font-size:8.5px;font-weight:900;color:#94a3b8;letter-spacing:.5px;}
  .audio-opt.on{background:linear-gradient(135deg,rgba(0,146,112,.4),rgba(0,230,118,.28));border-color:#00e676;color:#fff;}
  .audio-opt.on .as{color:#00e676;}

  #menuPanel{position:absolute;top:48px;right:6px;width:min(88vw,290px);background:linear-gradient(160deg,rgba(15,23,42,.98),rgba(3,8,16,.99));border:1px solid rgba(0,230,118,.35);border-radius:12px;padding:9px;z-index:100001;opacity:0;transform:translateY(-8px) scale(.96);transition:all .2s;visibility:hidden;pointer-events:auto;max-height:calc(100vh - 60px);overflow-y:auto;touch-action:manipulation;}
  #menuPanel.open{opacity:1;transform:translateY(0) scale(1);visibility:visible;}
  .menu-sec{margin-bottom:8px;}
  .menu-sec:last-child{margin-bottom:0;}
  .menu-ttl{font-size:8.5px;font-weight:900;letter-spacing:1.5px;color:#00e676;text-transform:uppercase;margin-bottom:5px;}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .menu-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
  .menu-t{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 5px;color:#e2e8f0;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;justify-content:center;text-align:center;min-height:34px;}
  .menu-t.on{background:linear-gradient(135deg,rgba(0,146,112,.35),rgba(0,230,118,.25));border-color:#00e676;color:#fff;}
  .menu-t .i{font-size:13px;line-height:1;}
  .menu-div{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);margin:7px 0;}

  .speed{position:absolute;top:44px;right:6px;background:rgba(15,23,42,.92);border:1px solid rgba(34,211,238,.45);padding:3px 8px;border-radius:6px;color:#38bdf8;font-family:ui-monospace,monospace;font-size:10px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;}
  .speed.on{opacity:1;}

  #wagonWrap{position:fixed;top:44px;left:0;right:0;bottom:88px;display:none;align-items:center;justify-content:center;padding:4px;z-index:10001;pointer-events:none;}
  #wagonWrap.show{display:flex;}
  #wagonWheelCanvas{max-width:100%;max-height:100%;width:auto;height:auto;aspect-ratio:1/1;background:#050b0a;border:1px solid rgba(0,230,118,.4);border-radius:50%;box-shadow:0 0 40px rgba(0,230,118,.35), inset 0 0 30px rgba(0,0,0,.6);pointer-events:auto;display:block;}
  #wagonInfo{position:fixed;top:28px;left:50%;transform:translateX(-50%);color:#00e676;background:rgba(8,15,30,.92);border:1px solid rgba(0,230,118,.4);padding:3px 9px;border-radius:10px;font-size:9px;font-weight:800;letter-spacing:.7px;white-space:nowrap;display:none;z-index:10002;pointer-events:none;}
  #wagonInfo.show{display:block;}

  .banner{position:absolute;top:24%;left:50%;transform:translateX(-50%) scale(.6);font-size:clamp(30px,8vw,60px);font-weight:900;font-style:italic;text-transform:uppercase;color:#fff;opacity:0;transition:all .3s;pointer-events:none;text-align:center;line-height:1;}
  .banner.on{transform:translateX(-50%) scale(1);opacity:1;}
  .banner.four{color:#22d3ee;text-shadow:0 0 30px #0891b2,0 6px 16px #000;}
  .banner.six{color:#ff6d00;text-shadow:0 0 30px #fbbf24,0 6px 16px #000;}
  .banner.wkt{color:#ef4444;text-shadow:0 0 30px #7f1d1d,0 6px 16px #000;}
  .banner.run{color:#00e676;text-shadow:0 0 30px #009270,0 6px 16px #000;}

  .bottom{position:absolute;bottom:6px;left:6px;right:6px;display:flex;flex-direction:column;gap:4px;pointer-events:auto;z-index:10000;padding-bottom:env(safe-area-inset-bottom,0);touch-action:manipulation;}
  .over-row{display:flex;align-items:center;gap:6px;background:rgba(8,18,32,.92);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:3px 8px;font-size:9px;font-weight:800;color:#cbd5e1;}
  .over-row > .label{color:#94a3b8;font-size:8.5px;letter-spacing:.5px;flex-shrink:0;}
  .dots{display:flex;gap:3px;flex:1;justify-content:center;}
  .b{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:900;background:rgba(255,255,255,.08);color:#94a3b8;border:1px solid rgba(255,255,255,.15);flex-shrink:0;}
  .b.dot{background:rgba(148,163,184,.2);}
  .b.run{background:rgba(2,132,199,.3);color:#38bdf8;border-color:#38bdf8;}
  .b.four{background:rgba(34,211,238,.35);color:#22d3ee;border-color:#22d3ee;}
  .b.six{background:rgba(251,191,36,.35);color:#fbbf24;border-color:#fbbf24;}
  .b.wkt{background:rgba(239,68,68,.55);color:#fff;border-color:#ef4444;}
  .b.nb{background:rgba(232,121,249,.4);color:#e879f9;border-color:#e879f9;}
  .b.bye{background:rgba(16,185,129,.3);color:#34d399;border-color:#10b981;}
  .over-row > .runs{color:#00e676;font-size:10px;font-weight:900;flex-shrink:0;}

  .score-row{background:linear-gradient(90deg,rgba(8,18,32,.96),rgba(3,8,16,.98));border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:5px 8px;display:flex;align-items:center;gap:7px;color:#fff;font-size:10px;font-weight:800;overflow:hidden;}
  .sc-team{display:flex;align-items:center;gap:4px;border-right:1px solid rgba(255,255,255,.12);padding-right:7px;flex-shrink:0;}
  .sc-abbr{background:#00e676;color:#0a0e1a;padding:2px 5px;border-radius:3px;font-size:9px;font-weight:900;}
  .sc-score{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
  .sc-ov{font-size:9px;color:#94a3b8;font-weight:700;}
  .sc-bats{display:flex;flex-direction:column;gap:0;flex:1;min-width:0;overflow:hidden;}
  .sc-row{display:flex;justify-content:space-between;font-weight:700;font-size:9.5px;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sc-row.striker{color:#00e676;}
  .sc-bowl{text-align:right;color:#22d3ee;border-left:1px solid rgba(255,255,255,.12);padding-left:7px;font-weight:700;font-size:9.5px;flex-shrink:0;}
  .sc-bowl > div{white-space:nowrap;}
  #bbBowler{transition:color .3s;}
  #bbBowler.bowler-flash{color:#ffffff;text-shadow:0 0 8px #22d3ee;}

  #tvMode{position:fixed;inset:0;z-index:100050;background:linear-gradient(135deg,#0a0e1a 0%,#0d1424 100%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#fff;text-align:center;}
  #tvMode.show{display:flex;}
  .tv-close{position:absolute;top:10px;right:10px;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.5);color:#fca5a5;padding:6px 11px;border-radius:9px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;}
  .tv-teams{font-size:clamp(14px,3.5vw,22px);font-weight:900;color:#00e676;margin-bottom:10px;letter-spacing:.7px;}
  .tv-score{font-size:clamp(46px,15vw,100px);font-weight:900;line-height:1;margin-bottom:6px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 30px rgba(0,230,118,.4);}
  .tv-meta{font-size:clamp(10px,1.7vw,13px);color:#94a3b8;font-weight:700;letter-spacing:.7px;margin-bottom:16px;}
  .tv-batters{display:flex;gap:12px;font-size:clamp(12px,2.3vw,16px);flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
  .tv-bat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 14px;min-width:110px;}
  .tv-bat.striker{border-color:#00e676;box-shadow:0 0 14px rgba(0,230,118,.35);}
  .tv-bat-name{font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px;}
  .tv-bat-runs{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;}
  .tv-bat.striker .tv-bat-runs{color:#00e676;}
  .tv-recent{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:520px;}
  .tv-ball{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);}
  .tv-ball.four{background:rgba(34,211,238,.3);color:#22d3ee;border-color:#22d3ee;}
  .tv-ball.six{background:rgba(251,191,36,.35);color:#fbbf24;border-color:#fbbf24;}
  .tv-ball.wkt{background:rgba(239,68,68,.5);color:#fff;border-color:#ef4444;}

  #commTicker{position:absolute;left:6px;right:6px;bottom:84px;background:rgba(8,15,30,.94);border:1px solid rgba(0,230,118,.35);border-left:3px solid #00e676;border-radius:8px;padding:6px 9px;color:#e2e8f0;font-size:10.5px;font-weight:700;line-height:1.3;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none;z-index:10000;}
  #commTicker.show{opacity:1;transform:translateY(0);}

  @media (max-width:360px){
    .ic{width:28px;height:28px;font-size:12px;border-radius:8px;}
    .live{padding:3px 6px;font-size:8.5px;}
    .cam-sel{font-size:9px;padding:4px 6px;max-width:95px;}
    .sc-score{font-size:13px;}
    .sc-row{font-size:8.5px;}
    .sc-bowl{font-size:8.5px;padding-left:5px;}
    .b{width:16px;height:16px;font-size:7.5px;}
    .over-row{font-size:8px;padding:2px 6px;}
    .audio-fab > .ic{width:34px;height:34px;font-size:15px;}
  }
  @media (max-width:320px){ .live{display:none;} }
  @media (prefers-reduced-motion: reduce){
    .live::before{animation:none;}
    .cm-spin{animation-duration:3s;}
  }
</style>
</head>
<body>

<div id="cm-loader">
  <span class="cm-spin">🏏</span>
  <div class="cm-loader-title">CRICMAX PRO</div>
  <div class="cm-loader-sub">Loading stadium…</div>
  <div class="cm-loader-bar-wrap"><div id="cm-loader-bar"></div></div>
</div>

<div class="vignette"></div>

<div class="hud">

  <div class="top-bar">
    <div class="top-left">
      <div class="live">VR LIVE</div>
      <div class="ic" onclick="triggerReplay()">↻</div>
      <div class="ic" onclick="toggleFullscreen()">⛶</div>
    </div>
    <div class="top-center">
      <select class="cam-sel" id="camSel" onchange="setCamera(this.value)">
        <option value="broadcast">📺 TV</option>
        <option value="bowler">🎯 Bowl</option>
        <option value="keeper">🧤 Keep</option>
        <option value="slip">👐 Slip</option>
        <option value="side">🎬 Sq</option>
        <option value="drone">🚁 Air</option>
        <option value="helmet">⛑️ Helm</option>
        <option value="follow">⚾ Ball</option>
      </select>
    </div>
    <div class="top-right">
      <div class="ic on" id="btn-dir" onclick="toggleDirector()">🎬</div>
      <div class="ic" id="btn-stadium" onclick="toggleStadiumView()">🕸️</div>
      <div class="ic" id="btn-tv" onclick="toggleTVMode()">📺</div>
      <div class="ic" id="btn-menu" onclick="toggleMenu(event)" style="background:linear-gradient(135deg,rgba(0,146,112,.9),rgba(0,230,118,.9));border:none;color:#fff;">☰</div>
    </div>
  </div>

  <div class="audio-fab">
    <div class="ic on" id="util-snd" onclick="toggleAudioMenu(event)">
      <span id="snd-ico">🏟️</span>
      <span class="snd-caret">▾</span>
    </div>
    <div id="audioMenu">
      <div class="menu-ttl">Audio Mode</div>
      <button class="audio-opt on" id="aud-stadium" onclick="setAudioMode('stadium')">
        <span class="ai">🏟️</span><span>Stadium Sound</span><span class="as">ON</span>
      </button>
      <button class="audio-opt" id="aud-commentary" onclick="setAudioMode('commentary')">
        <span class="ai">🎙️</span><span>Ball-by-Ball</span><span class="as">LIVE</span>
      </button>
      <button class="audio-opt" id="aud-mute" onclick="setAudioMode('mute')">
        <span class="ai">🔇</span><span>Mute</span><span class="as">OFF</span>
      </button>
    </div>
  </div>

  <div id="menuPanel">
    <div class="menu-sec">
      <div class="menu-ttl">Navigate</div>
      <div class="menu-grid">
        <button class="menu-t" data-pane="pitch" onclick="navTo('pitch')"><span class="i">🏏</span> Pitch</button>
        <button class="menu-t" data-pane="scorecard" onclick="navTo('scorecard')"><span class="i">🃏</span> Card</button>
        <button class="menu-t" data-pane="analytics" onclick="navTo('analytics')"><span class="i">📊</span> Stats</button>
        <button class="menu-t" data-pane="leaderboards" onclick="navTo('leaderboards')"><span class="i">📈</span> Boards</button>
      </div>
    </div>
    <div class="menu-div"></div>
    <div class="menu-sec">
      <div class="menu-ttl">Environment</div>
      <div class="menu-grid-3">
        <button class="menu-t on" id="env-day" onclick="setSky('day')"><span class="i">☀️</span> Day</button>
        <button class="menu-t" id="env-sunset" onclick="setSky('sunset')"><span class="i">🌇</span> Dusk</button>
        <button class="menu-t" id="env-night" onclick="setSky('night')"><span class="i">🌙</span> Night</button>
      </div>
    </div>
    <div class="menu-div"></div>
    <div class="menu-sec">
      <div class="menu-ttl">Audio</div>
      <div class="menu-grid-3">
        <button class="menu-t on" id="menu-aud-stadium" onclick="setAudioMode('stadium')"><span class="i">🏟️</span> Stadium</button>
        <button class="menu-t" id="menu-aud-commentary" onclick="setAudioMode('commentary')"><span class="i">🎙️</span> Comms</button>
        <button class="menu-t" id="menu-aud-mute" onclick="setAudioMode('mute')"><span class="i">🔇</span> Mute</button>
      </div>
    </div>
    <div class="menu-div"></div>
    <div class="menu-sec">
      <div class="menu-ttl">Camera</div>
      <select class="cam-sel" id="camSelMenu" onchange="setCamera(this.value)" style="max-width:100%;">
        <option value="broadcast">📺 TV Broadcast</option>
        <option value="bowler">🎯 Bowler View</option>
        <option value="keeper">🧤 Keeper View</option>
        <option value="slip">👐 Slip Cord</option>
        <option value="side">🎬 Square Side</option>
        <option value="drone">🚁 Drone</option>
        <option value="helmet">⛑️ Helmet Cam</option>
        <option value="follow">⚾ Ball Follow</option>
      </select>
    </div>
    <div class="menu-div"></div>
    <div class="menu-sec">
      <div class="menu-ttl">Utilities</div>
      <div class="menu-grid-3">
        <button class="menu-t on" id="util-wagon" onclick="toggleWagonWheel()"><span class="i">🕸️</span> Wagon</button>
        <button class="menu-t" onclick="simFeedScoringTab()"><span class="i">⚡</span> Feed</button>
        <button class="menu-t" onclick="toggleMenu(event)"><span class="i">✕</span> Close</button>
      </div>
    </div>
  </div>

  <div class="speed" id="speedTag">SPEED: --</div>

  <div id="wagonWrap">
    <canvas id="wagonWheelCanvas" width="800" height="800" style="max-width:100%;height:auto;"></canvas>
  </div>
  <div id="wagonInfo">🕸️ LIVE WAGON — tap 🏟️ for stadium</div>

  <div class="banner" id="banner">FOUR!</div>

  <div id="commTicker"></div>

  <div class="bottom">
    <div class="over-row">
      <span class="label">OVER:</span>
      <div class="dots" id="overDotsContainer"></div>
      <span class="runs" id="overTotalRuns">0 R</span>
    </div>
    <div class="score-row">
      <div class="sc-team">
        <span class="sc-abbr" id="bbAbbr">T1</span>
        <span class="sc-score" id="bbScore">0/0</span>
        <span class="sc-ov" id="bbOvers">(0.0)</span>
      </div>
      <div class="sc-bats">
        <div class="sc-row striker"><span id="bbStriker">Striker*</span><b id="bbStrikerRuns">0(0)</b></div>
        <div class="sc-row"><span id="bbNonStriker">Non-Striker</span><b id="bbNonStrikerRuns">0(0)</b></div>
      </div>
      <div class="sc-bowl">

<script>
(function(){
  /* ═══════════════════════════════════════════════════════════════

  const CM_DEBUG = (new URLSearchParams(location.search).get('debug') === '1');

  window.__cmDebug = CM_DEBUG;

  /* ═══════════════════════════════════════════════════════════════
     FIREBASE ARRAY GUARD
     Firebase RTDB returns arrays as objects with numeric-string
     keys if any index is missing. This converts back to real array.
     ═══════════════════════════════════════════════════════════════ */
  function toArray(objOrArr){
    if (Array.isArray(objOrArr)) return objOrArr;
    if (objOrArr && typeof objOrArr === 'object'){
      var keys = Object.keys(objOrArr).filter(function(k){ return /^\d+$/.test(k); });
      if (keys.length === 0) return [];
      return keys
        .sort(function(a,b){ return parseInt(a,10) - parseInt(b,10); })
        .map(function(k){ return objOrArr[k]; })
        .filter(function(v){ return v != null; });
    }
    return [];
  }
  window.__cmToArray = toArray;

  /* ═══════════════════════════════════════════════════════════════
     DEVICE TIER
     ═══════════════════════════════════════════════════════════════ */
  const CM_DEVICE = (function(){

    const isAndroid = /Android/i.test(ua);
    const mem = navigator.deviceMemory || 4;
    const cores = navigator.hardwareConcurrency || 4;
    const isLowEnd = mem < 4 || cores <= 4;
    const isMidEnd = mem >= 4 && mem < 6;
    return { isMobile, isIOS, isAndroid, mem, cores, tier: isLowEnd ? 0 : (isMidEnd ? 1 : 2) };
  })();
  window.__cmDevice = CM_DEVICE;
  cmlog('Device tier:', CM_DEVICE);

  const __cmLoaderBar = document.getElementById('cm-loader-bar');

  /* ═══════════════════════════════════════════════════════════════

  /* ═══════════════════════════════════════════════════════════════
     STADIUM / WAGON TOGGLE
     ⚡ EXACTLY AS REQUESTED — kept identical to the file you pasted.
        3D canvas is always visible; z-index swaps so the active

   let stadiumViewActive = false;

  /* ═══════════════════════════════════════════════════════════════

  let tvModeActive = false;

        '<div class="tv-bat"><div class="tv-bat-name">' + nst + '</div><div class="tv-bat-runs">' + nB.runs + ' (' + nB.balls + ')</div></div>';
    }

      rW.innerHTML = tags.map(t => {
        const s = String(t);

        if (s === '4') c += ' four'; else if (s === '6') c += ' six'; else if (s.indexOf('W') >= 0) c += ' wkt';

  }

  /* ═══════════════════════════════════════════════════════════════
     PLAYER MODEL
     ═══════════════════════════════════════════════════════════════ */
  const SKIN = [0xd4a373, 0xc68642, 0xe0ac69, 0x8d5524, 0xf1c27d];
  const PAD  = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
  const SHOE = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 });
  const HELM = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });
  const GLOVE= new THREE.MeshStandardMaterial({ color: 0x1e40af, roughness: 0.5 });

  function makePlayer(opts){
    opts = opts || {};
    const jersey = opts.jersey || 0x0284c7;
    const isBat = !!opts.batsman;
    const isKeeper = !!opts.keeper;
    const skin = SKIN[(opts.skinIndex || 0) % SKIN.length];
    const rig = new THREE.Group();
    rig.jerseyMat = new THREE.MeshStandardMaterial({ color: jersey, roughness: 0.55 });
    rig.skinMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.55 });
    rig.idlePhase = Math.random() * Math.PI * 2;
    rig.fidget = 1.4 + Math.random() * 1.2;

    const shadowCv = document.createElement('canvas');
    shadowCv.width = shadowCv.height = 64;
    const sctx = shadowCv.getContext('2d');
    const sgrad = sctx.createRadialGradient(32, 32, 3, 32, 32, 32);
    sgrad.addColorStop(0, 'rgba(0,0,0,.68)');
    sgrad.addColorStop(1, 'rgba(0,0,0,0)');
    sctx.fillStyle = sgrad; sctx.fillRect(0, 0, 64, 64);
    const shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(1.1, 0.8),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCv), transparent: true, depthWrite: false })
    );
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.028; rig.add(shadow);

    function buildLeg(xOff){
      const leg = new THREE.Group();
      leg.position.set(xOff, 0.82, 0);
      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.092, 0.078, 0.38, 8), rig.jerseyMat);
      thigh.position.y = -0.19; thigh.castShadow = true; leg.add(thigh);
      const knee = new THREE.Mesh(new THREE.SphereGeometry(0.082, 10, 10), isBat ? PAD : rig.jerseyMat);
      knee.position.y = -0.38; leg.add(knee);
      const shin = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.40, 0.16), isBat ? PAD : rig.jerseyMat);
      shin.position.set(0, -0.58, 0.02); shin.castShadow = true; leg.add(shin);
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.25), SHOE);
      foot.position.set(0, -0.78, 0.04); foot.castShadow = true; leg.add(foot);
      leg.userData = { thigh, shin };
      return leg;
    }
    rig.legL = buildLeg(-0.13); rig.legR = buildLeg(0.13);
    rig.add(rig.legL); rig.add(rig.legR);

    const torso = new THREE.Group();
    torso.position.y = 0.91;
    const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.18, 0.22), PAD);
    pelvis.castShadow = true; torso.add(pelvis);
    const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.18, 0.54, 12), rig.jerseyMat);
    chest.position.y = 0.34; chest.castShadow = true; torso.add(chest);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), rig.skinMat);
    head.position.y = 0.77; head.castShadow = true; torso.add(head);
    if (isBat || isKeeper){
      const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.145, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.68), HELM);
      helmet.position.y = 0.79; torso.add(helmet);
    }

    function buildArm(xOff){
      const arm = new THREE.Group();
      arm.position.set(xOff, 0.51, 0);
      const bicep = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.32, 8), rig.jerseyMat);
      bicep.position.y = -0.16; arm.add(bicep);
      const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.045, 0.30, 8), rig.skinMat);
      forearm.position.y = -0.44; arm.add(forearm);
      if (isBat || isKeeper){
        const glove = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.09), GLOVE);
        glove.position.y = -0.62; arm.add(glove);
      }
      return arm;
    }
    rig.armL = buildArm(-0.28); rig.armR = buildArm(0.28);
    torso.add(rig.armL); torso.add(rig.armR);

    if (isBat){
      const batPivot = new THREE.Group();
      batPivot.position.set(0, 0.14, 0.25);
      const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.36, 8), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 }));
      grip.position.y = 0.18; batPivot.add(grip);
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.88, 0.05), new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.35 }));
      blade.position.y = -0.38; blade.castShadow = true; batPivot.add(blade);
      torso.add(batPivot);
      rig.batPivot = batPivot;
    }
    rig.add(torso);
    rig.torso = torso;
    rig.head = head;
    const s = 0.96 + Math.random() * 0.08;
    rig.scale.set(s, s, s);
    return rig;
  }

  class Fielder {
    constructor(name, x, z, skinIdx){
      this.name = name;
      this.home = new THREE.Vector3(x, 0, z);
      this.target = this.home.clone();
      this.state = 'idle';
      this.throwTimer = 0;
      this.rig = makePlayer({ jersey: 0xdc2626, skinIndex: skinIdx });
      this.rig.position.copy(this.home);
      this.rig.rotation.y = Math.atan2(this.home.x, this.home.z);
      scene.add(this.rig);
    }
    reset(){ this.state = 'returning'; this.target.copy(this.home); }
    chase(p){ this.state = 'chasing'; this.target.copy(p); }
    update(dt, t){
      if (this.state === 'idle'){
        const sway = Math.sin(t * this.rig.fidget + this.rig.idlePhase);
        this.rig.torso.rotation.y = sway * 0.08;
        this.rig.armL.rotation.x = -0.2 + sway * 0.06;
        this.rig.armR.rotation.x = -0.2 - sway * 0.06;
        return;
      }
      const dist = this.rig.position.distanceTo(this.target);
      if (this.state === 'chasing'){
        if (dist > 0.5){
          const dir = new THREE.Vector3().subVectors(this.target, this.rig.position).normalize();
          this.rig.position.addScaledVector(dir, 10 * dt);
          this.rig.lookAt(this.target.x, this.rig.position.y, this.target.z);
          this.rig.torso.rotation.x = 0.2;
          const cycle = Math.sin(t * 18);
          this.rig.legL.userData.thigh.rotation.x = cycle * 0.8;
          this.rig.legR.userData.thigh.rotation.x = -cycle * 0.8;
          this.rig.armL.rotation.x = -cycle * 0.9;
          this.rig.armR.rotation.x = cycle * 0.9;
          this.rig.position.y = Math.abs(Math.sin(t * 18)) * 0.05;
        } else { this.state = 'throwing'; this.throwTimer = 0; }
      } else if (this.state === 'throwing'){
        this.throwTimer += dt;
        this.rig.legL.userData.thigh.rotation.x = 0;
        this.rig.legR.userData.thigh.rotation.x = 0;
        this.rig.position.y = 0;
        if (this.throwTimer < 0.25){
          this.rig.torso.rotation.x = THREE.MathUtils.lerp(0.2, 0.8, this.throwTimer/0.25);
          this.rig.armR.rotation.x = THREE.MathUtils.lerp(0, 1.5, this.throwTimer/0.25);
        } else if (this.throwTimer < 0.5){
          const p = (this.throwTimer-0.25)/0.25;
          this.rig.torso.rotation.x = THREE.MathUtils.lerp(0.8, -0.2, p);
          this.rig.armR.rotation.x = THREE.MathUtils.lerp(1.5, -2.0, p);
        } else if (this.throwTimer < 0.7){
          const p = (this.throwTimer-0.5)/0.2;
          this.rig.armR.rotation.x = THREE.MathUtils.lerp(-2.0, 1.5, p);
        } else if (this.throwTimer > 1.2){ this.reset(); }
      } else if (this.state === 'returning'){
        if (dist > 0.5){
          const dir = new THREE.Vector3().subVectors(this.target, this.rig.position).normalize();
          this.rig.position.addScaledVector(dir, 6 * dt);
          this.rig.lookAt(this.target.x, this.rig.position.y, this.target.z);
          this.rig.torso.rotation.x = 0.1;
          const cycle = Math.sin(t * 12);
          this.rig.legL.userData.thigh.rotation.x = cycle * 0.5;
          this.rig.legR.userData.thigh.rotation.x = -cycle * 0.5;
          this.rig.armL.rotation.x = -cycle * 0.5;
          this.rig.armR.rotation.x = cycle * 0.5;
        } else {
          this.state = 'idle';
          this.rig.position.y = 0;
          this.rig.torso.rotation.set(0,0,0);
          this.rig.legL.userData.thigh.rotation.x = 0;
          this.rig.legR.userData.thigh.rotation.x = 0;
          this.rig.armL.rotation.x = 0;
          this.rig.armR.rotation.x = 0;
          this.rig.rotation.y = Math.atan2(this.home.x, this.home.z);
        }
      }
    }
  }

  const fielderData = [
    ['Slip',3.2,13.5,1],['Gully',7.0,12.0,2],['Point',18.0,7.5,3],
    ['Cover',20.0,-2.0,4],['Mid-off',7.5,-9.5,0],['Mid-on',-7.5,-9.5,1],
    ['Mid-wkt',-19.0,0.0,2],['Sq Leg',-18.0,8.0,3],['Fine Leg',-35.0,24.0,4]
  ];
  const fielders = fielderData.map(f => new Fielder(f[0], f[1], f[2], f[3]));

  const strikerBat = makePlayer({ jersey: 0x0284c7, batsman: true, skinIndex: 0 });
  scene.add(strikerBat);
  const nonStrikerBat = makePlayer({ jersey: 0x0284c7, batsman: true, skinIndex: 2 });
  scene.add(nonStrikerBat);
  const bowler = makePlayer({ jersey: 0xdc2626, skinIndex: 3 });
  scene.add(bowler);
  const keeper = makePlayer({ jersey: 0xdc2626, keeper: true, skinIndex: 1 });
  keeper.position.set(0, 0, 14.5);
  keeper.rotation.y = Math.PI;
  scene.add(keeper);

  let currentBowlerName = '';
  function bowlerHash(name){
    let h = 5381;
    const s = String(name || 'Bowler');
    for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
    return h;
  }
  function applyBowlerIdentity(name){
    if (name === currentBowlerName) return false;
    currentBowlerName = name;
    const h = bowlerHash(name);
    const brightness = 0.78 + ((h % 44) / 100);
    const baseColor = new THREE.Color(0xdc2626);
    baseColor.multiplyScalar(brightness);
    bowler.jerseyMat.color.copy(baseColor);

    const skinIdx = h % SKIN.length;
    bowler.skinMat.color.setHex(SKIN[skinIdx]);

    const el = document.getElementById('bbBowler');
    if (el){
      el.classList.add('bowler-flash');
      setTimeout(function(){ el.classList.remove('bowler-flash'); }, 1200);
    }
    return true;
  }
  function resetBowlerToRunUp(){
    bowler.position.set(1.5, 0, -22);
    bowler.rotation.y = 0;
    bowler.torso.rotation.set(0,0,0);
    bowler.armL.rotation.x = 0;
    bowler.armR.rotation.x = 0;
    bowler.legL.userData.thigh.rotation.x = 0;
    bowler.legR.userData.thigh.rotation.x = 0;
    bowler.position.y = 0;

  function determineShotAndLength(runs, isSpin, isWkt, isCatch, wwAngle){
    const lengths = [{type:'yorker',pZ:8.5},{type:'full',pZ:7.5},{type:'good',pZ:5.5},{type:'short',pZ:2.5}];
    let length = lengths[Math.floor(Math.random() * lengths.length)];
    if (isSpin) length = { type: 'good', pZ: 4.8 };
    let shotType = 'defend', peakHeight = 0.5, finalDist = 10;
    let deg = (wwAngle * 180) / Math.PI;
    if (deg < 0) deg += 360;
    const isOffside = (deg > 0 && deg < 180);
    const isStraight = (deg > 140 && deg < 220);
    const isBehind = (deg < 40 || deg > 320);
    if (isWkt && !isCatch){ shotType = 'defend'; finalDist = 2; }
    else if (runs === 6){
      peakHeight = 15; finalDist = 75 + Math.random() * 10;
      if (isSpin && !isOffside) shotType = 'sweep';
      else if (length.type === 'short' && !isOffside) shotType = 'pull';
      else shotType = 'lofted_straight';
    } else if (runs === 4){
      peakHeight = 1.2; finalDist = 65;
      if (isSpin && !isOffside) shotType = 'sweep';
      else if (isOffside && length.type === 'short') shotType = 'cut';
      else if (isOffside && !isBehind) shotType = 'cover_drive';
      else if (isStraight) shotType = 'straight_drive';
      else shotType = 'pull';
    } else if (runs > 0){
      peakHeight = 0.8; finalDist = 15 + (runs * 10);
      if (isOffside && !isBehind) shotType = 'cover_drive';
      else if (isStraight) shotType = 'on_drive';
      else shotType = 'glance';
    } else {
      peakHeight = 0.3; finalDist = 10;
      shotType = Math.random() > 0.3 ? 'defend' : 'leave';

  function isInningsOrMatchOver(m){

      const s = m.status.toLowerCase().trim();

    }
    if (typeof m.wickets === 'number' && m.wickets >= 10) return true;
    if (typeof m.oversLimit === 'number' && typeof m.legalBalls === 'number' && m.legalBalls >= m.oversLimit * 6) return true;
    if (typeof m.target === 'number' && typeof m.runs === 'number' && m.runs >= m.target) return true;
    return false;
  }

  window.__cricmaxInningsOver = false;
  let currentMatchState = null;
  let prevLegalBalls = 0;

  function resolveShotAngle(shot){
    if (!shot) return Math.random() * Math.PI * 2;
    const numAngle = (typeof shot.angle === 'number') ? shot.angle : parseFloat(shot.angle);
    if (!isNaN(numAngle) && shot.angle !== null && shot.angle !== undefined){
      return numAngle;
    }
    const zoneNames = ["Third Man","Point","Cover","Mid-off","Mid-on","Mid-wicket","Square Leg","Fine Leg"];
    let zoneIdx = -1;
    if (typeof shot.zoneIndex === 'number' && shot.zoneIndex >= 0 && shot.zoneIndex < 8){
      zoneIdx = shot.zoneIndex;
    } else if (typeof shot.zone === 'string' && shot.zone){
      zoneIdx = zoneNames.findIndex(z => z.toLowerCase() === shot.zone.toLowerCase());
    }
    if (zoneIdx >= 0) return (zoneIdx * Math.PI / 4) + (Math.PI / 8);
    if (typeof shot.ballRandom === 'number') return shot.ballRandom * Math.PI * 2;
    return Math.random() * Math.PI * 2;
  }

  /* ═══════════════════════════════════════════════════════════════
     WAGON WHEEL
     ═══════════════════════════════════════════════════════════════ */
  const wagonCanvas = document.getElementById('wagonWheelCanvas');
  let wagonCtx = null;
  try { wagonCtx = wagonCanvas ? wagonCanvas.getContext('2d') : null; } catch(e) { console.warn('wagon ctx error:', e); }

  if (wagonCanvas && CM_DEVICE.isMobile){
    const targetSize = CM_DEVICE.tier === 0 ? 480 : 640;
    wagonCanvas.width = targetSize;
    wagonCanvas.height = targetSize;
  }

  let __cmWagonDirty = true;
  let __cmWagonForceUntil = 0;

  const overShots = [];
  const MAX_SHOTS_PER_OVER = 6;
  let lastOverNum = -1;
  const ANIM_DURATION = 900;
  const TRAIL_HOLD    = 1400;

  const FIELDER_MARKERS = [
    { name:'Slip',     angle:  2.65, dist: 0.55 },
    { name:'Gully',    angle:  2.35, dist: 0.55 },
    { name:'Point',    angle:  1.57, dist: 0.85 },
    { name:'Cover',    angle:  0.96, dist: 0.85 },
    { name:'Mid-off',  angle:  0.44, dist: 0.62 },
    { name:'Mid-on',   angle: -0.44, dist: 0.62 },
    { name:'Mid-wkt',  angle: -1.57, dist: 0.85 },
    { name:'Sq Leg',   angle: -1.92, dist: 0.85 },
    { name:'Fine Leg', angle: -2.55, dist: 0.92 }
  ];

  function recordShotForWagon(angle, runs, isWicket){
    const now = performance.now();
    overShots.push({ angle: angle, runs: runs, isWicket: !!isWicket, startTime: now });
    while (overShots.length > MAX_SHOTS_PER_OVER) overShots.shift();
    __cmWagonDirty = true;
    __cmWagonForceUntil = now + 3000;
    if (!stadiumViewActive) try { drawWagonWheel(); } catch(e){ console.warn('wagon draw err:', e); }
    cmlog('recordShotForWagon → overShots:', overShots.length);
  }

  function clearOverShots(){
    overShots.length = 0;
    __cmWagonDirty = true;
    if (!stadiumViewActive) try { drawWagonWheel(); } catch(e){}
  }

  function checkOverRollover(m){
    if (!m) return;
    const balls = m.legalBalls || 0;
    const overNum = Math.floor(balls / 6);
    if (overNum > lastOverNum){
      const shots = toArray(m.shotLog);
      const newOverShots = shots.filter(function(s){
        return (s.over || 1) === (overNum + 1);
      });
      if (newOverShots.length > 0){
        lastOverNum = overNum;
        replayCurrentOver(shots);
      } else if (overShots.length > 0 && overNum > lastOverNum + 1){
        clearOverShots();
        lastOverNum = overNum;
      } else {
        lastOverNum = overNum;
      }
    } else {
      lastOverNum = overNum;
    }
  }

  function replayCurrentOver(rawShots){
    const shots = toArray(rawShots);
    if (shots.length === 0) {
      cmlog('replayCurrentOver: no shots');
      return;
    }

    overShots.length = 0;

    const last    = shots[shots.length - 1];
    const lastOver = last.over || 1;
    const lastInns = last.inns || 1;

    const currentOverShots = [];
    for (let i = shots.length - 1; i >= 0; i--){
      const s = shots[i];
      if ((s.inns || 1) !== lastInns) break;
      if ((s.over || 1) !== lastOver) break;
      currentOverShots.unshift(s);
    }

    const now = performance.now();
    currentOverShots.forEach(function(s, i){
      const stagger = (currentOverShots.length - 1 - i) * 90;
      overShots.push({
        angle:     resolveShotAngle(s),
        runs:      s.runs || 0,
        isWicket:  !!(s.isWicket || s.isOut),
        startTime: now - stagger
      });
    });

    while (overShots.length > MAX_SHOTS_PER_OVER) overShots.shift();

    __cmWagonDirty = true;
    __cmWagonForceUntil = now + 5000;
    if (!stadiumViewActive) try { drawWagonWheel(); } catch(e){}

    cmlog('replayCurrentOver → rebuilt:', overShots.length, 'from', currentOverShots.length, 'shots');
  }

  let __cmFieldCache = null;
  function buildFieldCache(){
    if (!wagonCanvas) return null;
    const c = document.createElement('canvas');
    c.width = wagonCanvas.width;
    c.height = wagonCanvas.height;
    const x = c.getContext('2d');
    const W = c.width, H = c.height;
    const cx = W/2, cy = H/2;
    const R = W/2 - 40;

    const fieldGrad = x.createRadialGradient(cx, cy, 0, cx, cy, R);
    fieldGrad.addColorStop(0.00, '#1f4a24');
    fieldGrad.addColorStop(0.55, '#143419');
    fieldGrad.addColorStop(0.85, '#0e2511');
    fieldGrad.addColorStop(1.00, '#071808');
    x.fillStyle = fieldGrad;
    x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.fill();

    x.globalAlpha = 0.08;
    for (let i = -R; i < R; i += 22){
      x.fillStyle = i % 44 === 0 ? '#ffffff' : '#000000';
      x.fillRect(cx - R, cy + i, R * 2, 11);
    }
    x.globalAlpha = 1;

    x.save();
    x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.clip();

    x.strokeStyle = 'rgba(255,255,255,0.4)';
    x.lineWidth = 2;
    x.setLineDash([10, 8]);
    x.beginPath(); x.arc(cx, cy, R * 0.58, 0, Math.PI * 2); x.stroke();
    x.setLineDash([]);

    const pitchW = 26;
    const pitchLen = R * 1.55;
    const pitchGrad = x.createLinearGradient(cx - pitchW/2, 0, cx + pitchW/2, 0);
    pitchGrad.addColorStop(0, 'rgba(140,110,70,0.35)');
    pitchGrad.addColorStop(0.5, 'rgba(196,168,130,0.75)');
    pitchGrad.addColorStop(1, 'rgba(140,110,70,0.35)');
    x.fillStyle = pitchGrad;
    x.fillRect(cx - pitchW/2, cy - pitchLen/2, pitchW, pitchLen);

    x.strokeStyle = 'rgba(255,255,255,0.7)';
    x.lineWidth = 1.5;
    x.beginPath();
    x.moveTo(cx - 22, cy - R * 0.62); x.lineTo(cx + 22, cy - R * 0.62);
    x.moveTo(cx - 22, cy + R * 0.62); x.lineTo(cx + 22, cy + R * 0.62);
    x.stroke();

    FIELDER_MARKERS.forEach(f => {
      const fx = cx + Math.sin(f.angle) * R * f.dist;
      const fy = cy - Math.cos(f.angle) * R * f.dist;
      x.fillStyle = 'rgba(148, 163, 184, 0.45)';
      x.beginPath(); x.arc(fx, fy, 4, 0, Math.PI * 2); x.fill();
      x.strokeStyle = 'rgba(255,255,255,0.3)';
      x.lineWidth = 1;
      x.beginPath(); x.arc(fx, fy, 4, 0, Math.PI * 2); x.stroke();
    });

    x.restore();

    x.strokeStyle = '#f8fafc';
    x.lineWidth = 4;
    x.shadowBlur = 18;
    x.shadowColor = 'rgba(248,250,252,0.55)';
    x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.stroke();
    x.shadowBlur = 0;

    x.strokeStyle = 'rgba(0,230,118,0.35)';
    x.lineWidth = 2;
    x.setLineDash([4, 6]);
    x.beginPath(); x.arc(cx, cy, R - 6, 0, Math.PI * 2); x.stroke();
    x.setLineDash([]);

    x.fillStyle = 'rgba(255,255,255,0.85)';
    x.font = 'bold 14px sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('N', cx, cy - R - 12);
    x.fillText('S', cx, cy + R + 12);
    x.fillText('E', cx + R + 14, cy);
    x.fillText('W', cx - R - 14, cy);

    const legendItems = [
      { col:'#ff8800', label:'6' },
      { col:'#00e5ff', label:'4' },
      { col:'#00e676', label:'1-3' },
      { col:'#94a3b8', label:'•' },
      { col:'#ef4444', label:'W' }
    ];
    const legendW = 130, legendH = 32;
    const legendX = W - legendW - 14, legendY = H - legendH - 14;
    x.fillStyle = 'rgba(8,15,30,0.85)';
    x.strokeStyle = 'rgba(255,255,255,0.15)';
    x.lineWidth = 1.5;
    roundRect(x, legendX, legendY, legendW, legendH, 10);
    x.fill();
    x.stroke();

    let cursorX = legendX + 14;
    legendItems.forEach(item => {
      x.fillStyle = item.col;
      x.beginPath(); x.arc(cursorX, legendY + legendH/2, 4, 0, Math.PI * 2); x.fill();
      x.fillStyle = 'rgba(255,255,255,0.85)';
      x.font = 'bold 11px sans-serif';
      x.textAlign = 'left';
      x.textBaseline = 'middle';
      x.fillText(item.label, cursorX + 8, legendY + legendH/2);
      cursorX += 24;
    });

    return c;
  }
  function getFieldCache(){
    if (__cmFieldCache) return __cmFieldCache;
    __cmFieldCache = buildFieldCache();
    return __cmFieldCache;
  }

  function drawWagonWheel(){
    try {
      if (!wagonCtx || !wagonCanvas) return;
      const W = wagonCanvas.width;
      const H = wagonCanvas.height;
      const cx = W / 2, cy = H / 2;
      const R = W / 2 - 40;
      const now = performance.now();

      wagonCtx.globalAlpha = 1;
      wagonCtx.shadowBlur = 0;
      wagonCtx.setLineDash([]);
      wagonCtx.textBaseline = 'alphabetic';
      wagonCtx.clearRect(0, 0, W, H);

      const cache = getFieldCache();
      if (cache) wagonCtx.drawImage(cache, 0, 0);

      overShots.forEach((shot) => {
        if (shot.isWicket) return;

        const age = now - shot.startTime;
        const rawProgress = Math.min(1, age / ANIM_DURATION);
        const progress = 1 - Math.pow(1 - rawProgress, 3);

        let targetLen;
        if (shot.runs === 6) targetLen = 1.22;
        else if (shot.runs === 4) targetLen = 1.00;
        else if (shot.runs === 3) targetLen = 0.78;
        else if (shot.runs === 2) targetLen = 0.58;
        else if (shot.runs === 1) targetLen = 0.40;
        else targetLen = 0.14;

        const len = targetLen * progress;
        const sx = cx + Math.sin(shot.angle) * R * len;
        const sy = cy - Math.cos(shot.angle) * R * len;

        const col = shot.runs >= 6 ? '#ff8800'
                  : shot.runs >= 4 ? '#00e5ff'
                  : shot.runs > 0  ? '#00e676'
                  : '#94a3b8';
        const glow = shot.runs >= 6 ? 'rgba(255,136,0,0.9)'
                   : shot.runs >= 4 ? 'rgba(0,229,255,0.9)'
                   : shot.runs > 0  ? 'rgba(0,230,118,0.85)'
                   : 'rgba(148,163,184,0.5)';

        if (shot.runs === 0){
          const dotAlpha = age < TRAIL_HOLD ? 1 : Math.max(0, 1 - (age - TRAIL_HOLD) / 1200);
          if (dotAlpha > 0.05){
            wagonCtx.globalAlpha = dotAlpha;
            wagonCtx.fillStyle = '#94a3b8';
            wagonCtx.shadowColor = 'rgba(148,163,184,0.6)';
            wagonCtx.shadowBlur = 8;
            wagonCtx.beginPath();
            wagonCtx.arc(cx + Math.sin(shot.angle) * 26, cy - Math.cos(shot.angle) * 26, 4, 0, Math.PI * 2);
            wagonCtx.fill();
            wagonCtx.shadowBlur = 0;
            wagonCtx.globalAlpha = 1;
          }
          return;
        }

        const grad = wagonCtx.createLinearGradient(cx, cy, sx, sy);
        grad.addColorStop(0.00, col + '05');
        grad.addColorStop(0.25, col + 'cc');
        grad.addColorStop(0.70, col + 'ff');
        grad.addColorStop(1.00, col + 'ff');

        wagonCtx.globalAlpha = 0.92;
        wagonCtx.strokeStyle = grad;
        wagonCtx.lineWidth = shot.runs >= 6 ? 6
                           : shot.runs >= 4 ? 5
                           : 3.5;
        wagonCtx.lineCap = 'round';
        wagonCtx.shadowBlur = 16;
        wagonCtx.shadowColor = glow;
        wagonCtx.beginPath();
        wagonCtx.moveTo(cx, cy);
        wagonCtx.lineTo(sx, sy);
        wagonCtx.stroke();
        wagonCtx.globalAlpha = 1;

        const ballAlpha = age < TRAIL_HOLD ? 1 : Math.max(0, 1 - (age - TRAIL_HOLD) / 1200);
        if (ballAlpha > 0.05){
          wagonCtx.globalAlpha = ballAlpha * 0.7;
          wagonCtx.fillStyle = glow;
          wagonCtx.beginPath(); wagonCtx.arc(sx, sy, shot.runs >= 4 ? 14 : 10, 0, Math.PI * 2); wagonCtx.fill();

          wagonCtx.globalAlpha = ballAlpha;
          wagonCtx.fillStyle = '#ffffff';
          wagonCtx.beginPath(); wagonCtx.arc(sx, sy, shot.runs >= 4 ? 8 : 6, 0, Math.PI * 2); wagonCtx.fill();

          wagonCtx.fillStyle = col;
          wagonCtx.beginPath(); wagonCtx.arc(sx, sy, shot.runs >= 4 ? 5 : 3.5, 0, Math.PI * 2); wagonCtx.fill();
          wagonCtx.globalAlpha = 1;
        }

        if (progress > 0.6){
          const labelRadius = R * len + 26;
          const lx = cx + Math.sin(shot.angle) * labelRadius;
          const ly = cy - Math.cos(shot.angle) * labelRadius;
          const label = String(shot.runs);

          wagonCtx.globalAlpha = 0.95;
          wagonCtx.font = 'bold 20px sans-serif';
          wagonCtx.textAlign = 'center';
          wagonCtx.textBaseline = 'middle';
          wagonCtx.fillStyle = 'rgba(0,0,0,0.7)';
          wagonCtx.fillText(label, lx + 1, ly + 2);
          wagonCtx.fillStyle = col;
          wagonCtx.fillText(label, lx, ly);
          wagonCtx.globalAlpha = 1;
        }

        wagonCtx.shadowBlur = 0;
      });

      const wicketShots = overShots.filter(s => s.isWicket);
      const wicketCount = wicketShots.length;
      wicketShots.forEach((shot, idx) => {
        const spread = 26;
        const offsetBase = (wicketCount > 1) ? -((wicketCount - 1) * spread) / 2 : 0;
        const wx = cx + offsetBase + idx * spread;
        const wy = cy - R * 0.18;

        wagonCtx.globalAlpha = 0.95;
        wagonCtx.shadowColor = '#ef4444';
        wagonCtx.shadowBlur = 18;

        wagonCtx.fillStyle = '#ef4444';
        wagonCtx.beginPath(); wagonCtx.arc(wx, wy, 11, 0, Math.PI * 2); wagonCtx.fill();

        wagonCtx.shadowBlur = 0;
        wagonCtx.strokeStyle = '#ffffff';
        wagonCtx.lineWidth = 2;
        wagonCtx.beginPath(); wagonCtx.arc(wx, wy, 11, 0, Math.PI * 2); wagonCtx.stroke();

        wagonCtx.fillStyle = '#ffffff';
        wagonCtx.font = 'bold 14px sans-serif';
        wagonCtx.textAlign = 'center';
        wagonCtx.textBaseline = 'middle';
        wagonCtx.fillText('W', wx, wy + 1);

        wagonCtx.globalAlpha = 1;
        wagonCtx.shadowBlur = 0;
      });

      wagonCtx.shadowBlur = 22;
      wagonCtx.shadowColor = 'rgba(0,230,118,0.9)';
      wagonCtx.fillStyle = '#00e676';
      wagonCtx.beginPath(); wagonCtx.arc(cx, cy, 12, 0, Math.PI * 2); wagonCtx.fill();
      wagonCtx.shadowBlur = 0;
      wagonCtx.fillStyle = '#0a0e1a';
      wagonCtx.beginPath(); wagonCtx.arc(cx, cy, 6, 0, Math.PI * 2); wagonCtx.fill();
      wagonCtx.fillStyle = '#00e676';
      wagonCtx.beginPath(); wagonCtx.arc(cx, cy, 2.5, 0, Math.PI * 2); wagonCtx.fill();

      wagonCtx.fillStyle = 'rgba(8,15,30,0.85)';
      wagonCtx.strokeStyle = 'rgba(0,230,118,0.5)';
      wagonCtx.lineWidth = 1.5;
      const badgeW = 130, badgeH = 32;
      const badgeX = 14, badgeY = 14;
      roundRect(wagonCtx, badgeX, badgeY, badgeW, badgeH, 10);
      wagonCtx.fill();
      wagonCtx.stroke();

      wagonCtx.fillStyle = '#00e676';
      wagonCtx.font = 'bold 12px sans-serif';
      wagonCtx.textAlign = 'left';
      wagonCtx.textBaseline = 'middle';
      wagonCtx.fillText('THIS OVER', badgeX + 12, badgeY + 12);

      wagonCtx.fillStyle = '#ffffff';
      wagonCtx.font = 'bold 16px sans-serif';
      wagonCtx.fillText(overShots.length + ' / ' + MAX_SHOTS_PER_OVER, badgeX + 12, badgeY + 22);

      for (let i = 0; i < MAX_SHOTS_PER_OVER; i++){
        const dotX = badgeX + 78 + i * 8;
        const dotY = badgeY + 22;
        if (i < overShots.length){
          const s = overShots[i];
          wagonCtx.fillStyle = s.isWicket ? '#ef4444'
                           : s.runs >= 6 ? '#ff8800'
                           : s.runs >= 4 ? '#00e5ff'
                           : s.runs > 0  ? '#00e676'
                           : '#94a3b8';
        } else {
          wagonCtx.fillStyle = 'rgba(255,255,255,0.2)';
        }
        wagonCtx.beginPath(); wagonCtx.arc(dotX, dotY, 3, 0, Math.PI * 2); wagonCtx.fill();
      }

      if (CM_DEBUG){
        wagonCtx.fillStyle = '#ff6d00';
        wagonCtx.font = 'bold 12px monospace';
        wagonCtx.fillText('shots:' + overShots.length, 20, 60);
      }

      __cmWagonDirty = false;
    } catch (e) {
      console.error('[CricMax] drawWagonWheel error:', e);
    }
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function toggleWagonWheel(){ setStadiumView(!stadiumViewActive); }

  /* ═══════════════════════════════════════════════════════════════
     DELIVERY ENGINE
     ═══════════════════════════════════════════════════════════════ */
  let anim = null;
  let lastShot = null;

  function playBall(shot, skipWagonRecord){
    if (shot && shot.__isReplay) delete shot.__isReplay;
    if (anim) cancelAnimationFrame(anim);
    initAudio();
    lastShot = shot;

    strikerWicket.reset(); bowlerWicket.reset();
    fielders.forEach(f => f.reset());
    ball.visible = true;
    if (window.fxTrailStop) window.fxTrailStop();

    resetBowlerToRunUp();

    strikerBat.position.set(0.35, 0, 8.8);
    strikerBat.rotation.set(0, -Math.PI/2, 0);
    if (strikerBat.batPivot) strikerBat.batPivot.rotation.set(-Math.PI/4, 0, 0);
    strikerBat.torso.rotation.set(0,0,0);
    strikerBat.head.rotation.y = 0;
    strikerBat.legL.userData.thigh.rotation.x = 0;
    strikerBat.legR.userData.thigh.rotation.x = 0;
    strikerBat.armL.rotation.x = 0;
    strikerBat.armR.rotation.x = 0;

    nonStrikerBat.position.set(-1.2, 0, -8.8);
    nonStrikerBat.rotation.set(0, Math.PI/2, 0);
    RunningState.active = false;

    const runs = shot.runs || 0;
    const isWkt = shot.isWicket || shot.isOut;
    const isCatch = shot.isCatch || shot.wicketType === 'caught';
    const bowlerType = shot.bowlerType || 'fast_pace';
    const isSpin = bowlerType === 'spin' || bowlerType === 'off_spin' || bowlerType === 'leg_spin';

    const wwAngle = resolveShotAngle(shot);

    const phys = determineShotAndLength(runs, isSpin, isWkt, isCatch, wwAngle);
    const animPose = SHOT_KINEMATICS[phys.shotType] || SHOT_KINEMATICS.defend;

    const pitchZ = phys.length.pZ;
    const pitchX = (Math.random() - 0.5) * 0.4;
    const hitX = 0.35 + Math.sin(wwAngle) * phys.finalDist;
    const hitZ = 8.8 - Math.cos(wwAngle) * phys.finalDist;

    if (!skipWagonRecord){
      recordShotForWagon(wwAngle, runs, !!(isWkt || isCatch));
    }

    let runningPending = (runs > 0 && runs < 4 && !isWkt);
    let runningStarted = false;
    const RUNNING_START_DELAY = 200;

    const hitPoint = new THREE.Vector3(hitX, 0, hitZ);
    let fielderDispatched = false;

    const speedVal = shot.ballSpeed || (isSpin ? (85 + Math.random()*10).toFixed(1) : (135 + Math.random()*15).toFixed(1));
    const sTag = document.getElementById('speedTag');
    if (sTag){ sTag.innerText = 'SPEED: ' + speedVal; sTag.classList.add('on'); }

    const T_RELEASE = 700, T_PITCH = 1000, T_CONTACT = 1250;
    const flightTime = (runs === 6) ? 4000 : (runs === 4) ? 2500 : 3000;
    const T_END = T_CONTACT + Math.max(flightTime, animPose.followTime + 400);
    const T_SHOT_START = T_CONTACT - animPose.prepTime;
    const T_FOLLOW_END = T_CONTACT + animPose.followTime;

    const start = performance.now();
    let bounced = false, contacted = false;
    let releaseThudPlayed = false;

    function loop(now){
      const elapsed = now - start;

      if (strikerBat.batPivot && !isWkt){
        const pose = animPose.pose;
        if (elapsed >= T_SHOT_START && elapsed < T_CONTACT){
          const p = (elapsed - T_SHOT_START) / animPose.prepTime;
          strikerBat.batPivot.rotation.x = THREE.MathUtils.lerp(-Math.PI/4, pose.batX, p);
          strikerBat.batPivot.rotation.z = THREE.MathUtils.lerp(0, pose.batZ, p);
          strikerBat.torso.rotation.y = THREE.MathUtils.lerp(0, pose.torsoY, p);
          strikerBat.torso.rotation.x = THREE.MathUtils.lerp(0, pose.lean, p);
          strikerBat.legL.userData.thigh.rotation.x = THREE.MathUtils.lerp(0, -pose.stride, p);
          if (pose.dropKnee) strikerBat.position.y = THREE.MathUtils.lerp(0, -0.3, p);
        } else if (elapsed >= T_CONTACT && elapsed < T_FOLLOW_END){
          const p = (elapsed - T_CONTACT) / animPose.followTime;
          strikerBat.batPivot.rotation.x = THREE.MathUtils.lerp(pose.batX, pose.batX + 0.5, p);
          if (pose.dropKnee) strikerBat.position.y = THREE.MathUtils.lerp(-0.3, 0, p);
        }
      }

      if (elapsed < T_RELEASE){
        const t = elapsed / T_RELEASE;
        bowler.position.x = THREE.MathUtils.lerp(1.5, 0.55, t);
        bowler.position.z = THREE.MathUtils.lerp(-22, -9.8, t);
        bowler.armR.rotation.x = -Math.PI * 4 * t;
        bowler.armL.rotation.x = Math.PI * 4 * t;
        ball.position.set(bowler.position.x + 0.3, 2.0, bowler.position.z);
        if (!releaseThudPlayed && (isWkt || isCatch || runs >= 4)){
          releaseThudPlayed = true;
          playThud(0.55);
        }
      } else if (elapsed < T_PITCH){
        const t = (elapsed - T_RELEASE) / (T_PITCH - T_RELEASE);
        ball.position.x = THREE.MathUtils.lerp(0.55, pitchX, t);
        ball.position.z = THREE.MathUtils.lerp(-9.8, pitchZ, t);
        ball.position.y = THREE.MathUtils.lerp(2.0, 0.04, t * t);
      } else if (elapsed < T_CONTACT){
        const t = (elapsed - T_PITCH) / (T_CONTACT - T_PITCH);
        if (!bounced){ playThud(1.0); bounced = true; if (window.fxDustPuff) window.fxDustPuff(ball.position.x, 0.05, ball.position.z); }
        ball.position.x = THREE.MathUtils.lerp(pitchX, strikerBat.position.x - 0.1, t);
        ball.position.z = THREE.MathUtils.lerp(pitchZ, 8.8, t);
        ball.position.y = 0.04 + Math.sin(t * Math.PI * 0.5) * 0.9;
      } else if (elapsed < T_END){
        const t = (elapsed - T_CONTACT) / flightTime;
        if (!contacted){
          contacted = true;
          if (isWkt && !isCatch){ playStumps(); strikerWicket.shatter(); }
          else if (phys.shotType !== 'leave') playBatCrack((runs===6)? 1 : (runs===4)? 0.85 : 0.5);
          const sparkColor = isWkt ? 0xff4444 : runs >= 6 ? 0xff6d00 : runs >= 4 ? 0x22d3ee : 0xffcc44;
          if (window.fxSparkBurst) window.fxSparkBurst(ball.position.x, ball.position.y, ball.position.z, sparkColor);
          if (runs > 0 && window.fxTrailStart) window.fxTrailStart();
          if (runs > 0 && runs < 4 && !isWkt && !fielderDispatched){
            fielderDispatched = true;
            let closest = fielders[0], minD = 9999;
            fielders.forEach(f => {
              const d = f.home.distanceTo(hitPoint);
              if (d < minD){ minD = d; closest = f; }
            });
            if (closest) closest.chase(hitPoint);
          }
          if (audioMode === 'commentary'){
            setTimeout(function(){
              speakCommentary(buildCommentaryLine(Object.assign({}, shot, { ballSpeed: speedVal })));
            }, 220);
          }
          if (audioMode === 'stadium' && (isWkt || isCatch || runs >= 4)){
            crowdRoar(runs >= 6 ? 1.25 : 1);
          }
        }
        if (runningPending && !runningStarted && elapsed >= T_CONTACT + RUNNING_START_DELAY){
          runningStarted = true;
          RunningState.active = true;
          RunningState.totalRuns = runs;
          RunningState.progress = 0;
        }
        if (directorOn){
          if (runs >= 4){
            camPos.lerp(new THREE.Vector3(ball.position.x * 0.4, 14, ball.position.z - 20), 0.05);
            camTarget.lerp(ball.position, 0.08);
          } else if (isWkt){
            camPos.lerp(new THREE.Vector3(0, 2.2, 14.5), 0.06);
            camTarget.lerp(new THREE.Vector3(0, 1.2, 8.8), 0.08);
          }
        }
        if (isWkt && !isCatch){
          ball.position.set(0.1, 0.3, 10.4);
        } else {
          ball.position.x = THREE.MathUtils.lerp(strikerBat.position.x, hitX, t);
          ball.position.z = THREE.MathUtils.lerp(8.8, hitZ, t);
          ball.position.y = 0.05 + 4 * phys.peakHeight * t * (1 - t);
        }
      } else {
        if (!RunningState.active){
          anim = null; ball.visible = false;
          if (window.fxTrailStop) window.fxTrailStop();
          if (sTag) sTag.classList.remove('on');
          resetBowlerToRunUp();
          if (!stadiumViewActive) try { drawWagonWheel(); } catch(e){}
          return;
        }
        if (elapsed >= T_END + 3000){
          anim = null; ball.visible = false;
          if (window.fxTrailStop) window.fxTrailStop();
          if (sTag) sTag.classList.remove('on');
          resetBowlerToRunUp();
          if (!stadiumViewActive) try { drawWagonWheel(); } catch(e){}
          return;
        }
      }
      window.__cricmaxBallPos = ball.position;
      anim = requestAnimationFrame(loop);
    }
    anim = requestAnimationFrame(loop);

    setTimeout(() => {
      const b = document.getElementById('banner');
      if (!b) return;
      b.className = 'banner on';
      if (isCatch){ b.innerText = 'WHAT A CATCH!'; b.classList.add('wkt'); }
      else if (isWkt){ b.innerText = 'BOWLED!'; b.classList.add('wkt'); }
      else if (runs===6){ b.innerText = 'MAXIMUM!'; b.classList.add('six'); }
      else if (runs===4){ b.innerText = 'FOUR!'; b.classList.add('four'); }
      else { b.innerText = runs > 0 ? runs + ' RUNS' : 'DOT BALL'; b.classList.add('run'); }
      setTimeout(() => b.classList.remove('on'), 2400);
    }, 1300);
  }

  /* ═══════════════════════════════════════════════════════════════
     SCORECARD RENDERING
     ═══════════════════════════════════════════════════════════════ */
  function renderOverDots(ballTags){
    const container = document.getElementById('overDotsContainer');
    const totalEl = document.getElementById('overTotalRuns');
    if (!container) return;
    container.innerHTML = '';
    let overRuns = 0;
    const tags = toArray(ballTags);
    for (let i = 0; i < 6; i++){
      const tag = tags[i] !== undefined && tags[i] !== null ? String(tags[i]) : null;
      const dot = document.createElement('div');
      dot.className = 'b dot';
      if (tag !== null && tag !== ''){
        const isWkt = tag.indexOf('W') >= 0;
        const isWd = tag.indexOf('Wd') >= 0;
        const isNb = tag.indexOf('Nb') >= 0;
        const isBye = /B$/.test(tag) && !isNb;
        const isLb = /Lb$/i.test(tag);
        if (isWkt){ dot.className = 'b wkt'; dot.innerText = 'W'; }
        else if (isWd){ const n = parseInt(tag) || 1; dot.className = 'b nb'; dot.innerText = n > 1 ? String(n) : 'wd'; overRuns += n; }
        else if (isNb){ const n = parseInt(tag) || 1; dot.className = 'b nb'; dot.innerText = n > 1 ? String(n) : 'nb'; overRuns += n; }
        else if (isBye || isLb){ const n = parseInt(tag) || 0; dot.className = 'b bye'; dot.innerText = n > 0 ? String(n) : 'b'; overRuns += n; }
        else if (tag === '4'){ dot.className = 'b four'; dot.innerText = '4'; overRuns += 4; }
        else if (tag === '6'){ dot.className = 'b six'; dot.innerText = '6'; overRuns += 6; }
        else { const n = parseInt(tag) || 0; if (n === 0){ dot.className = 'b dot'; dot.innerText = '0'; } else { dot.className = 'b run'; dot.innerText = String(n); overRuns += n; } }
      } else { dot.innerText = '·'; }
      container.appendChild(dot);
    }
    if (totalEl) totalEl.innerText = overRuns + ' R';
  }

  function applyMatch(raw){
    if (!raw) return;
    currentMatchState = raw;
    window.__cricmaxLastMatch = raw;

    const _shotLog         = toArray(raw.shotLog);
    const _currentOverBalls = toArray(raw.currentOverBalls);
    const _recentBalls     = toArray(raw.recentBalls);

    let m = raw;
    if (raw.innings1 || raw.innings2){
      const innNum = raw.currentInnings || 1;
      const inn = innNum === 2 ? (raw.innings2 || raw.innings1) : (raw.innings1 || raw.innings2);
      if (inn){
        const bt = inn.team || raw.teamBatting || '';
        m = Object.assign({}, raw, {
          runs: inn.runs || 0, wickets: inn.wickets || 0, legalBalls: inn.balls || 0,
          teamBatting: bt,
          teamBattingAbbr: (raw.teamBattingAbbr || bt.substring(0,3).toUpperCase()),
          batters: inn.batters || raw.batters || {},
          bowlers: inn.bowlers || raw.bowlers || {}
        });
      }
    }

    m.shotLog          = _shotLog;
    m.currentOverBalls = _currentOverBalls;
    m.recentBalls      = _recentBalls;

    checkOverRollover(m);

    const curLB = m.legalBalls || 0;
    if (prevLegalBalls > 0 && curLB < prevLegalBalls) window.__cricmaxInningsOver = false;
    prevLegalBalls = curLB;

    const over = isInningsOrMatchOver(m);
    if (over !== window.__cricmaxInningsOver) window.__cricmaxInningsOver = over;

    const abbr = m.teamBattingAbbr || (m.teamBatting ? m.teamBatting.substring(0,3).toUpperCase() : 'T1');
    const balls = m.legalBalls || 0;
    const setTxt = (id, v) => { const el = document.getElementById(id); if (el) el.innerText = v; };

    setTxt('bbAbbr', abbr);
    setTxt('bbScore', (m.runs || 0) + '/' + (m.wickets || 0));
    setTxt('bbOvers', '(' + Math.floor(balls / 6) + '.' + (balls % 6) + ')');

    const st = m.striker || 'Striker';
    const nst = m.nonStriker || 'Non-Striker';
    const sB = (m.batters && m.batters[st]) || { runs: 0, balls: 0 };
    const nB = (m.batters && m.batters[nst]) || { runs: 0, balls: 0 };
    setTxt('bbStriker', st + '*');
    setTxt('bbStrikerRuns', (sB.runs || 0) + '(' + (sB.balls || 0) + ')');
    setTxt('bbNonStriker', nst);
    setTxt('bbNonStrikerRuns', (nB.runs || 0) + '(' + (nB.balls || 0) + ')');

    const bwName = m.currentBowler || 'Bowler';
    const bw = (m.bowlers && m.bowlers[bwName]) || { balls: 0, maidens: 0, runs: 0, wickets: 0 };
    setTxt('bbBowler', bwName);
    setTxt('bbBowlerFigs', Math.floor((bw.balls || 0)/6) + '.' + ((bw.balls || 0)%6) + '-' + (bw.maidens || 0) + '-' + (bw.runs || 0) + '-' + (bw.wickets || 0));
    applyBowlerIdentity(bwName);

    if (_currentOverBalls.length > 0) renderOverDots(_currentOverBalls);
    else if (_recentBalls.length > 0)  renderOverDots(_recentBalls.slice(-6));

    if (tvModeActive) refreshTVMode();
  }

  /* ═══════════════════════════════════════════════════════════════
     MULTI-CHANNEL SYNC
     ═══════════════════════════════════════════════════════════════ */
  let lastSeenBalls = -1;
  function handleNewMatchData(m){
    if (!m || !m.teamBatting) return;
    applyMatch(m);

    const shots = toArray(m.shotLog);
    const total = shots.length;

    cmlog('handleNewMatchData → shots:', total, '| lastSeen:', lastSeenBalls, '| overShots:', overShots.length);

    if (lastSeenBalls < 0){
      lastSeenBalls = total;
      replayCurrentOver(shots);
      if (total > 0){
        const last = shots[total - 1];
        if (last){
          window.__cricmaxInningsOver = false;
          playBall(last, true);
        }
      }
      return;
    }

    if (total > lastSeenBalls){
      lastSeenBalls = total;
      const last = shots[total - 1];
      if (last){
        window.__cricmaxInningsOver = false;
        playBall(last);
      }
      return;
    }

    if (overShots.length === 0 && total > 0){
      cmlog('Self-heal: rebuilding wagon from', total, 'shots');
      replayCurrentOver(shots);
    }
  }

  window.addEventListener('message', ev => {
    const d = ev.data || {};
    if ((d.type === 'SYNC_MATCH_STATE' || d.type === 'match_state') && (d.payload || d.match)) applyMatch(d.payload || d.match);
    if (d.type === 'TRIGGER_DELIVERY' && d.shot){ window.__cricmaxInningsOver = false; playBall(d.shot); }
  });

  try {
    const bc = new BroadcastChannel('cricmax_live');
    bc.onmessage = ev => {
      const d = ev.data || {};
      if (d.type === 'match_state' && d.match) handleNewMatchData(d.match);
    };
  } catch(e){}

  const firebaseConfig = {
    apiKey: "AIzaSyDJPJicTDB2KHtIQT-ePj225Ng1BGVffiw",
    authDomain: "cricket-8cb1b.firebaseapp.com",
    databaseURL: "https://cricket-8cb1b-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "cricket-8cb1b",
    storageBucket: "cricket-8cb1b.firebasestorage.app",
    messagingSenderId: "489545634269",
    appId: "1:489545634269:web:20b29fa190c4500670e634"
  };

  try {
    firebase.initializeApp(firebaseConfig);
    const fireDB = firebase.database();
    const urlParams = new URLSearchParams(window.location.search);
    const matchCode = urlParams.get('code');
    const refPath = matchCode ? ('cricmax/matches/' + matchCode) : 'cricmax/match_current';
    const startFirebase = function(){
      cmlog('Subscribing to Firebase:', refPath);
      fireDB.ref(refPath).on('value', snap => {
        const d = snap.val();
        if (d) {
          cmlog('Firebase snapshot received, keys:', Object.keys(d).slice(0, 15));
          cmlog('  shotLog type:', typeof d.shotLog, '| isArray:', Array.isArray(d.shotLog), '| length:', Array.isArray(d.shotLog) ? d.shotLog.length : 'n/a');
          handleNewMatchData(d);
        }
      });
    };
    if (window.requestIdleCallback) requestIdleCallback(startFirebase, { timeout: 3000 });
    else setTimeout(startFirebase, 1200);
  } catch(e){ console.warn('Firebase init error:', e); }

  window.addEventListener('message', function(ev){
    try {
      if (ev.source && ev.source !== window && ev.source.match && ev.source.match !== currentMatchState){
        handleNewMatchData(ev.source.match);
      }
    } catch(e){}
  });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible'){
      try {
        if (window.parent && window.parent !== window && window.parent.match){
          handleNewMatchData(window.parent.match);
        }
      } catch(e){}
    }
  });
  window.addEventListener('focus', function(){
    try {
      if (window.parent && window.parent !== window && window.parent.match){
        handleNewMatchData(window.parent.match);
      }
    } catch(e){}
  });

  try {
    const raw = localStorage.getItem('CricMax_Data');
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && parsed.match){
        applyMatch(parsed.match);
        const shots = toArray(parsed.match.shotLog);
        if (shots.length){
          lastSeenBalls = shots.length;
          replayCurrentOver(shots);
        }
      }
    }
  } catch(e){}

  window.__cmProgress(45);

  /* ═══════════════════════════════════════════════════════════════
     CAMERAS
     ═══════════════════════════════════════════════════════════════ */
  const CAM_MODES = {
    broadcast:{pos:new THREE.Vector3(0,16,32),target:new THREE.Vector3(0,1.2,2)},
    bowler:{pos:new THREE.Vector3(0,4.2,-22),target:new THREE.Vector3(0,1.0,9)},
    keeper:{pos:new THREE.Vector3(0,2.2,15),target:new THREE.Vector3(0,1.2,-5)},
    slip:{pos:new THREE.Vector3(3.0,2.2,14.0),target:new THREE.Vector3(0.35,1.0,8.8)},
    helmet:{pos:new THREE.Vector3(0.35,1.75,8.8),target:new THREE.Vector3(0,1.0,-10)},
    side:{pos:new THREE.Vector3(26,5,8),target:new THREE.Vector3(0,1,8)},
    drone:{pos:new THREE.Vector3(0,55,0.1),target:new THREE.Vector3(0,0,0)},
    follow:{pos:new THREE.Vector3(0,8,-6),target:new THREE.Vector3(0,0.5,9)}
  };
  let activeCam = 'broadcast', directorOn = true;
  const camPos = CAM_MODES.broadcast.pos.clone(), camTarget = CAM_MODES.broadcast.target.clone();

  function syncCamSelectors(mode){
    const a = document.getElementById('camSel'); if (a) a.value = mode;
    const b = document.getElementById('camSelMenu'); if (b) b.value = mode;
  }

  function setCamera(mode){
    if (!CAM_MODES[mode]) return;
    activeCam = mode;
    directorOn = false;
    const d = document.getElementById('btn-dir'); if (d) d.classList.remove('on');
    if (mode !== 'follow') camTarget.copy(CAM_MODES[mode].target);
    syncCamSelectors(mode);
  }

  function toggleDirector(){
    directorOn = !directorOn;
    const btn = document.getElementById('btn-dir');
    if (btn) btn.classList.toggle('on', directorOn);
    if (directorOn) activeCam = 'broadcast';
  }

  function triggerReplay(){ if (lastShot){ playBall(Object.assign({}, lastShot, { __isReplay: true })); } }
  function toggleFullscreen(){ if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  function simFeedScoringTab(){ playBall({ runs: [0,1,2,3,4,6][Math.floor(Math.random()*6)], bowlerType: 'fast_pace', angle: Math.random()*Math.PI*2 }); }

  /* ═══════════════════════════════════════════════════════════════
     RENDER LOOP
     ⚡ 3D renders whenever stadium is active OR an animation is
        playing — this keeps the stadium and wagon wheel in sync
        even when the user is viewing the wagon.
     ═══════════════════════════════════════════════════════════════ */
  const CM_TARGET_FPS = CM_DEVICE.tier === 0 ? 30 : (CM_DEVICE.tier === 1 ? 45 : 60);
  const CM_FRAME_INTERVAL = 1000 / CM_TARGET_FPS;
  let __cmLastRenderTime = 0;
  let __cmFirstFrame = false;
  let frameErrors = 0;

  function animate(t){
    requestAnimationFrame(animate);
    if (t - __cmLastRenderTime < CM_FRAME_INTERVAL) return;
    __cmLastRenderTime = t;

    const dt = Math.min((t - (animate.lastT || t)) / 1000, 0.1);
    const elapsed = t * 0.001;
    animate.lastT = t;

    try {
      if (stadium && stadium.update) stadium.update(dt, elapsed);
      if (typeof window.updateSparks    === 'function') { try { window.updateSparks(dt);    } catch(e){} }
      if (typeof window.updateParticles === 'function') { try { window.updateParticles(dt); } catch(e){} }
      if (typeof window.updateCrowd     === 'function') { try { window.updateCrowd(dt);     } catch(e){} }
      if (typeof window.updatePlayerUpgrades === 'function') { try { window.updatePlayerUpgrades(dt); } catch(e){} }
      fielders.forEach(f => f.update(dt, elapsed));
      RunningState.update(dt);
      if (!anim && !RunningState.active){
        if (strikerBat.batPivot) strikerBat.batPivot.rotation.x = -Math.PI / 4 + Math.max(0, Math.sin(elapsed * 4)) * 0.15;
        if (bowler && bowler.position.z < -20){
          bowler.position.z = -22 + Math.sin(elapsed * 1.2) * 0.25;
        }
        if (directorOn){ camPos.lerp(CAM_MODES.broadcast.pos, 0.03); camTarget.lerp(CAM_MODES.broadcast.target, 0.03); }
      }
      if (!directorOn && activeCam === 'follow'){
        const bp = ball.visible ? ball.position : new THREE.Vector3(0, 0, 8.8);
        camPos.lerp(new THREE.Vector3(bp.x * 0.6, Math.max(3.5, bp.y + 3.5), bp.z - 7), 0.08);
        camTarget.lerp(bp, 0.12);
      } else if (!directorOn && activeCam !== 'follow'){
        camPos.lerp(CAM_MODES[activeCam].pos, 0.05);
        camTarget.lerp(CAM_MODES[activeCam].target, 0.05);
      }
      camera.position.copy(camPos);
      camera.lookAt(camTarget);

      /* ⚡ Always render 3D when an animation is playing */
      if (stadiumViewActive ) {
        renderer.render(scene, camera);
      }

      if (!stadiumViewActive){
        const now = performance.now();
        const hasActiveAnim = overShots.some(s => (now - s.startTime) < (ANIM_DURATION + TRAIL_HOLD + 1200));
        const forceRedraw = __cmWagonForceUntil && now < __cmWagonForceUntil;
        if (hasActiveAnim || __cmWagonDirty || forceRedraw){
          try { drawWagonWheel(); } catch(e){ console.warn('wagon:', e); }
        }
      }

      if (!__cmFirstFrame){
        __cmFirstFrame = true;
        window.__cmProgress(100);
        const loaderEl = document.getElementById('cm-loader');
        if (loaderEl){
          loaderEl.classList.add('cm-hide');
          setTimeout(() => { try { loaderEl.remove(); } catch(e){} }, 500);
        }
        if (window.requestIdleCallback) {
          requestIdleCallback(function(){
            const list = CM_DEVICE.tier === 0
              ? ['environment.js','particles.js']
              : ['environment.js','crowd-animation.js','particles.js','stadium-detail.js'];
            Promise.all(list.map(function(src){
              return new Promise(function(res){
                const s = document.createElement('script');
                s.src = src; s.async = true;
                s.onload = res; s.onerror = res;
                document.head.appendChild(s);
              });
            })).then(function(){
              if (window.requestIdleCallback) requestIdleCallback(bootOptionalModules, { timeout: 1500 });
              else setTimeout(bootOptionalModules, 400);
            });
          }, { timeout: 1500 });
        } else {
          setTimeout(bootOptionalModules, 800);
        }
      }
    } catch(err){
      if (frameErrors < 3){ frameErrors++; console.error('[CricMax] frame error:', err); }
      try { if (stadiumViewActive) renderer.render(scene, camera); } catch(e2){}
    }
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize', function(){
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxDPR));
    renderer.setSize(innerWidth, innerHeight);
  });

  window.toggleMenu = toggleMenu;
  window.setSky = setSky;
  window.navTo = navTo;
  window.setCamera = setCamera;
  window.toggleDirector = toggleDirector;
  window.toggleWagonWheel = toggleWagonWheel;
  window.toggleStadiumView = toggleStadiumView;
  window.setStadiumView = setStadiumView;
  window.toggleTVMode = toggleTVMode;
  window.simFeedScoringTab = simFeedScoringTab;
  window.triggerReplay = triggerReplay;
  window.toggleAudio = toggleAudio;
  window.toggleFullscreen = toggleFullscreen;
  window.toggleAudioMenu = toggleAudioMenu;
  window.setAudioMode = setAudioMode;

  setStadiumView(false);

})();
</script>
